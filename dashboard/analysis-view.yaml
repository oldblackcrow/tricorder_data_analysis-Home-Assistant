views:
- type: sections
  max_columns: 3
  title: ANALYSIS
  path: tricorder-analysis
  icon: mdi:abacus
  sections:
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - sensor.tricorder_mission_catalog
      - sensor.tricorder_archived_missions
      - input_text.tric_archive_mission_id
      - sensor.tricorder_mission_events
      - sensor.tricorder_mission_scans
      - script.tricorder_archive_selected_mission
      - script.tricorder_restore_archived_mission
      - script.tricorder_delete_archived_mission
      content: |
        {% set selected_mid = states('input_text.tric_archive_mission_id') %}

        {# ======================================================== #} {# AVAILABLE MISSION CATALOG                                #} {# ======================================================== #}
        {% set catalog_results =
             state_attr('sensor.tricorder_mission_catalog', 'results') or [] %}

        {% set catalog_series = [] %}
        {% if catalog_results
              and catalog_results[0].get('series') %}
          {% set catalog_series = catalog_results[0]['series'] %}
        {% endif %}
        {% set catalog_columns = [] %} {% set catalog_values = [] %}
        {% if catalog_series %}
          {% set catalog_columns = catalog_series[0].get('columns', []) %}
          {% set catalog_values = catalog_series[0].get('values', []) %}
        {% endif %}

        {# ======================================================== #} {# ARCHIVED MISSION CATALOG                                 #} {# ======================================================== #}
        {% set archived_results =
             state_attr('sensor.tricorder_archived_missions', 'results') or [] %}

        {% set archived_series = [] %}
        {% if archived_results
              and archived_results[0].get('series') %}
          {% set archived_series = archived_results[0]['series'] %}
        {% endif %}
        {% set archived_columns = [] %} {% set archived_values = [] %}
        {% if archived_series %}
          {% set archived_columns = archived_series[0].get('columns', []) %}
          {% set archived_values = archived_series[0].get('values', []) %}
        {% endif %}

        {# ======================================================== #} {# SELECTED MISSION EVENTS                                  #} {# ======================================================== #}
        {% set event_results =
             state_attr('sensor.tricorder_mission_events', 'results') or [] %}

        {% set event_series = [] %}
        {% if event_results
              and event_results[0].get('series') %}
          {% set event_series = event_results[0]['series'] %}
        {% endif %}
        {% set event_columns = [] %} {% set event_values = [] %}
        {% if event_series %}
          {% set event_columns = event_series[0].get('columns', []) %}
          {% set event_values = event_series[0].get('values', []) %}
        {% endif %}

        {# ======================================================== #} {# SELECTED MISSION SCANS                                   #} {# ======================================================== #}
        {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}

        {% set scan_series = [] %}
        {% if scan_results
              and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}

        <style>

          .archive-card {
            background: #000;
            border-radius: 38px;
            padding: 10px 18px;
            overflow: hidden;
            font-family: "Antonio", "Arial Narrow", sans-serif;
            box-sizing: border-box;
          }

          .topline {
            height: 7px;
            background: #8296ff;
            margin: -5px -18px 9px -18px;
          }

          .bottomline {
            height: 7px;
            background: #8e87b6;
            margin: 10px -18px -5px -18px;
          }

          .title {
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.2px;
            margin-bottom: 9px;
          }

          .section-title {
            color: #8296ff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            margin: 10px 0 5px 0;
          }

          .mission-row {
            display: grid;
            grid-template-columns: 82px 1fr 110px;
            height: 32px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            background: #101010;
            transition: transform .08s ease;
          }

          .mission-row:hover {
            transform: scale(1.01);
          }

          .mission-row.selected {
            outline: 1px solid #8296ff;
            box-shadow: 0 0 7px #8296ff66;
          }

          .mission-code {
            background: #8296ff;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            border-radius: 16px 0 0 16px;
          }

          .mission-name {
            color: white;
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
          }

          .mission-date {
            background: #8e87b6;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            border-radius: 0 16px 16px 0;
          }


          /* ====================================================== */
          /* ARCHIVED MISSIONS                                      */
          /* ====================================================== */

          .archived-panel {
            margin-top: 9px;
          }

          .archived-panel summary {
            list-style: none;
            background: #151515;
            color: #8296ff;
            border: 1px solid #8296ff;
            border-radius: 16px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            user-select: none;
          }

          .archived-panel summary::-webkit-details-marker {
            display: none;
          }

          .archived-panel summary:hover {
            filter: brightness(1.2);
          }

          .archived-panel[open] summary {
            border-radius: 16px 16px 8px 8px;
            margin-bottom: 6px;
          }

          .archived-row {
            display: grid;
            grid-template-columns:
              72px
              minmax(0, 1fr)
              96px
              68px
              68px;
            height: 32px;
            margin: 4px 0;
            border-radius: 16px;
            overflow: hidden;
            background: #101010;
          }

          .archived-code {
            background: #77749a;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
          }

          .archived-name {
            color: white;
            display: flex;
            align-items: center;
            padding-left: 8px;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 10px;
            font-weight: 700;
          }

          .archived-date {
            color: #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 800;
          }

          .restore-button {
            background: #8296ff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: .4px;
          }

          .restore-button:hover {
            filter: brightness(1.15);
          }

          .delete-button {
            background: #ef4444;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: .4px;
          }

          .delete-button:hover {
            filter: brightness(1.15);
          }


          /* ====================================================== */
          /* SELECTED MISSION                                       */
          /* ====================================================== */

          .summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 5px;
          }

          .summary-box {
            background: #101010;
            border-radius: 16px;
            min-height: 44px;
            padding: 6px 9px;
            box-sizing: border-box;
          }

          .summary-label {
            font-size: 8px;
            color: #888;
            letter-spacing: 1px;
            font-weight: 800;
          }

          .summary-value {
            color: white;
            font-size: 14px;
            font-weight: 800;
            margin-top: 2px;
            overflow-wrap: anywhere;
          }

          .archive-button {
            background: #8e87b6;
            color: #000;
            border-radius: 16px;
            padding: 8px 12px;
            margin-top: 8px;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform .08s ease, filter .08s ease;
          }

          .archive-button:hover {
            transform: scale(1.01);
            filter: brightness(1.15);
          }


          /* ====================================================== */
          /* TIMELINE                                               */
          /* ====================================================== */

          .timeline-row {
            display: grid;
            grid-template-columns: 40px 110px 1fr 76px;
            height: 30px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            background: #101010;
          }

          .timeline-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
          }

          .timeline-time {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 800;
          }

          .timeline-event {
            display: flex;
            align-items: center;
            padding-left: 8px;
            color: black;
            font-size: 9px;
            font-weight: 900;
          }

          .timeline-elapsed {
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
          }

          .empty {
            color: #777;
            font-size: 11px;
            text-align: center;
            padding: 14px 5px;
          }

          ha-icon {
            --mdc-icon-size: 15px;
          }

        </style>

        <div class="archive-card">

          <div class="topline"></div>

          <div class="title">
            MISSION ARCHIVE
          </div>


          <div class="section-title">
            AVAILABLE MISSIONS
          </div>


          {% if catalog_values %}

            {% for row in catalog_values %}

              {% set time_i = catalog_columns.index('time') %}
              {% set code_i = catalog_columns.index('mission_code') %}
              {% set id_i = catalog_columns.index('mission_id') %}
              {% set name_i = catalog_columns.index('mission_name') %}
              {% set status_i = catalog_columns.index('status') %}

              {% set raw_time = row[time_i] %}
              {% set code = row[code_i] %}
              {% set mid = row[id_i] %}
              {% set name = row[name_i] | replace('_', ' ') %}
              {% set status = row[status_i] %}

              {% set dt = as_datetime(raw_time) %}

              {% if dt %}
                {% set local_dt = as_local(dt) %}
                {% set display_date =
                  local_dt.strftime('%m/%d/%Y %H:%M') %}
              {% else %}
                {% set display_date = raw_time %}
              {% endif %}

              <div
                class="mission-row {% if mid == selected_mid %}selected{% endif %}"
                onclick='document.querySelector("home-assistant").hass.callService(
                  "input_text",
                  "set_value",
                  {
                    entity_id:"input_text.tric_archive_mission_id",
                    value:{{ mid | to_json }}
                  }
                );'
              >

                <div class="mission-code">
                  {{ code }}
                </div>

                <div class="mission-name">
                  {{ name }}
                </div>

                <div class="mission-date">
                  {{ display_date }}
                </div>

              </div>

            {% endfor %}

          {% else %}

            <div class="empty">
              NO AVAILABLE MISSIONS
            </div>

          {% endif %}


          {# ======================================================== #}
          {# VIEW ARCHIVED MISSIONS                                   #}
          {# ======================================================== #}

          <details class="archived-panel">

            <summary>
              VIEW ARCHIVED MISSIONS ·
              {{ states('sensor.tricorder_archived_missions') }}
            </summary>


            {% if archived_values %}

              {% for row in archived_values %}

                {% set atime_i = archived_columns.index('time') %}
                {% set acode_i = archived_columns.index('mission_code') %}
                {% set aid_i = archived_columns.index('mission_id') %}
                {% set aname_i = archived_columns.index('mission_name') %}

                {% set araw_time = row[atime_i] %}
                {% set acode = row[acode_i] %}
                {% set amid = row[aid_i] %}
                {% set aname = row[aname_i] | replace('_', ' ') %}

                {% set adt = as_datetime(araw_time) %}

                {% if adt %}
                  {% set alocal_dt = as_local(adt) %}
                  {% set adisplay_date =
                    alocal_dt.strftime('%m/%d/%y %H:%M') %}
                {% else %}
                  {% set adisplay_date = araw_time %}
                {% endif %}


                <div class="archived-row">

                  <div class="archived-code">
                    {{ acode }}
                  </div>

                  <div class="archived-name">
                    {{ aname }}
                  </div>

                  <div class="archived-date">
                    {{ adisplay_date }}
                  </div>

                  <div
                    class="restore-button"
                    onclick='
                      event.stopPropagation();
                      document.querySelector("home-assistant").hass.callService(
                        "script",
                        "tricorder_restore_archived_mission",
                        {
                          mission_id:{{ amid | to_json }}
                        }
                      );
                    '
                  >
                    RESTORE
                  </div>

                  <div
                    class="delete-button"
                    onclick='
                      event.stopPropagation();

                      if (
                        window.confirm(
                          "PERMANENTLY DELETE " +
                          {{ acode | to_json }} +
                          "?\n\nThis removes all stored records for this mission and cannot be undone."
                        )
                      ) {
                        document.querySelector("home-assistant").hass.callService(
                          "script",
                          "tricorder_delete_archived_mission",
                          {
                            mission_id:{{ amid | to_json }}
                          }
                        );
                      }
                    '
                  >
                    DELETE
                  </div>

                </div>

              {% endfor %}

            {% else %}

              <div class="empty">
                NO ARCHIVED MISSIONS
              </div>

            {% endif %}

          </details>


          {# ======================================================== #}
          {# SELECTED MISSION                                         #}
          {# ======================================================== #}

          {% if event_values %}

            {% set first = event_values[0] %}
            {% set last = event_values[-1] %}

            {% set event_time_i = event_columns.index('time') %}
            {% set elapsed_i = event_columns.index('elapsed_seconds') %}
            {% set code_i = event_columns.index('mission_code') %}
            {% set name_i = event_columns.index('mission_name') %}
            {% set status_i = event_columns.index('status') %}

            {% set mission_code = first[code_i] %}
            {% set mission_name = first[name_i] | replace('_', ' ') %}
            {% set start_raw = first[event_time_i] %}
            {% set final_elapsed = last[elapsed_i] | float(0) %}
            {% set final_status = last[status_i] %}

            {% set start_dt = as_datetime(start_raw) %}

            {% if start_dt %}
              {% set start_local = as_local(start_dt) %}
              {% set start_display =
                start_local.strftime('%m/%d/%Y %H:%M:%S') %}
            {% else %}
              {% set start_display = start_raw %}
            {% endif %}

            {% set total_seconds = final_elapsed | int %}
            {% set hours = total_seconds // 3600 %}
            {% set minutes = (total_seconds % 3600) // 60 %}
            {% set seconds = total_seconds % 60 %}

            {% set duration =
              '%02d:%02d:%02d' | format(hours, minutes, seconds) %}


            <div class="section-title">
              SELECTED MISSION
            </div>

            <div class="summary">

              <div class="summary-box">

                <div class="summary-label">
                  MISSION
                </div>

                <div class="summary-value">
                  {{ mission_code }} · {{ mission_name }}
                </div>

              </div>


              <div class="summary-box">

                <div class="summary-label">
                  STATUS
                </div>

                <div class="summary-value">
                  {{ final_status | upper }}
                </div>

              </div>


              <div class="summary-box">

                <div class="summary-label">
                  START
                </div>

                <div
                  class="summary-value"
                  style="font-size:11px;"
                >
                  {{ start_display }}
                </div>

              </div>


              <div class="summary-box">

                <div class="summary-label">
                  DURATION · SCANS
                </div>

                <div class="summary-value">
                  {{ duration }} ·
                  {{ states('sensor.tricorder_mission_scans') }}
                </div>

              </div>

            </div>


            <div
              class="archive-button"
              onclick='document.querySelector("home-assistant").hass.callService(
                "script",
                "turn_on",
                {
                  entity_id:"script.tricorder_archive_selected_mission"
                }
              );'
            >
              ARCHIVE MISSION
            </div>


            <div class="section-title">
              MISSION TIMELINE
            </div>


            {% for row in event_values[:20] %}

              {% set time_i = event_columns.index('time') %}
              {% set elapsed_i = event_columns.index('elapsed_seconds') %}
              {% set event_i = event_columns.index('event') %}
              {% set status_i = event_columns.index('status') %}

              {% set event_time = row[time_i] %}
              {% set elapsed = row[elapsed_i] | float(0) %}
              {% set event = row[event_i] %}
              {% set event_status = row[status_i] %}

              {% set dt = as_datetime(event_time) %}

              {% if dt %}
                {% set local_dt = as_local(dt) %}
                {% set clock =
                  local_dt.strftime('%H:%M:%S') %}
                {% set full_time =
                  local_dt.strftime('%m/%d/%Y %H:%M:%S') %}
              {% else %}
                {% set clock = event_time %}
                {% set full_time = event_time %}
              {% endif %}

              {% set etotal = elapsed | int %}
              {% set eh = etotal // 3600 %}
              {% set em = (etotal % 3600) // 60 %}
              {% set es = etotal % 60 %}

              {% set elapsed_display =
                '+' ~ ('%02d:%02d:%02d' | format(eh, em, es)) %}


              {% if event == 'mission_start' %}

                {% set color = '#22c55e' %}
                {% set icon = 'mdi:play' %}
                {% set label = 'MISSION START' %}

              {% elif event == 'mission_end' %}

                {% set color = '#8e87b6' %}
                {% set icon = 'mdi:stop' %}
                {% set label = 'MISSION END' %}

              {% elif event == 'atmosphere_scan' %}

                {% set color = '#8296ff' %}
                {% set icon = 'mdi:weather-windy' %}
                {% set label = 'ATMOSPHERE SCAN' %}

              {% elif event == 'radiation_scan' %}

                {% set color = '#ef4444' %}
                {% set icon = 'mdi:radioactive' %}
                {% set label = 'RADIATION SCAN' %}

              {% elif event == 'audio_scan' %}

                {% set color = '#a78bfa' %}
                {% set icon = 'mdi:waveform' %}
                {% set label = 'AUDIO SCAN' %}

              {% elif event == 'color_scan' %}

                {% set color = '#22c55e' %}
                {% set icon = 'mdi:palette' %}
                {% set label = 'COLOR SCAN' %}

              {% elif event == 'orientation_scan' %}

                {% set color = '#f59e0b' %}
                {% set icon = 'mdi:compass' %}
                {% set label = 'ORIENTATION SCAN' %}

              {% elif event == 'magnetic_scan' %}

                {% set color = '#22d3ee' %}
                {% set icon = 'mdi:magnet' %}
                {% set label = 'MAGNETIC SCAN' %}

              {% elif event == 'location_update' %}

                {% set color = '#facc15' %}
                {% set icon = 'mdi:crosshairs-gps' %}
                {% set label = 'LOCATION FIX' %}

              {% else %}

                {% set color = '#77749a' %}
                {% set icon = 'mdi:database' %}
                {% set label =
                  event | replace('_',' ') | upper %}

              {% endif %}


              {# ---------------------------------------------------- #}
              {# FIND MATCHING DETAILED SCAN RECORD                   #}
              {# ---------------------------------------------------- #}

              {% set target_measurement = '' %}

              {% if event.endswith('_scan') %}

                {% set target_measurement =
                  'tricorder_' ~ event | replace('_scan','') %}

              {% elif event == 'location_update' %}

                {% set target_measurement =
                  'tricorder_location' %}

              {% endif %}


              {% set hit = namespace(
                found=false,
                columns=[],
                values=[]
              ) %}


              {% if target_measurement %}

                {% for series in scan_series %}

                  {% if series.get('name','') ==
                        target_measurement %}

                    {% set cols =
                      series.get('columns',[]) %}

                    {% set vals =
                      series.get('values',[]) %}

                    {% if 'time' in cols %}

                      {% set stime_i =
                        cols.index('time') %}

                      {% for scanrow in vals %}

                        {% if scanrow[stime_i] ==
                              event_time %}

                          {% set hit.found = true %}
                          {% set hit.columns = cols %}
                          {% set hit.values = scanrow %}

                        {% endif %}

                      {% endfor %}

                    {% endif %}

                  {% endif %}

                {% endfor %}

              {% endif %}


              {% set popup_html %}

                <div style="
                  background:#000;
                  color:#fff;
                  padding:14px;
                  font-family:Arial,sans-serif;
                ">

                  <div style="
                    font-size:18px;
                    font-weight:800;
                    margin-bottom:4px;
                  ">
                    {{ label }}
                  </div>

                  <div style="
                    color:#8296ff;
                    font-size:12px;
                    margin-bottom:12px;
                  ">
                    {{ full_time }} · {{ elapsed_display }}
                  </div>


                  {% if event_status not in
                        ['none', '', none] %}

                    <div style="
                      margin-bottom:10px;
                      font-size:12px;
                    ">

                      <b>STATUS:</b>
                      {{ event_status | upper }}

                    </div>

                  {% endif %}


                  {% if hit.found %}

                    {% for i in range(
                          hit.columns | count
                        ) %}

                      {% set field =
                        hit.columns[i] %}

                      {% set value =
                        hit.values[i] %}

                      {% if value is not none
                            and field not in [
                              'time',
                              'mission_code',
                              'mission_id',
                              'mission_name',
                              'scope',
                              'elapsed_seconds',
                              'status'
                            ] %}

                        <div style="
                          display:grid;
                          grid-template-columns:
                            1.25fr 1fr;
                          border-bottom:
                            1px solid #222;
                          padding:6px 0;
                          font-size:12px;
                        ">

                          <div style="color:#999;">
                            {{
                              field
                              | replace('_',' ')
                              | upper
                            }}
                          </div>

                          <div style="
                            text-align:right;
                            font-weight:700;
                          ">
                            {{ value }}
                          </div>

                        </div>

                      {% endif %}

                    {% endfor %}

                  {% else %}

                    <div style="
                      color:#888;
                      font-size:12px;
                    ">
                      MISSION EVENT
                    </div>

                  {% endif %}

                </div>

              {% endset %}


              <div
                class="timeline-row"
                onclick='this.dispatchEvent(
                  new CustomEvent(
                    "ll-custom",
                    {
                      bubbles:true,
                      composed:true,
                      detail:{
                        browser_mod:{
                          service:"browser_mod.popup",
                          data:{
                            title:{{ label | to_json }},
                            content:{{ popup_html | to_json }},
                            initial_style:"normal"
                          }
                        }
                      }
                    }
                  )
                )'
              >

                <div
                  class="timeline-icon"
                  style="background:{{ color }};"
                >
                  <ha-icon icon="{{ icon }}"></ha-icon>
                </div>

                <div class="timeline-time">
                  {{ clock }}
                </div>

                <div
                  class="timeline-event"
                  style="background:{{ color }};"
                >
                  {{ label }}
                </div>

                <div class="timeline-elapsed">
                  {{ elapsed_display }}
                </div>

              </div>

            {% endfor %}


          {% else %}

            <div class="section-title">
              SELECTED MISSION
            </div>

            <div class="empty">
              SELECT A MISSION ABOVE
            </div>

          {% endif %}


          <div class="bottomline"></div>

        </div>
      card_mod:
        style: |
          ha-card {
            background: #29364c !important;
            padding: 2px !important;
            border: none !important;
            border-radius: 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
          }
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - sensor.tricorder_mission_catalog
      - input_text.tric_archive_mission_id
      - input_text.tric_archive_compare_mission_id
      - sensor.tricorder_mission_events
      - sensor.tricorder_mission_scans
      - sensor.tricorder_comparison_mission_scans
      content: |
        {# ======================================================== #} {# MISSION A / MISSION B DATA                               #} {# ======================================================== #}
        {% set aid = states('input_text.tric_archive_mission_id') %} {% set bid = states('input_text.tric_archive_compare_mission_id') %}
        {% set event_results =
             state_attr('sensor.tricorder_mission_events', 'results') or [] %}

        {% set event_series = [] %} {% if event_results and event_results[0].get('series') %}
          {% set event_series = event_results[0]['series'] %}
        {% endif %}
        {% set event_columns = [] %} {% set event_values = [] %}
        {% if event_series %}
          {% set event_columns = event_series[0].get('columns', []) %}
          {% set event_values = event_series[0].get('values', []) %}
        {% endif %}

        {% set ar =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set br =
             state_attr('sensor.tricorder_comparison_mission_scans', 'results') or [] %}

        {% set aseries = [] %} {% set bseries = [] %}
        {% if ar and ar[0].get('series') %}
          {% set aseries = ar[0]['series'] %}
        {% endif %}
        {% if br and br[0].get('series') %}
          {% set bseries = br[0]['series'] %}
        {% endif %}

        {# Mission metadata comes from the catalog so same-name missions
           remain distinguishable by their start date/time. #}

        {% set cr =
             state_attr('sensor.tricorder_mission_catalog', 'results') or [] %}
        {% set cc = [] %} {% set cv = [] %}
        {% if cr and cr[0].get('series') %}
          {% set cc = cr[0]['series'][0].get('columns', []) %}
          {% set cv = cr[0]['series'][0].get('values', []) %}
        {% endif %}
        {% set ma = namespace(code='MISSION A', name='UNKNOWN', time='') %} {% set mb = namespace(code='MISSION B', name='NOT SELECTED', time='') %}
        {% if cv
              and 'mission_code' in cc
              and 'mission_id' in cc
              and 'mission_name' in cc
              and 'time' in cc %}

          {% set ci = cc.index('mission_code') %}
          {% set ii = cc.index('mission_id') %}
          {% set ni = cc.index('mission_name') %}
          {% set ti = cc.index('time') %}

          {% for row in cv %}
            {% if row[ii] == aid %}
              {% set ma.code = row[ci] %}
              {% set ma.name = row[ni] | replace('_',' ') %}
              {% set ma.time = row[ti] %}
            {% endif %}

            {% if row[ii] == bid %}
              {% set mb.code = row[ci] %}
              {% set mb.name = row[ni] | replace('_',' ') %}
              {% set mb.time = row[ti] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# ======================================================== #} {# TREND ROW MACRO                                          #} {# ======================================================== #}
        {% macro trend(series_name, field, label, unit, color, decimals=1) %}

          {% set sa = namespace(columns=[], rows=[]) %}
          {% set sb = namespace(columns=[], rows=[]) %}

          {% for series in aseries %}
            {% if series.get('name', '') == series_name %}
              {% set sa.columns = series.get('columns', []) %}
              {% set sa.rows = series.get('values', []) %}
            {% endif %}
          {% endfor %}

          {% for series in bseries %}
            {% if series.get('name', '') == series_name %}
              {% set sb.columns = series.get('columns', []) %}
              {% set sb.rows = series.get('values', []) %}
            {% endif %}
          {% endfor %}


          {% set pa = namespace(points=[]) %}
          {% set pb = namespace(points=[]) %}

          {% if field in sa.columns and 'elapsed_seconds' in sa.columns %}
            {% set afi = sa.columns.index(field) %}
            {% set aei = sa.columns.index('elapsed_seconds') %}

            {% for row in sa.rows %}
              {% if row[afi] is not none %}
                {% set pa.points =
                  pa.points + [{
                    'elapsed': row[aei] | float(0),
                    'value': row[afi] | float(0)
                  }] %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% if field in sb.columns and 'elapsed_seconds' in sb.columns %}
            {% set bfi = sb.columns.index(field) %}
            {% set bei = sb.columns.index('elapsed_seconds') %}

            {% for row in sb.rows %}
              {% if row[bfi] is not none %}
                {% set pb.points =
                  pb.points + [{
                    'elapsed': row[bei] | float(0),
                    'value': row[bfi] | float(0)
                  }] %}
              {% endif %}
            {% endfor %}
          {% endif %}


          {% if pa.points or pb.points %}

            {% set av = pa.points | map(attribute='value') | list %}
            {% set bv = pb.points | map(attribute='value') | list %}
            {% set ae = pa.points | map(attribute='elapsed') | list %}
            {% set be = pb.points | map(attribute='elapsed') | list %}

            {% set acount = av | count %}
            {% set bcount = bv | count %}

            {% set alatest = av[-1] if av else none %}
            {% set blatest = bv[-1] if bv else none %}

            {% set aavg = ((av | sum) / acount) if acount else none %}
            {% set bavg = ((bv | sum) / bcount) if bcount else none %}

            {% set allv = av + bv %}
            {% set alle = ae + be %}

            {% set minv = allv | min %}
            {% set maxv = allv | max %}
            {% set maxe = alle | max if alle else 0 %}

            {% set ga = namespace(points=[], coords=[]) %}
            {% set gb = namespace(points=[], coords=[]) %}


            {% for p in pa.points %}
              {% if acount == 1 %}
                {% set x = 78 %}
              {% elif maxe > 0 %}
                {% set x = 10 + (p.elapsed / maxe * 280) %}
              {% else %}
                {% set x = 78 %}
              {% endif %}

              {% if maxv == minv %}
                {% set y = 35 %}
              {% else %}
                {% set y = 60 - ((p.value - minv) / (maxv - minv) * 50) %}
              {% endif %}

              {% set ga.points = ga.points + [{'x':x,'y':y}] %}
              {% set ga.coords =
                ga.coords + [
                  (x|round(1)|string) ~ ',' ~ (y|round(1)|string)
                ] %}
            {% endfor %}


            {% for p in pb.points %}
              {% if bcount == 1 %}
                {% set x = 222 %}
              {% elif maxe > 0 %}
                {% set x = 10 + (p.elapsed / maxe * 280) %}
              {% else %}
                {% set x = 222 %}
              {% endif %}

              {% if maxv == minv %}
                {% set y = 35 %}
              {% else %}
                {% set y = 60 - ((p.value - minv) / (maxv - minv) * 50) %}
              {% endif %}

              {% set gb.points = gb.points + [{'x':x,'y':y}] %}
              {% set gb.coords =
                gb.coords + [
                  (x|round(1)|string) ~ ',' ~ (y|round(1)|string)
                ] %}
            {% endfor %}


            {% set popup_html %}

              <div style="
                background:#000;
                color:#fff;
                padding:16px;
                font-family:Arial,sans-serif;
              ">

                <div style="
                  font-size:20px;
                  font-weight:800;
                ">
                  {{ label }} · A / B
                </div>

                <div style="
                  margin-top:4px;
                  margin-bottom:14px;
                  font-size:11px;
                ">
                  <span style="color:#8296ff;">
                    A · {{ ma.code }}
                    {% if ma.time %} · {{ ma.time[5:10] | replace('-','/') }} {{ ma.time[11:16] }}{% endif %}
                  </span>

                  &nbsp;&nbsp;vs&nbsp;&nbsp;

                  <span style="color:#f59e0b;">
                    B · {{ mb.code }}
                    {% if mb.time %} · {{ mb.time[5:10] | replace('-','/') }} {{ mb.time[11:16] }}{% endif %}
                  </span>
                </div>


                <div style="
                  display:grid;
                  grid-template-columns:1fr 1fr 1fr;
                  gap:6px;
                  margin-bottom:12px;
                ">

                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#8296ff;">
                      MISSION A
                    </div>
                    <div style="font-size:18px;font-weight:800;">
                      {% if aavg is not none %}
                        {{ aavg | round(decimals) }} {{ unit }}
                      {% else %}
                        --
                      {% endif %}
                    </div>
                    <div style="font-size:9px;color:#777;">
                      {{ acount }} sample{% if acount != 1 %}s{% endif %}
                    </div>
                  </div>


                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#f59e0b;">
                      MISSION B
                    </div>
                    <div style="font-size:18px;font-weight:800;">
                      {% if bavg is not none %}
                        {{ bavg | round(decimals) }} {{ unit }}
                      {% else %}
                        --
                      {% endif %}
                    </div>
                    <div style="font-size:9px;color:#777;">
                      {{ bcount }} sample{% if bcount != 1 %}s{% endif %}
                    </div>
                  </div>


                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#aaa;">
                      Δ B − A
                    </div>
                    <div style="font-size:18px;font-weight:800;">
                      {% if aavg is not none and bavg is not none %}
                        {% set delta = bavg - aavg %}
                        {% if delta > 0 %}+{% endif %}{{ delta | round(decimals) }} {{ unit }}
                      {% else %}
                        --
                      {% endif %}
                    </div>
                  </div>

                </div>


                <div style="
                  border:1px solid #222;
                  border-radius:12px;
                  padding:8px;
                  background:#080808;
                ">

                  <svg
                    viewBox="0 0 300 70"
                    style="width:100%;height:180px;"
                  >

                    <line x1="10" y1="60" x2="290" y2="60" stroke="#333" />

                    {% if acount == 1 %}
                      {% set p = ga.points[0] %}
                      <line
                        x1="15" y1="{{ p.y }}"
                        x2="140" y2="{{ p.y }}"
                        stroke="#8296ff"
                        stroke-width="3"
                        stroke-linecap="round"
                      />
                      <circle cx="78" cy="{{ p.y }}" r="4" fill="#8296ff" />
                    {% elif acount > 1 %}
                      <polyline
                        points="{{ ga.coords | join(' ') }}"
                        fill="none"
                        stroke="#8296ff"
                        stroke-width="2.5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                      />
                      {% for p in ga.points %}
                        <circle cx="{{ p.x }}" cy="{{ p.y }}" r="3" fill="#8296ff" />
                      {% endfor %}
                    {% endif %}


                    {% if bcount == 1 %}
                      {% set p = gb.points[0] %}
                      <line
                        x1="160" y1="{{ p.y }}"
                        x2="285" y2="{{ p.y }}"
                        stroke="#f59e0b"
                        stroke-width="3"
                        stroke-linecap="round"
                      />
                      <circle cx="222" cy="{{ p.y }}" r="4" fill="#f59e0b" />
                    {% elif bcount > 1 %}
                      <polyline
                        points="{{ gb.coords | join(' ') }}"
                        fill="none"
                        stroke="#f59e0b"
                        stroke-width="2.5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                      />
                      {% for p in gb.points %}
                        <circle cx="{{ p.x }}" cy="{{ p.y }}" r="3" fill="#f59e0b" />
                      {% endfor %}
                    {% endif %}

                  </svg>

                </div>


                <div style="
                  display:flex;
                  justify-content:center;
                  gap:25px;
                  margin-top:10px;
                  font-size:11px;
                ">
                  <span style="color:#8296ff;">● MISSION A</span>
                  <span style="color:#f59e0b;">● MISSION B</span>
                </div>

              </div>

            {% endset %}


            <div
              class="trend-row"
              onclick='this.dispatchEvent(
                new CustomEvent(
                  "ll-custom",
                  {
                    bubbles:true,
                    composed:true,
                    detail:{
                      browser_mod:{
                        service:"browser_mod.popup",
                        data:{
                          title:{{ (label ~ " · A / B") | to_json }},
                          content:{{ popup_html | to_json }},
                          initial_style:"normal"
                        }
                      }
                    }
                  }
                )
              )'
            >

              <div
                class="trend-label"
                style="background:{{ color }};"
              >
                {{ label }}
              </div>


              <div class="trend-ab trend-a">
                <span>A</span>
                {% if alatest is not none %}
                  {{ alatest | round(decimals) }}
                  <small>{{ unit }}</small>
                {% else %}
                  --
                {% endif %}
              </div>


              <div class="trend-ab trend-b">
                <span>B</span>
                {% if blatest is not none %}
                  {{ blatest | round(decimals) }}
                  <small>{{ unit }}</small>
                {% else %}
                  --
                {% endif %}
              </div>


              <div class="trend-graph">

                <svg
                  viewBox="0 0 300 70"
                  preserveAspectRatio="none"
                >

                  <line
                    x1="5"
                    y1="60"
                    x2="295"
                    y2="60"
                    stroke="#222"
                    stroke-width="1"
                  />

                  {% if acount == 1 %}
                    {% set p = ga.points[0] %}
                    <line
                      x1="15" y1="{{ p.y }}"
                      x2="140" y2="{{ p.y }}"
                      stroke="#8296ff"
                      stroke-width="3"
                      stroke-linecap="round"
                      vector-effect="non-scaling-stroke"
                    />
                    <circle
                      cx="78" cy="{{ p.y }}" r="4"
                      fill="#8296ff"
                    />
                  {% elif acount > 1 %}
                    <polyline
                      points="{{ ga.coords | join(' ') }}"
                      fill="none"
                      stroke="#8296ff"
                      stroke-width="3"
                      vector-effect="non-scaling-stroke"
                    />
                    {% for p in ga.points %}
                      <circle cx="{{ p.x }}" cy="{{ p.y }}" r="4" fill="#8296ff" />
                    {% endfor %}
                  {% endif %}


                  {% if bcount == 1 %}
                    {% set p = gb.points[0] %}
                    <line
                      x1="160" y1="{{ p.y }}"
                      x2="285" y2="{{ p.y }}"
                      stroke="#f59e0b"
                      stroke-width="3"
                      stroke-linecap="round"
                      vector-effect="non-scaling-stroke"
                    />
                    <circle
                      cx="222" cy="{{ p.y }}" r="4"
                      fill="#f59e0b"
                    />
                  {% elif bcount > 1 %}
                    <polyline
                      points="{{ gb.coords | join(' ') }}"
                      fill="none"
                      stroke="#f59e0b"
                      stroke-width="3"
                      vector-effect="non-scaling-stroke"
                    />
                    {% for p in gb.points %}
                      <circle cx="{{ p.x }}" cy="{{ p.y }}" r="4" fill="#f59e0b" />
                    {% endfor %}
                  {% endif %}

                </svg>

              </div>

            </div>

          {% endif %}

        {% endmacro %}

        <style>

          .analysis-card {
            background:#000;
            border-radius:38px;
            padding:10px 18px;
            overflow:hidden;
            box-sizing:border-box;
            font-family:"Antonio","Arial Narrow",sans-serif;
          }

          .topline {
            height:7px;
            background:#f59e0b;
            margin:-5px -18px 9px -18px;
          }

          .bottomline {
            height:7px;
            background:#8296ff;
            margin:10px -18px -5px -18px;
          }

          .title {
            color:#fff;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1.2px;
            margin-bottom:3px;
          }

          .mission {
            color:#8296ff;
            text-align:center;
            font-size:10px;
            font-weight:800;
            letter-spacing:.8px;
            margin-bottom:9px;
          }

          .section {
            color:#888;
            font-size:9px;
            font-weight:800;
            letter-spacing:1.1px;
            margin:9px 0 4px 1px;
          }

          .trend-row {
            height:50px;
            display:grid;
            grid-template-columns:105px 72px 72px 1fr;
            margin:5px 0;
            border-radius:18px;
            overflow:hidden;
            background:#0b0b0b;
            cursor:pointer;
          }

          .trend-label {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:9px;
            font-weight:900;
            padding:0 6px;
          }

          .trend-ab {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:3px;
            background:#000;
            color:#fff;
            font-size:13px;
            font-weight:900;
            white-space:nowrap;
          }

          .trend-ab span {
            font-size:8px;
            font-weight:900;
          }

          .trend-a span {
            color:#8296ff;
          }

          .trend-b span {
            color:#f59e0b;
          }

          .trend-ab small {
            color:#777;
            font-size:7px;
            font-weight:700;
          }

          .trend-graph {
            padding:3px 8px 3px 2px;
            background:#070707;
          }

          .trend-graph svg {
            display:block;
            width:100%;
            height:44px;
          }

          .empty {
            color:#777;
            text-align:center;
            padding:16px 4px;
            font-size:11px;
          }

        </style>

        <div class="analysis-card">

          <div class="topline"></div>

          <div class="title">
            MISSION ANALYSIS
          </div>

          <div class="mission">
            <span style="color:#8296ff;">
              A · {{ ma.code }}
              {% if ma.time %} · {{ ma.time[5:10] | replace('-','/') }} {{ ma.time[11:16] }}{% endif %}
            </span>

            &nbsp;&nbsp;VS&nbsp;&nbsp;

            <span style="color:#f59e0b;">
              B · {{ mb.code }}
              {% if mb.time %} · {{ mb.time[5:10] | replace('-','/') }} {{ mb.time[11:16] }}{% endif %}
            </span>
          </div>


          {% if aseries %}

            <div class="section">
              ATMOSPHERIC ANALYSIS
            </div>

            {{ trend(
              'tricorder_atmosphere',
              'temperature_f',
              'TEMPERATURE',
              '°F',
              '#f59e0b',
              1
            ) }}

            {{ trend(
              'tricorder_atmosphere',
              'humidity_percent',
              'HUMIDITY',
              '%',
              '#8296ff',
              1
            ) }}

            {{ trend(
              'tricorder_atmosphere',
              'pressure_hpa',
              'PRESSURE',
              'hPa',
              '#22c55e',
              1
            ) }}

            {{ trend(
              'tricorder_atmosphere',
              'eco2_ppm',
              'eCO₂',
              'ppm',
              '#22d3ee',
              0
            ) }}

            {{ trend(
              'tricorder_atmosphere',
              'tvoc_ppb',
              'TVOC',
              'ppb',
              '#a78bfa',
              0
            ) }}


            <div class="section">
              RADIATION ANALYSIS
            </div>

            {{ trend(
              'tricorder_radiation',
              'cpm',
              'CPM',
              'CPM',
              '#ef4444',
              1
            ) }}

            {{ trend(
              'tricorder_radiation',
              'dose_usvh',
              'DOSE',
              'µSv/h',
              '#ff8c42',
              3
            ) }}


            <div class="section">
              AUDIO ANALYSIS
            </div>

            {{ trend(
              'tricorder_audio',
              'relative_db',
              'RELATIVE',
              'dB',
              '#a78bfa',
              1
            ) }}

            {{ trend(
              'tricorder_audio',
              'peak_db',
              'PEAK',
              'dB',
              '#22d3ee',
              1
            ) }}


            {{ trend(
              'tricorder_magnetic',
              'magnetic_field_ut',
              'MAGNETIC FIELD',
              'µT',
              '#facc15',
              2
            ) }}


            <div class="section">
              THERMAL ANALYSIS
            </div>

            {{ trend(
              'tricorder_thermal',
              'center_f',
              'THERMAL CENTER',
              '°F',
              '#f59e0b',
              1
            ) }}

            {{ trend(
              'tricorder_thermal',
              'min_f',
              'THERMAL MIN',
              '°F',
              '#3b82f6',
              1
            ) }}

            {{ trend(
              'tricorder_thermal',
              'max_f',
              'THERMAL MAX',
              '°F',
              '#ef4444',
              1
            ) }}


            <div class="section">
              DISTANCE ANALYSIS
            </div>

            {{ trend(
              'tricorder_distance',
              'distance_m',
              'LIDAR DISTANCE',
              'm',
              '#22c55e',
              2
            ) }}


            <div class="section">
              ULTRAVIOLET ANALYSIS
            </div>

            {{ trend(
              'tricorder_uv',
              'uv_index',
              'UV INDEX',
              '',
              '#a78bfa',
              2
            ) }}

            {{ trend(
              'tricorder_uv',
              'uv_raw',
              'UV RAW',
              '',
              '#22d3ee',
              0
            ) }}

          {% else %}

            <div class="empty">
              SELECT AN ARCHIVED MISSION
            </div>

          {% endif %}


          <div class="bottomline"></div>

        </div>
      card_mod:
        style: |
          ha-card {
            background: #29364c !important;
            padding: 2px !important;
            border: none !important;
            border-radius: 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
          }
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - sensor.tricorder_mission_catalog
      - input_text.tric_archive_mission_id
      - input_text.tric_archive_compare_mission_id
      - sensor.tricorder_mission_scans
      - sensor.tricorder_comparison_mission_scans
      content: |
        {% set aid = states('input_text.tric_archive_mission_id') %} {% set bid = states('input_text.tric_archive_compare_mission_id') %}
        {# ======================================================== #} {# CATALOG                                                  #} {# ======================================================== #}
        {% set cr =
             state_attr('sensor.tricorder_mission_catalog','results') or [] %}

        {% set cc = [] %} {% set cv = [] %}
        {% if cr and cr[0].get('series') %}
          {% set cc = cr[0]['series'][0].get('columns',[]) %}
          {% set cv = cr[0]['series'][0].get('values',[]) %}
        {% endif %}
        {% set ma = namespace(code='MISSION A', name='UNKNOWN', time='') %} {% set mb = namespace(code='MISSION B', name='NOT SELECTED', time='') %}
        {% if cv %}
          {% set ci = cc.index('mission_code') %}
          {% set ii = cc.index('mission_id') %}
          {% set ni = cc.index('mission_name') %}
          {% set ti = cc.index('time') %}

          {% for row in cv %}
            {% if row[ii] == aid %}
              {% set ma.code = row[ci] %}
              {% set ma.name = row[ni] | replace('_',' ') %}
              {% set ma.time = row[ti] %}
            {% endif %}

            {% if row[ii] == bid %}
              {% set mb.code = row[ci] %}
              {% set mb.name = row[ni] | replace('_',' ') %}
              {% set mb.time = row[ti] %}
            {% endif %}
          {% endfor %}
        {% endif %}

        {# ======================================================== #} {# SCAN SERIES                                              #} {# ======================================================== #}
        {% set ar =
             state_attr('sensor.tricorder_mission_scans','results') or [] %}

        {% set br =
             state_attr('sensor.tricorder_comparison_mission_scans','results') or [] %}

        {% set aseries = [] %} {% set bseries = [] %}
        {% if ar and ar[0].get('series') %}
          {% set aseries = ar[0]['series'] %}
        {% endif %}
        {% if br and br[0].get('series') %}
          {% set bseries = br[0]['series'] %}
        {% endif %}

        {# ======================================================== #} {# COMPARISON MACRO                                         #} {# ======================================================== #}
        {% macro compare(measurement, field, label, unit, decimals=1) %}

          {% set sa = namespace(columns=[],rows=[]) %}
          {% set sb = namespace(columns=[],rows=[]) %}

          {% for s in aseries %}
            {% if s.get('name','') == measurement %}
              {% set sa.columns = s.get('columns',[]) %}
              {% set sa.rows = s.get('values',[]) %}
            {% endif %}
          {% endfor %}

          {% for s in bseries %}
            {% if s.get('name','') == measurement %}
              {% set sb.columns = s.get('columns',[]) %}
              {% set sb.rows = s.get('values',[]) %}
            {% endif %}
          {% endfor %}


          {% set pa = namespace(points=[]) %}
          {% set pb = namespace(points=[]) %}


          {% if field in sa.columns and 'elapsed_seconds' in sa.columns %}

            {% set afi = sa.columns.index(field) %}
            {% set aei = sa.columns.index('elapsed_seconds') %}

            {% for row in sa.rows %}
              {% if row[afi] is not none %}
                {% set pa.points =
                  pa.points + [{
                    'elapsed':row[aei]|float(0),
                    'value':row[afi]|float(0)
                  }] %}
              {% endif %}
            {% endfor %}

          {% endif %}


          {% if field in sb.columns and 'elapsed_seconds' in sb.columns %}

            {% set bfi = sb.columns.index(field) %}
            {% set bei = sb.columns.index('elapsed_seconds') %}

            {% for row in sb.rows %}
              {% if row[bfi] is not none %}
                {% set pb.points =
                  pb.points + [{
                    'elapsed':row[bei]|float(0),
                    'value':row[bfi]|float(0)
                  }] %}
              {% endif %}
            {% endfor %}

          {% endif %}


          {% if pa.points and pb.points %}

            {% set av =
              pa.points | map(attribute='value') | list %}

            {% set bv =
              pb.points | map(attribute='value') | list %}

            {% set ae =
              pa.points | map(attribute='elapsed') | list %}

            {% set be =
              pb.points | map(attribute='elapsed') | list %}

            {% set aavg = (av|sum)/(av|count) %}
            {% set bavg = (bv|sum)/(bv|count) %}
            {% set delta = bavg - aavg %}

            {% set allv = av + bv %}
            {% set alle = ae + be %}

            {% set minv = allv|min %}
            {% set maxv = allv|max %}
            {% set maxe = alle|max %}

            {% set ga = namespace(coords=[],points=[]) %}
            {% set gb = namespace(coords=[],points=[]) %}


            {% for p in pa.points %}

              {% if maxe > 0 %}
                {% set x = 10 + (p.elapsed/maxe*280) %}
              {% else %}
                {% set x = 150 %}
              {% endif %}

              {% if maxv == minv %}
                {% set y = 35 %}
              {% else %}
                {% set y =
                  60 - ((p.value-minv)/(maxv-minv)*50) %}
              {% endif %}

              {% set ga.coords =
                ga.coords + [
                  (x|round(1)|string) ~ ',' ~
                  (y|round(1)|string)
                ] %}

              {% set ga.points =
                ga.points + [{'x':x,'y':y}] %}

            {% endfor %}


            {% for p in pb.points %}

              {% if maxe > 0 %}
                {% set x = 10 + (p.elapsed/maxe*280) %}
              {% else %}
                {% set x = 150 %}
              {% endif %}

              {% if maxv == minv %}
                {% set y = 35 %}
              {% else %}
                {% set y =
                  60 - ((p.value-minv)/(maxv-minv)*50) %}
              {% endif %}

              {% set gb.coords =
                gb.coords + [
                  (x|round(1)|string) ~ ',' ~
                  (y|round(1)|string)
                ] %}

              {% set gb.points =
                gb.points + [{'x':x,'y':y}] %}

            {% endfor %}


            {% set popup_html %}

              <div style="
                background:#000;
                color:#fff;
                padding:16px;
                font-family:Arial,sans-serif;
              ">

                <div style="
                  font-size:20px;
                  font-weight:800;
                ">
                  {{ label }} COMPARISON
                </div>

                <div style="
                  margin-top:4px;
                  margin-bottom:14px;
                  font-size:12px;
                ">

                  <span style="color:#8296ff;">
                    A · {{ ma.code }}
                  </span>

                  &nbsp;&nbsp;vs&nbsp;&nbsp;

                  <span style="color:#f59e0b;">
                    B · {{ mb.code }}
                  </span>

                </div>


                <div style="
                  display:grid;
                  grid-template-columns:1fr 1fr 1fr;
                  gap:6px;
                  margin-bottom:12px;
                ">

                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#8296ff;">
                      MISSION A AVG
                    </div>

                    <div style="font-size:18px;font-weight:800;">
                      {{ aavg|round(decimals) }} {{ unit }}
                    </div>

                    <div style="font-size:9px;color:#777;">
                      {{ av|count }} samples
                    </div>
                  </div>


                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#f59e0b;">
                      MISSION B AVG
                    </div>

                    <div style="font-size:18px;font-weight:800;">
                      {{ bavg|round(decimals) }} {{ unit }}
                    </div>

                    <div style="font-size:9px;color:#777;">
                      {{ bv|count }} samples
                    </div>
                  </div>


                  <div style="
                    background:#111;
                    border-radius:12px;
                    padding:9px;
                  ">
                    <div style="font-size:9px;color:#aaa;">
                      Δ B − A
                    </div>

                    <div style="font-size:18px;font-weight:800;">
                      {% if delta > 0 %}+{% endif %}
                      {{ delta|round(decimals) }}
                      {{ unit }}
                    </div>
                  </div>

                </div>


                <div style="
                  border:1px solid #222;
                  border-radius:12px;
                  padding:8px;
                  background:#080808;
                ">

                  <svg
                    viewBox="0 0 300 70"
                    style="width:100%;height:180px;"
                  >

                    <line
                      x1="10"
                      y1="60"
                      x2="290"
                      y2="60"
                      stroke="#333"
                    />

                    {% if ga.points|count == 1 and gb.points|count == 1 %}
                      {% if maxv == minv %}
                        {% set ay = 35 %}
                        {% set by = 35 %}
                      {% else %}
                        {% set ay = 60 - ((aavg-minv)/(maxv-minv)*50) %}
                        {% set by = 60 - ((bavg-minv)/(maxv-minv)*50) %}
                      {% endif %}

                      <line
                        x1="55"
                        y1="{{ ay }}"
                        x2="245"
                        y2="{{ by }}"
                        stroke="#666"
                        stroke-width="2.5"
                      />

                      <circle cx="55" cy="{{ ay }}" r="4" fill="#8296ff" />
                      <circle cx="245" cy="{{ by }}" r="4" fill="#f59e0b" />

                    {% else %}

                      {% if ga.points|count > 1 %}
                        <polyline
                          points="{{ ga.coords|join(' ') }}"
                          fill="none"
                          stroke="#8296ff"
                          stroke-width="2.5"
                        />
                      {% endif %}

                      {% for p in ga.points %}
                        <circle
                          cx="{{ p.x }}"
                          cy="{{ p.y }}"
                          r="3"
                          fill="#8296ff"
                        />
                      {% endfor %}

                      {% if gb.points|count > 1 %}
                        <polyline
                          points="{{ gb.coords|join(' ') }}"
                          fill="none"
                          stroke="#f59e0b"
                          stroke-width="2.5"
                        />
                      {% endif %}

                      {% for p in gb.points %}
                        <circle
                          cx="{{ p.x }}"
                          cy="{{ p.y }}"
                          r="3"
                          fill="#f59e0b"
                        />
                      {% endfor %}

                    {% endif %}

                  </svg>

                </div>


                <div style="
                  display:flex;
                  justify-content:center;
                  gap:25px;
                  margin-top:10px;
                  font-size:11px;
                ">

                  <span style="color:#8296ff;">
                    ● A · {{ ma.code }}
                  </span>

                  <span style="color:#f59e0b;">
                    ● B · {{ mb.code }}
                  </span>

                </div>

              </div>

            {% endset %}


            <div
              class="cmp-row"
              onclick='this.dispatchEvent(
                new CustomEvent(
                  "ll-custom",
                  {
                    bubbles:true,
                    composed:true,
                    detail:{
                      browser_mod:{
                        service:"browser_mod.popup",
                        data:{
                          title:{{ (label ~ " COMPARISON")|to_json }},
                          content:{{ popup_html|to_json }},
                          initial_style:"normal"
                        }
                      }
                    }
                  }
                )
              )'
            >

              <div class="cmp-label">
                {{ label }}
              </div>

              <div class="cmp-a">
                <span>A</span>
                {{ aavg|round(decimals) }}
                <small>{{ unit }}</small>
              </div>

              <div class="cmp-b">
                <span>B</span>
                {{ bavg|round(decimals) }}
                <small>{{ unit }}</small>
              </div>

              <div class="cmp-delta">
                {% if delta > 0 %}+{% endif %}
                {{ delta|round(decimals) }}
              </div>

              <div class="cmp-graph">

                <svg
                  viewBox="0 0 300 70"
                  preserveAspectRatio="none"
                >

                  {% if ga.points|count == 1 and gb.points|count == 1 %}
                    {% if maxv == minv %}
                      {% set ay = 35 %}
                      {% set by = 35 %}
                    {% else %}
                      {% set ay = 60 - ((aavg-minv)/(maxv-minv)*50) %}
                      {% set by = 60 - ((bavg-minv)/(maxv-minv)*50) %}
                    {% endif %}

                    <line
                      x1="55"
                      y1="{{ ay }}"
                      x2="245"
                      y2="{{ by }}"
                      stroke="#666"
                      stroke-width="3"
                      vector-effect="non-scaling-stroke"
                    />

                    <circle cx="55" cy="{{ ay }}" r="4" fill="#8296ff" />
                    <circle cx="245" cy="{{ by }}" r="4" fill="#f59e0b" />

                  {% else %}

                    {% if ga.points|count > 1 %}
                      <polyline
                        points="{{ ga.coords|join(' ') }}"
                        fill="none"
                        stroke="#8296ff"
                        stroke-width="3"
                        vector-effect="non-scaling-stroke"
                      />
                    {% endif %}

                    {% for p in ga.points %}
                      <circle
                        cx="{{ p.x }}"
                        cy="{{ p.y }}"
                        r="4"
                        fill="#8296ff"
                      />
                    {% endfor %}

                    {% if gb.points|count > 1 %}
                      <polyline
                        points="{{ gb.coords|join(' ') }}"
                        fill="none"
                        stroke="#f59e0b"
                        stroke-width="3"
                        vector-effect="non-scaling-stroke"
                      />
                    {% endif %}

                    {% for p in gb.points %}
                      <circle
                        cx="{{ p.x }}"
                        cy="{{ p.y }}"
                        r="4"
                        fill="#f59e0b"
                      />
                    {% endfor %}

                  {% endif %}

                </svg>

              </div>

            </div>

          {% endif %}

        {% endmacro %}

        <style>

          .comparison-card {
            background:#000;
            border-radius:38px;
            padding:10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }

          .topline {
            height:7px;
            background:#8296ff;
            margin:-5px -18px 9px -18px;
          }

          .bottomline {
            height:7px;
            background:#f59e0b;
            margin:10px -18px -5px -18px;
          }

          .title {
            color:white;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1.2px;
          }

          .versus {
            display:grid;
            grid-template-columns:1fr 38px 1fr;
            gap:5px;
            margin:9px 0;
          }

          .mission-box {
            background:#111;
            border-radius:14px;
            padding:7px 9px;
            text-align:center;
          }

          .mission-box.a {
            border:1px solid #8296ff;
          }

          .mission-box.b {
            border:1px solid #f59e0b;
          }

          .mission-letter {
            font-size:8px;
            font-weight:900;
          }

          .a .mission-letter {
            color:#8296ff;
          }

          .b .mission-letter {
            color:#f59e0b;
          }

          .mission-code {
            color:#fff;
            font-size:13px;
            font-weight:900;
          }

          .mission-name {
            color:#777;
            font-size:11px;
          }

          .mission-time {
            color:#aaa;
            font-size:11px;
            margin-top:2px;
          }

          .vs {
            color:#aaa;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:900;
            font-size:11px;
          }

          .section {
            color:#888;
            font-size:9px;
            font-weight:800;
            letter-spacing:1px;
            margin:9px 0 4px;
          }

          .select-row {
            height:31px;
            display:grid;
            grid-template-columns:85px 1fr 92px;
            margin:4px 0;
            border-radius:16px;
            overflow:hidden;
            cursor:pointer;
            background:#111;
          }

          .select-row.selected {
            outline:1px solid #f59e0b;
            box-shadow:0 0 6px #f59e0b55;
          }

          .select-code {
            background:#f59e0b;
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
            font-weight:900;
          }

          .select-name {
            color:white;
            display:flex;
            align-items:center;
            padding-left:9px;
            font-size:14px;
            font-weight:800;
          }

          .select-time {
            color:#aaa;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
            font-weight:700;
            border-left:1px solid #222;
          }

          .cmp-row {
            display:grid;
            grid-template-columns:95px 72px 72px 60px 1fr;
            height:45px;
            margin:5px 0;
            border-radius:17px;
            overflow:hidden;
            background:#090909;
            cursor:pointer;
          }

          .cmp-label {
            background:#333;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:9px;
            font-weight:900;
          }

          .cmp-a,
          .cmp-b,
          .cmp-delta {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:3px;
            color:white;
            font-size:13px;
            font-weight:900;
          }

          .cmp-a span {
            color:#8296ff;
            font-size:8px;
          }

          .cmp-b span {
            color:#f59e0b;
            font-size:8px;
          }

          .cmp-a small,
          .cmp-b small {
            color:#777;
            font-size:7px;
          }

          .cmp-delta {
            color:#aaa;
            font-size:10px;
            border-left:1px solid #222;
          }

          .cmp-graph {
            padding:3px 5px;
            background:#050505;
          }

          .cmp-graph svg {
            width:100%;
            height:39px;
            display:block;
          }

          .empty {
            color:#777;
            text-align:center;
            padding:14px;
            font-size:11px;
          }

        </style>

        <div class="comparison-card">

          <div class="topline"></div>

          <div class="title">
            MISSION COMPARISON
          </div>


          <div class="versus">

            <div class="mission-box a">
              <div class="mission-letter">
                MISSION A
              </div>

              <div class="mission-code">
                {{ ma.code }}
              </div>

              <div class="mission-name">
                {{ ma.name }}
              </div>

              <div class="mission-time">
                {% if ma.time %}
                  {{ ma.time[5:10] | replace('-', '/') }} · {{ ma.time[11:16] }}
                {% endif %}
              </div>
            </div>


            <div class="vs">
              VS
            </div>


            <div class="mission-box b">

              <div class="mission-letter">
                MISSION B
              </div>

              <div class="mission-code">
                {{ mb.code }}
              </div>

              <div class="mission-name">
                {{ mb.name }}
              </div>

              <div class="mission-time">
                {% if mb.time %}
                  {{ mb.time[5:10] | replace('-', '/') }} · {{ mb.time[11:16] }}
                {% endif %}
              </div>

            </div>

          </div>


          <div class="section">
            SELECT REFERENCE MISSION B
          </div>


          {% if cv %}

            {% for row in cv %}

              {% set code = row[cc.index('mission_code')] %}
              {% set mid = row[cc.index('mission_id')] %}
              {% set name =
                row[cc.index('mission_name')]
                | replace('_',' ') %}
              {% set stamp = row[cc.index('time')] %}

              {% if mid != aid %}

                <div
                  class="select-row {% if mid == bid %}selected{% endif %}"
                  onclick='document.querySelector("home-assistant").hass.callService(
                    "input_text",
                    "set_value",
                    {
                      entity_id:"input_text.tric_archive_compare_mission_id",
                      value:{{ mid|to_json }}
                    }
                  );'
                >

                  <div class="select-code">
                    {{ code }}
                  </div>

                  <div class="select-name">
                    {{ name }}
                  </div>

                  <div class="select-time">
                    {{ stamp[5:10] | replace('-', '/') }} · {{ stamp[11:16] }}
                  </div>

                </div>

              {% endif %}

            {% endfor %}

          {% endif %}


          {% if bid not in ['','unknown','unavailable']
                and bid != aid
                and bseries %}

            <div class="section">
              ATMOSPHERIC COMPARISON
            </div>

            {{ compare(
              'tricorder_atmosphere',
              'temperature_f',
              'TEMPERATURE',
              '°F',
              1
            ) }}

            {{ compare(
              'tricorder_atmosphere',
              'humidity_percent',
              'HUMIDITY',
              '%',
              1
            ) }}

            {{ compare(
              'tricorder_atmosphere',
              'pressure_hpa',
              'PRESSURE',
              'hPa',
              1
            ) }}

            {{ compare(
              'tricorder_atmosphere',
              'eco2_ppm',
              'eCO₂',
              'ppm',
              0
            ) }}

            {{ compare(
              'tricorder_atmosphere',
              'tvoc_ppb',
              'TVOC',
              'ppb',
              0
            ) }}


            <div class="section">
              RADIATION COMPARISON
            </div>

            {{ compare(
              'tricorder_radiation',
              'cpm',
              'CPM',
              'CPM',
              1
            ) }}

            {{ compare(
              'tricorder_radiation',
              'dose_usvh',
              'DOSE',
              'µSv/h',
              3
            ) }}


            <div class="section">
              THERMAL COMPARISON
            </div>

            {{ compare(
              'tricorder_thermal',
              'center_f',
              'THERMAL CENTER',
              '°F',
              1
            ) }}

            {{ compare(
              'tricorder_thermal',
              'min_f',
              'THERMAL MIN',
              '°F',
              1
            ) }}

            {{ compare(
              'tricorder_thermal',
              'max_f',
              'THERMAL MAX',
              '°F',
              1
            ) }}


            <div class="section">
              DISTANCE COMPARISON
            </div>

            {{ compare(
              'tricorder_distance',
              'distance_m',
              'LIDAR DISTANCE',
              'm',
              2
            ) }}


            <div class="section">
              ULTRAVIOLET COMPARISON
            </div>

            {{ compare(
              'tricorder_uv',
              'uv_index',
              'UV INDEX',
              '',
              2
            ) }}

            {{ compare(
              'tricorder_uv',
              'uv_raw',
              'UV RAW',
              '',
              0
            ) }}

          {% else %}

            <div class="empty">
              SELECT A REFERENCE MISSION ABOVE
            </div>

          {% endif %}


          <div class="bottomline"></div>

        </div>
      card_mod:
        style: |
          ha-card {
            background: #29364c !important;
            padding: 2px !important;
            border: none !important;
            border-radius: 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
          }
  cards: []
  badges: []
