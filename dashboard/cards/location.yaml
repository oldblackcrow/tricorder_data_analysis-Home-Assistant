
type: custom:html-template-card
ignore_line_breaks: true
entities:
  - input_text.tric_archive_mission_id
  - sensor.tricorder_mission_scans
content: |
  {# Show the most recent valid position belonging to the selected mission. #}
  {% set selected_mid = states('input_text.tric_archive_mission_id') | trim %}
  {% set results = state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
  {% set series_list = results[0].get('series', []) if results else [] %}
  {% set loc = namespace(columns=[], rows=[]) %}
  {% for series in series_list %}
    {% if series.get('name', '') == 'tricorder_location' %}
      {% set loc.columns = series.get('columns', []) %}
      {% set loc.rows = series.get('values', []) %}
    {% endif %}
  {% endfor %}

  {# No fallback to current GPS helpers or a previous mission. #}
  {% set fix = namespace(lat=none, lon=none, time='--', source='') %}
  {% if selected_mid and
        'mission_id' in loc.columns and
        'latitude' in loc.columns and
        'longitude' in loc.columns %}
    {% set mi = loc.columns.index('mission_id') %}
    {% set lai = loc.columns.index('latitude') %}
    {% set loi = loc.columns.index('longitude') %}
    {% set ti = loc.columns.index('time') if 'time' in loc.columns else none %}
    {% set si = loc.columns.index('location_source') if 'location_source' in loc.columns else none %}
    {% for row in loc.rows %}
      {% if row[mi] | string == selected_mid and
            row[lai] is not none and row[loi] is not none %}
        {% set fix.lat = row[lai] | float %}
        {% set fix.lon = row[loi] | float %}
        {% if ti is not none %}
          {% set dt = as_datetime(row[ti], none) %}
          {% set fix.time = dt.strftime('%m/%d/%Y %H:%M:%S') if dt is not none else '--' %}
        {% endif %}
        {% set fix.source = row[si] if si is not none else '' %}
      {% endif %}
    {% endfor %}
  {% endif %}

  {% set available = fix.lat is not none and fix.lon is not none %}
  {% if available %}
    {% set lat = '%.6f' | format(fix.lat) %}
    {% set lon = '%.6f' | format(fix.lon) %}
    {% set west = '%.6f' | format([fix.lon - 0.015, -180] | max) %}
    {% set east = '%.6f' | format([fix.lon + 0.015, 180] | min) %}
    {% set south = '%.6f' | format([fix.lat - 0.01, -90] | max) %}
    {% set north = '%.6f' | format([fix.lat + 0.01, 90] | min) %}
    {% set map_embed = 'https://www.openstreetmap.org/export/embed.html?bbox=' ~ west ~ '%2C' ~ south ~ '%2C' ~ east ~ '%2C' ~ north ~ '&layer=mapnik&marker=' ~ lat ~ '%2C' ~ lon %}
    {% set map_link = 'https://www.openstreetmap.org/?mlat=' ~ lat ~ '&mlon=' ~ lon ~ '#map=15/' ~ lat ~ '/' ~ lon %}
  {% else %}
    {% set lat = '--' %}
    {% set lon = '--' %}
  {% endif %}

  {# The built-in HA map uses an entity's current position. Use a
     mission-specific embedded map instead, without creating a new helper. #}
  {% set location_popup %}
    <div style="background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box;">
      <div style="height:7px;background:#8296ff;border-radius:8px;margin-bottom:12px;"></div>
      <div style="text-align:center;font-size:19px;font-weight:900;margin-bottom:10px;">TRICORDER LOCATION</div>
      {% if available %}
        <div style="text-align:center;color:#8296ff;font-size:13px;font-weight:900;margin-bottom:5px;">{{ lat }}° &nbsp; {{ lon }}°</div>
        <div style="text-align:center;color:#aaa;font-size:10px;margin-bottom:12px;">{{ fix.time }}</div>
        <iframe src="{{ map_embed }}" title="Selected mission location" loading="lazy" style="display:block;width:100%;height:320px;border:1px solid #29364c;border-radius:12px;"></iframe>
        <div style="text-align:center;margin-top:12px;"><a href="{{ map_link }}" target="_blank" rel="noopener noreferrer" style="color:#8296ff;font-size:12px;font-weight:900;">OPEN LOCATION IN MAP</a></div>
      {% else %}
        <div style="text-align:center;color:#aaa;padding:24px 8px;font-size:12px;">NO LOCATION DATA FOR SELECTED MISSION</div>
      {% endif %}
      <div style="height:7px;background:#8e87b6;border-radius:8px;margin-top:14px;"></div>
    </div>
  {% endset %}

  <style>
    .loc-card {
      background:#000;border-radius:38px;padding:10px 18px;
      overflow:hidden;font-family:"Antonio","Arial Narrow",sans-serif;
      box-sizing:border-box;cursor:pointer;user-select:none;
    }
    .loc-topline {height:7px;background:#8296ff;margin:-5px -18px 9px -18px;}
    .loc-bottomline {height:7px;background:#8e87b6;margin:9px -18px -5px -18px;}
    .loc-title {color:#fff;text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;margin-bottom:7px;}
    .locator {
      display:grid;grid-template-columns:58px 1fr;min-height:68px;
      background:
        linear-gradient(rgba(130,150,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(130,150,255,.10) 1px,transparent 1px),#070b11;
      background-size:18px 18px;border:1px solid #29364c;
      border-radius:18px;overflow:hidden;
    }
    .loc-icon {
      background:#8296ff;color:#000;display:flex;align-items:center;
      justify-content:center;border-radius:17px 0 0 17px;
    }
    .loc-icon ha-icon {--mdc-icon-size:28px;}
    .coordinates {
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;color:#fff;min-width:0;
    }
    .coordinate-main {font-size:17px;font-weight:800;letter-spacing:.4px;white-space:nowrap;}
    .coordinate-sub {margin-top:4px;color:#aeb9cc;font-size:9px;font-weight:700;letter-spacing:1px;}
    .loc-data {display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px;}
    .data-box {
      height:28px;display:flex;flex-direction:column;align-items:center;
      justify-content:center;background:#121923;border-radius:12px;min-width:0;
    }
    .data-label {color:#8296ff;font-size:7px;font-weight:900;letter-spacing:.8px;line-height:1;}
    .data-value {
      color:#fff;font-size:10px;font-weight:800;margin-top:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%;
    }
    .map-box {background:#f59e0b;}
    .map-box .data-label,.map-box .data-value {color:#000;}
  </style>

  <div class="loc-card" title="Open selected mission location map"
    onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"TRICORDER LOCATION",content:{{ location_popup | to_json }},initial_style:"normal"}}}}))'>
    <div class="loc-topline"></div>
    <div class="loc-title">TRICORDER LOCATION</div>
    <div class="locator">
      <div class="loc-icon"><ha-icon icon="mdi:crosshairs-gps"></ha-icon></div>
      <div class="coordinates">
        <div class="coordinate-main">{{ lat }}{% if available %}°{% endif %} &nbsp; {{ lon }}{% if available %}°{% endif %}</div>
        <div class="coordinate-sub">{{ 'POSITION FIX' if available else 'NO MISSION POSITION' }}</div>
      </div>
    </div>
    <div class="loc-data">
      <div class="data-box">
        <div class="data-label">LATITUDE</div>
        <div class="data-value">{{ lat }}{% if available %}°{% endif %}</div>
      </div>
      <div class="data-box">
        <div class="data-label">LONGITUDE</div>
        <div class="data-value">{{ lon }}{% if available %}°{% endif %}</div>
      </div>
      <div class="data-box map-box">
        <div class="data-label">LOCATION TIME</div>
        <div class="data-value">{{ fix.time }}</div>
      </div>
    </div>
    <div class="loc-bottomline"></div>
  </div>
card_mod:
  style: |
    ha-card {
      background:#29364c !important;
      padding:2px !important;
      border:none !important;
      border-radius:40px !important;
      box-shadow:none !important;
      overflow:hidden !important;
    }
