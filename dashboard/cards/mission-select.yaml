type: custom:html-template-card
ignore_line_breaks: true
entities:
- sensor.tricorder_mission_catalog
- input_text.tric_archive_mission_id
- sensor.tricorder_mission_events
- sensor.tricorder_mission_scans
content: |
  {% set selected_mid = states('input_text.tric_archive_mission_id') %}
  {% set catalog_results =
       state_attr('sensor.tricorder_mission_catalog', 'results') or [] %}

  {% set catalog_series = [] %} {% if catalog_results and catalog_results[0].get('series') %}
    {% set catalog_series = catalog_results[0]['series'] %}
  {% endif %}
  {% set catalog_columns = [] %} {% set catalog_values = [] %}
  {% if catalog_series %}
    {% set catalog_columns = catalog_series[0].get('columns', []) %}
    {% set catalog_values = catalog_series[0].get('values', []) %}
  {% endif %}
  <style>
    .mission-card {
      background:#000;
      border-radius:38px;
      padding:10px 18px;
      overflow:hidden;
      font-family:"Antonio","Arial Narrow",sans-serif;
      box-sizing:border-box;
    }

    .topline {
      height:7px;
      background:#8296ff;
      margin:-5px -18px 9px -18px;
    }

    .bottomline {
      height:7px;
      background:#8e87b6;
      margin:10px -18px -5px -18px;
    }

    .title {
      color:#fff;
      text-align:center;
      font-size:18px;
      font-weight:800;
      letter-spacing:1.2px;
      margin-bottom:9px;
    }

    .section-title {
      color:#8296ff;
      font-size:10px;
      font-weight:800;
      letter-spacing:1.2px;
      margin:7px 0 5px 0;
    }

    .mission-row {
      display:grid;
      grid-template-columns:82px 1fr 110px;
      height:32px;
      margin:4px 0;
      cursor:pointer;
      border-radius:16px;
      overflow:hidden;
      background:#101010;
      transition:transform .08s ease, box-shadow .08s ease;
    }

    .mission-row:hover {
      transform:scale(1.01);
    }

    .mission-row.selected {
      outline:1px solid #8296ff;
      box-shadow:0 0 7px #8296ff66;
    }

    .mission-code {
      background:#8296ff;
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      font-weight:900;
    }

    .mission-name {
      background:#111;
      color:#fff;
      display:flex;
      align-items:center;
      padding-left:12px;
      font-size:10px;
      font-weight:800;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .mission-date {
      background:#8e87b6;
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:9px;
      font-weight:900;
      white-space:nowrap;
    }

    .empty {
      color:#777;
      font-size:11px;
      text-align:center;
      padding:14px 5px;
    }
  </style>
  <div class="mission-card">
    <div class="topline"></div>

    <div class="title">
      MISSION SELECT
    </div>

    <div class="section-title">
      AVAILABLE MISSIONS
    </div>

    {% if catalog_values %}

      {% for row in catalog_values %}

        {% set time_i = catalog_columns.index('time') %}
        {% set code_i = catalog_columns.index('mission_code') %}
        {% set id_i = catalog_columns.index('mission_id') %}
        {% set name_i = catalog_columns.index('mission_name') %}

        {% set raw_time = row[time_i] %}
        {% set code = row[code_i] %}
        {% set mid = row[id_i] %}
        {% set name = row[name_i] | replace('_', ' ') %}

        {% set dt = as_datetime(raw_time) %}
        {% if dt %}
          {% set local_dt = as_local(dt) %}
          {% set display_date = local_dt.strftime('%m/%d/%Y %H:%M') %}
        {% else %}
          {% set display_date = raw_time %}
        {% endif %}

        <div
          class="mission-row {% if mid == selected_mid %}selected{% endif %}"
          onclick='
            const hass = document.querySelector("home-assistant").hass;
            hass.callService(
              "input_text",
              "set_value",
              {
                entity_id:"input_text.tric_archive_mission_id",
                value:{{ mid | to_json }}
              }
            ).then(() => {
              hass.callService(
                "homeassistant",
                "update_entity",
                {
                  entity_id:[
                    "sensor.tricorder_mission_events",
                    "sensor.tricorder_mission_scans"
                  ]
                }
              );
            });
          '
        >
          <div class="mission-code">
            {{ code }}
          </div>

          <div class="mission-name">
            {{ name }}
          </div>

          <div class="mission-date">
            {{ display_date }}
          </div>
        </div>

      {% endfor %}

    {% else %}

      <div class="empty">
        NO AVAILABLE MISSIONS
      </div>

    {% endif %}

    <div class="bottomline"></div>
  </div>
card_mod:
  style: |
    ha-card {
      background:#29364c !important;
      padding:2px !important;
      border:none !important;
      border-radius:40px !important;
      box-shadow:none !important;
      overflow:hidden !important;
    }
