views:
- type: sections
  max_columns: 3
  title: TRICORDER
  path: tricorder-sensors
  icon: tric:tricorder
  badges: []
  sections:
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - sensor.tricorder_mission_catalog
      - input_text.tric_archive_mission_id
      - sensor.tricorder_mission_events
      - sensor.tricorder_mission_scans
      content: |
        {% set selected_mid = states('input_text.tric_archive_mission_id') %}
        {% set catalog_results =
             state_attr('sensor.tricorder_mission_catalog', 'results') or [] %}

        {% set catalog_series = [] %} {% if catalog_results and catalog_results[0].get('series') %}
          {% set catalog_series = catalog_results[0]['series'] %}
        {% endif %}
        {% set catalog_columns = [] %} {% set catalog_values = [] %}
        {% if catalog_series %}
          {% set catalog_columns = catalog_series[0].get('columns', []) %}
          {% set catalog_values = catalog_series[0].get('values', []) %}
        {% endif %}
        <style>
          .mission-card {
            background:#000;
            border-radius:38px;
            padding:10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }

          .topline {
            height:7px;
            background:#8296ff;
            margin:-5px -18px 9px -18px;
          }

          .bottomline {
            height:7px;
            background:#8e87b6;
            margin:10px -18px -5px -18px;
          }

          .title {
            color:#fff;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1.2px;
            margin-bottom:9px;
          }

          .section-title {
            color:#8296ff;
            font-size:10px;
            font-weight:800;
            letter-spacing:1.2px;
            margin:7px 0 5px 0;
          }

          .mission-row {
            display:grid;
            grid-template-columns:82px 1fr 110px;
            height:32px;
            margin:4px 0;
            cursor:pointer;
            border-radius:16px;
            overflow:hidden;
            background:#101010;
            transition:transform .08s ease, box-shadow .08s ease;
          }

          .mission-row:hover {
            transform:scale(1.01);
          }

          .mission-row.selected {
            outline:1px solid #8296ff;
            box-shadow:0 0 7px #8296ff66;
          }

          .mission-code {
            background:#8296ff;
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:10px;
            font-weight:900;
          }

          .mission-name {
            background:#111;
            color:#fff;
            display:flex;
            align-items:center;
            padding-left:12px;
            font-size:10px;
            font-weight:800;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
          }

          .mission-date {
            background:#8e87b6;
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:9px;
            font-weight:900;
            white-space:nowrap;
          }

          .empty {
            color:#777;
            font-size:11px;
            text-align:center;
            padding:14px 5px;
          }
        </style>
        <div class="mission-card">
          <div class="topline"></div>

          <div class="title">
            MISSION SELECT
          </div>

          <div class="section-title">
            AVAILABLE MISSIONS
          </div>

          {% if catalog_values %}

            {% for row in catalog_values %}

              {% set time_i = catalog_columns.index('time') %}
              {% set code_i = catalog_columns.index('mission_code') %}
              {% set id_i = catalog_columns.index('mission_id') %}
              {% set name_i = catalog_columns.index('mission_name') %}

              {% set raw_time = row[time_i] %}
              {% set code = row[code_i] %}
              {% set mid = row[id_i] %}
              {% set name = row[name_i] | replace('_', ' ') %}

              {% set dt = as_datetime(raw_time) %}
              {% if dt %}
                {% set local_dt = as_local(dt) %}
                {% set display_date = local_dt.strftime('%m/%d/%Y %H:%M') %}
              {% else %}
                {% set display_date = raw_time %}
              {% endif %}

              <div
                class="mission-row {% if mid == selected_mid %}selected{% endif %}"
                onclick='
                  const hass = document.querySelector("home-assistant").hass;
                  hass.callService(
                    "input_text",
                    "set_value",
                    {
                      entity_id:"input_text.tric_archive_mission_id",
                      value:{{ mid | to_json }}
                    }
                  ).then(() => {
                    hass.callService(
                      "homeassistant",
                      "update_entity",
                      {
                        entity_id:[
                          "sensor.tricorder_mission_events",
                          "sensor.tricorder_mission_scans"
                        ]
                      }
                    );
                  });
                '
              >
                <div class="mission-code">
                  {{ code }}
                </div>

                <div class="mission-name">
                  {{ name }}
                </div>

                <div class="mission-date">
                  {{ display_date }}
                </div>
              </div>

            {% endfor %}

          {% else %}

            <div class="empty">
              NO AVAILABLE MISSIONS
            </div>

          {% endif %}

          <div class="bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_boolean.tric_uv_available
      - input_number.tric_uv_raw
      - input_number.tric_uv_index
      - input_datetime.tric_uv_time
      - sensor.tricorder_mission_scans
      content: |
        {% set helper_available = is_state('input_boolean.tric_uv_available','on') %} {% set helper_raw = states('input_number.tric_uv_raw') | float(0) %} {% set helper_index = states('input_number.tric_uv_index') | float(0) %}
        {% set raw_time = states('input_datetime.tric_uv_time') %} {% set scan_time = as_datetime(raw_time) %} {% if scan_time %}
          {% set recorded = scan_time.strftime('%m/%d/%Y %H:%M:%S') %}
          {% set scan_end_ts = as_timestamp(scan_time) %}
        {% else %}
          {% set recorded = raw_time %}
          {% set scan_end_ts = none %}
        {% endif %}
        {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set uv = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_uv' %}
            {% set uv.columns = series.get('columns', []) %}
            {% set uv.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {# Prefer the scan that matches the helper time; for an older selected
           Mission, fall back to that Mission's newest contiguous UV cluster. #}
        {% set candidates = namespace(rows=[]) %} {% if scan_end_ts is not none and 'time' in uv.columns %}
          {% set ti = uv.columns.index('time') %}
          {% for row in uv.rows %}
            {% set dt = as_datetime(row[ti]) %}
            {% if dt %}
              {% set ts = as_timestamp(dt) %}
              {% if ts >= scan_end_ts - 12 and ts <= scan_end_ts + 2 %}
                {% set candidates.rows = candidates.rows + [row] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set cluster = namespace(rows=[], active=true, last_ts=none) %} {% if candidates.rows and 'time' in uv.columns %}
          {% set ti = uv.columns.index('time') %}
          {% for row in candidates.rows | reverse %}
            {% if cluster.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if cluster.last_ts is none or (cluster.last_ts - ts) <= 2.5 %}
                  {% set cluster.rows = [row] + cluster.rows %}
                  {% set cluster.last_ts = ts %}
                {% else %}
                  {% set cluster.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if not cluster.rows and uv.rows and 'time' in uv.columns %}
          {% set ti = uv.columns.index('time') %}
          {% set fallback = namespace(rows=[], active=true, last_ts=none) %}
          {% for row in uv.rows | reverse %}
            {% if fallback.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if fallback.last_ts is none or (fallback.last_ts - ts) <= 2.5 %}
                  {% set fallback.rows = [row] + fallback.rows %}
                  {% set fallback.last_ts = ts %}
                {% else %}
                  {% set fallback.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set cluster.rows = fallback.rows %}
        {% endif %}
        {% set scan_rows = cluster.rows %}
        {% if scan_rows and 'time' in uv.columns %}
          {% set selected_dt = as_datetime(scan_rows[-1][uv.columns.index('time')]) %}
          {% if selected_dt %}
            {% set recorded = selected_dt.strftime('%m/%d/%Y %H:%M:%S') %}
          {% endif %}
        {% endif %}
        {% set scan_has_uv = (scan_rows | count) > 0 %} {% set latest = namespace(raw=helper_raw, index=helper_index, available=(scan_has_uv or helper_available)) %} {% if scan_rows %}
          {% set last = scan_rows[-1] %}
          {% if 'uv_raw' in uv.columns and last[uv.columns.index('uv_raw')] is not none %}
            {% set latest.raw = last[uv.columns.index('uv_raw')] | float(0) %}
          {% endif %}
          {% if 'uv_index' in uv.columns and last[uv.columns.index('uv_index')] is not none %}
            {% set latest.index = last[uv.columns.index('uv_index')] | float(0) %}
          {% endif %}
        {% endif %}
        {% macro sensor_popup(field, label, unit, color, decimals=2) %}
          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if field in uv.columns and 'time' in uv.columns %}
            {% set fi = uv.columns.index(field) %}
            {% set ti = uv.columns.index('time') %}

            {% for row in scan_rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% set raw_v = row[uv.columns.index('uv_raw')] if 'uv_raw' in uv.columns else none %}
                  {% set index_v = row[uv.columns.index('uv_index')] if 'uv_index' in uv.columns else none %}
                  {% set mission_v = row[uv.columns.index('elapsed_seconds')] if 'elapsed_seconds' in uv.columns else none %}
                  {% if ns.first_ts is none %}{% set ns.first_ts = ts %}{% endif %}
                  {% set ns.last_ts = ts %}
                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'value': row[fi] | float(0),
                    'time': dt.strftime('%H:%M:%S'),
                    'raw': raw_v,
                    'index': index_v,
                    'mission': mission_v
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set span = (ns.last_ts - ns.first_ts) if count > 1 else 0 %}
            {% set duration = ((span + 1) | round(0) | int) if count > 1 else 1 %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% set graph = namespace(coords=[]) %}

            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}

              {% set x = 150 if span <= 0 else 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
              {% set y = 70 if maxval == minval else 126 - (((p['value'] - minval) / (maxval - minval)) * 106) %}
              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': (p['ts'] - ns.first_ts) | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="uvp">
              <style>
                .uvp{background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box}
                .uvp *{box-sizing:border-box}.ur{position:absolute;opacity:0;pointer-events:none}.uc{cursor:pointer}.uc:hover{filter:brightness(1.12)}
                .usel{display:none}.ublank{display:block;text-align:center;color:#777;font-size:10px;font-weight:800;padding:16px 0}
                .ubar{height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px}.utitle{text-align:center;font-size:22px;font-weight:900;letter-spacing:1px}
                .usub{text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px}
                .usum{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.utile{background:#111;border-radius:11px;padding:8px;text-align:center}
                .uk{font-size:8px;color:#777}.uv{font-size:15px;font-weight:900}.uu{font-size:8px;color:#aaa}
                .usw{background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:55px}
                .ush{display:flex;justify-content:space-between;font-size:13px;color:#ccc;margin-bottom:7px}.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
                .ubox{background:#050505;border-radius:8px;padding:8px;text-align:center}.ugraph{background:#080808;border:1px solid #222;border-radius:14px;padding:10px}
                .ugp{position:relative;width:100%;height:260px}.uaxis{display:flex;justify-content:space-between;color:#aaa;font-size:14px;font-weight:800;margin-top:4px}
                .ustamp{font-size:15px;color:#ddd}.urows{margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px}
                .urh{font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:4px}.urow{display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;padding:7px 5px;border-top:1px solid #181818;font-size:11px}
                .ulast{display:block;margin-top:10px;text-align:center;font-size:11px;color:#888}
                {% for c in graph.coords %}
                  #{{ field }}-p{{ c['index'] }}:checked~.usw .ublank{display:none}
                  #{{ field }}-p{{ c['index'] }}:checked~.usw .s{{ c['index'] }}{display:block}
                  #{{ field }}-p{{ c['index'] }}:checked~.ugraph .d{{ c['index'] }}{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 4px {{ color }})}
                  #{{ field }}-p{{ c['index'] }}:checked~.urows .r{{ c['index'] }}{background:#171717;color:#fff}
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="ur" type="radio" name="{{ field }}-p" id="{{ field }}-p{{ c['index'] }}">
              {% endfor %}

              <div class="ubar"></div>
              <div class="utitle">{{ label }}</div>
              <div class="usub">{{ duration }} SECOND SCAN</div>

              <div class="usum">
                <label class="utile uc" for="{{ field }}-p{{ picks.mini }}"><div class="uk">MIN</div><div class="uv">{{ minval | round(decimals) }} <span class="uu">{{ unit }}</span></div></label>
                <div class="utile"><div class="uk">AVG</div><div class="uv">{{ avgval | round(decimals) }} <span class="uu">{{ unit }}</span></div></div>
                <label class="utile uc" for="{{ field }}-p{{ picks.maxi }}"><div class="uk">MAX</div><div class="uv">{{ maxval | round(decimals) }} <span class="uu">{{ unit }}</span></div></label>
                <div class="utile"><div class="uk">SAMPLES</div><div class="uv">{{ count }}</div></div>
              </div>

              <div class="usw">
                <div class="ublank">TAP A POINT OR SAMPLE TO INSPECT</div>
                {% for c in graph.coords %}
                  <div class="usel s{{ c['index'] }}">
                    <div class="ush"><b style="color:{{ color }}">SAMPLE {{ c['index'] }}</b><span>{{ c['p']['time'] }} · +{{ c['offset'] }} s</span></div>
                    <div class="ugrid">
                      <div class="ubox"><div class="uk">UV INDEX</div><div class="uv">{{ c['p']['index'] | round(3) if c['p']['index'] is not none else '--' }}</div></div>
                      <div class="ubox"><div class="uk">UV RAW</div><div class="uv">{{ c['p']['raw'] | round(0) | int if c['p']['raw'] is not none else '--' }}</div></div>
                    </div>
                    <div class="uk" style="text-align:center;margin-top:6px">MISSION {% if c['p']['mission'] is not none %}{{ c['p']['mission'] | round(1) }} s{% else %}--{% endif %}</div>
                  </div>
                {% endfor %}
              </div>

              <div class="ugraph">
                <div class="ugp">
                  <svg viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:260px;display:block;position:absolute;inset:0">
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>
                    {% if count > 1 %}
                      <polyline points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}" fill="none" stroke="{{ color }}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                    {% endif %}
                    {% for c in graph.coords %}
                      <circle class="d{{ c['index'] }}" cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}"/>
                    {% endfor %}
                  </svg>
                  {% for c in graph.coords %}
                    <label class="uc" for="{{ field }}-p{{ c['index'] }}" style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3"></label>
                  {% endfor %}
                </div>
                <div class="uaxis"><span>0 s</span><span class="ustamp">{{ recorded }}</span><span>{{ duration }} s</span></div>
              </div>

              <div class="urows">
                <div class="urh">SAMPLE DETAIL</div>
                {% for c in graph.coords %}
                  <label class="urow uc r{{ c['index'] }}" for="{{ field }}-p{{ c['index'] }}">
                    <span style="color:#aaa">{{ c['p']['time'] }}</span>
                    <span>INDEX {{ c['p']['index'] | round(3) if c['p']['index'] is not none else '--' }}</span>
                    <span>RAW {{ c['p']['raw'] | round(0) | int if c['p']['raw'] is not none else '--' }}</span>
                  </label>
                {% endfor %}
              </div>

              <label class="ulast uc" for="{{ field }}-p{{ count }}">LAST {{ ns.values[-1] | round(decimals) }} {{ unit }}</label>
              <div class="ubar" style="margin-top:13px;margin-bottom:0"></div>
            </div>

          {% else %}
            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center">
              <div style="font-size:20px;font-weight:900">{{ label }}</div>
              <div style="color:#888;margin-top:12px">No time-series samples found for this scan.</div>
            </div>
          {% endif %}
        {% endmacro %}
        {% set index_popup = sensor_popup('uv_index','UV INDEX','','#8296ff',3) %} {% set raw_popup = sensor_popup('uv_raw','UV RAW','','#f59e0b',0) %}
        <style>
          .uv-card{background:#000;border:0;border-radius:38px;padding:10px 18px;overflow:hidden;font-family:"Antonio","Arial Narrow",sans-serif;box-sizing:border-box}
          .uv-topline{height:7px;background:#8296ff;margin:-5px -18px 10px}
          .uv-bottomline{height:7px;background:#8e87b6;margin:10px -18px -5px}
          .uv-title{color:#fff;text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;margin:0 0 7px}
          .uv-row{display:grid;height:30px;margin:4px 0;cursor:pointer;user-select:none}.uv-row:hover{filter:brightness(1.08)}
          .uv-row.left{grid-template-columns:52px 1fr 1.75fr}.uv-row.right{grid-template-columns:1.75fr 1fr 52px}
          .uv-cap{color:#000;display:flex;align-items:center;justify-content:center}.leftcap{border-radius:15px 0 0 15px}.rightcap{border-radius:0 15px 15px 0}
          .uv-value{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;white-space:nowrap}
          .uv-label{color:#000;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:800;padding:0 6px}
          .round-right{border-radius:0 15px 15px 0}.round-left{border-radius:15px 0 0 15px}
          .uv-status{margin-top:6px;text-align:center;font-size:9px;font-weight:800;letter-spacing:1px;color:{{ '#22c55e' if latest.available else '#ef4444' }}}
          ha-icon{--mdc-icon-size:16px}
        </style>
        <div class="uv-card">
          <div class="uv-topline"></div>
          <div class="uv-title">ULTRAVIOLET</div>

          <div class="uv-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"UV INDEX SCAN",content:{{ index_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="uv-cap leftcap" style="background:#8296ff"><ha-icon icon="mdi:weather-sunny-alert"></ha-icon></div>
            <div class="uv-value">{{ latest.index | round(3) }}</div>
            <div class="uv-label round-right" style="background:#8296ff">UV INDEX</div>
          </div>

          <div class="uv-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"UV RAW SCAN",content:{{ raw_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="uv-label round-left" style="background:#f59e0b">UV RAW</div>
            <div class="uv-value">{{ latest.raw | round(0) | int }}</div>
            <div class="uv-cap rightcap" style="background:#f59e0b"><ha-icon icon="mdi:chart-bell-curve-cumulative"></ha-icon></div>
          </div>

          <div class="uv-status">{{ 'SENSOR AVAILABLE' if latest.available else 'SENSOR UNAVAILABLE' }}</div>
          <div class="uv-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_boolean.tric_thermal_available
      - input_number.tric_thermal_center
      - input_number.tric_thermal_min
      - input_number.tric_thermal_max
      - input_datetime.tric_thermal_time
      - input_boolean.tric_distance_available
      - input_number.tric_distance
      - input_datetime.tric_distance_time
      - sensor.tricorder_mission_scans
      content: |
        {% set helper_center = states('input_number.tric_thermal_center') | float(0) %} {% set helper_min = states('input_number.tric_thermal_min') | float(0) %} {% set helper_max = states('input_number.tric_thermal_max') | float(0) %} {% set helper_distance = states('input_number.tric_distance') | float(0) %}
        {% set thermal_raw_time = states('input_datetime.tric_thermal_time') %} {% set distance_raw_time = states('input_datetime.tric_distance_time') %} {% set thermal_time = as_datetime(thermal_raw_time) %} {% set distance_time = as_datetime(distance_raw_time) %} {% set thermal_end_ts = as_timestamp(thermal_time) if thermal_time else none %} {% set distance_end_ts = as_timestamp(distance_time) if distance_time else none %}
        {% set scan_results = state_attr('sensor.tricorder_mission_scans', 'results') or [] %} {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set thermal = namespace(columns=[], rows=[]) %} {% set distance = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_thermal' %}
            {% set thermal.columns = series.get('columns', []) %}
            {% set thermal.rows = series.get('values', []) %}
          {% elif series.get('name', '') == 'tricorder_distance' %}
            {% set distance.columns = series.get('columns', []) %}
            {% set distance.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {% macro latest_cluster(columns, rows, helper_ts, window=14) %}
          {% set result = namespace(rows=[]) %}
          {% set candidates = namespace(rows=[]) %}

          {% if helper_ts is not none and 'time' in columns %}
            {% set ti = columns.index('time') %}
            {% for row in rows %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if ts >= helper_ts - window and ts <= helper_ts + 2 %}
                  {% set candidates.rows = candidates.rows + [row] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% if candidates.rows and 'time' in columns %}
            {% set ti = columns.index('time') %}
            {% set c = namespace(rows=[], active=true, last_ts=none) %}
            {% for row in candidates.rows | reverse %}
              {% if c.active %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% if c.last_ts is none or (c.last_ts - ts) <= 2.5 %}
                    {% set c.rows = [row] + c.rows %}
                    {% set c.last_ts = ts %}
                  {% else %}
                    {% set c.active = false %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set result.rows = c.rows %}
          {% endif %}

          {% if not result.rows and rows and 'time' in columns %}
            {% set ti = columns.index('time') %}
            {% set f = namespace(rows=[], active=true, last_ts=none) %}
            {% for row in rows | reverse %}
              {% if f.active %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% if f.last_ts is none or (f.last_ts - ts) <= 2.5 %}
                    {% set f.rows = [row] + f.rows %}
                    {% set f.last_ts = ts %}
                  {% else %}
                    {% set f.active = false %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set result.rows = f.rows %}
          {% endif %}

          {{ result.rows | to_json }}
        {% endmacro %}
        {% set thermal_rows = latest_cluster(thermal.columns, thermal.rows, thermal_end_ts, 18) | from_json %} {% set distance_rows = latest_cluster(distance.columns, distance.rows, distance_end_ts, 14) | from_json %}
        {% set main = namespace(
             center=helper_center,
             min=helper_min,
             max=helper_max,
             distance=helper_distance,
             thermal_available=is_state('input_boolean.tric_thermal_available','on'),
             distance_available=is_state('input_boolean.tric_distance_available','on')
           ) %}

        {% if thermal_rows %}
          {% set row = thermal_rows[-1] %}
          {% if 'center_f' in thermal.columns and row[thermal.columns.index('center_f')] is not none %}
            {% set main.center = row[thermal.columns.index('center_f')] | float(main.center) %}
          {% endif %}
          {% if 'min_f' in thermal.columns and row[thermal.columns.index('min_f')] is not none %}
            {% set main.min = row[thermal.columns.index('min_f')] | float(main.min) %}
          {% endif %}
          {% if 'max_f' in thermal.columns and row[thermal.columns.index('max_f')] is not none %}
            {% set main.max = row[thermal.columns.index('max_f')] | float(main.max) %}
          {% endif %}
          {% set main.thermal_available = true %}
        {% endif %}
        {% if distance_rows %}
          {% set row = distance_rows[-1] %}
          {% if 'distance_m' in distance.columns and row[distance.columns.index('distance_m')] is not none %}
            {% set main.distance = row[distance.columns.index('distance_m')] | float(main.distance) %}
            {% set main.distance_available = true %}
          {% elif 'available' in distance.columns %}
            {% set main.distance_available = row[distance.columns.index('available')] | bool %}
          {% endif %}
        {% endif %}
        {% macro popup(series_name, columns, rows, field, label, unit, color, decimals=2) %}
          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if rows and field in columns and 'time' in columns %}
            {% set fi = columns.index(field) %}
            {% set ti = columns.index('time') %}

            {% for row in rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% if ns.first_ts is none %}{% set ns.first_ts = ts %}{% endif %}
                  {% set ns.last_ts = ts %}

                  {% set center_v = row[columns.index('center_f')] if 'center_f' in columns else none %}
                  {% set min_v = row[columns.index('min_f')] if 'min_f' in columns else none %}
                  {% set max_v = row[columns.index('max_f')] if 'max_f' in columns else none %}
                  {% set distance_v = row[columns.index('distance_m')] if 'distance_m' in columns else none %}
                  {% set mission_v = row[columns.index('elapsed_seconds')] if 'elapsed_seconds' in columns else none %}

                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'time': dt.strftime('%H:%M:%S'),
                    'value': row[fi] | float(0),
                    'center': center_v,
                    'min': min_v,
                    'max': max_v,
                    'distance': distance_v,
                    'mission': mission_v
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set span = (ns.last_ts - ns.first_ts) if count > 1 else 0 %}
            {% set duration = ((span + 1) | round(0) | int) if count > 1 else 1 %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% set graph = namespace(coords=[]) %}

            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}

              {% set x = 150 if span <= 0 else 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
              {% set y = 70 if maxval == minval else 126 - (((p['value'] - minval) / (maxval - minval)) * 106) %}
              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': (p['ts'] - ns.first_ts) | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            {% set recorded_dt = as_datetime(rows[-1][columns.index('time')]) %}
            {% set recorded = recorded_dt.strftime('%m/%d/%Y %H:%M:%S') if recorded_dt else '' %}

            <div class="tdp">
              <style>
                .tdp{background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box}
                .tdp *{box-sizing:border-box}.tr{position:absolute;opacity:0;pointer-events:none}.tc{cursor:pointer}.tc:hover{filter:brightness(1.12)}
                .tsel{display:none}.tblank{display:block;text-align:center;color:#777;font-size:10px;font-weight:800;padding:16px 0}
                .tbar{height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px}.ttitle{text-align:center;font-size:22px;font-weight:900;letter-spacing:1px}
                .tsub{text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px}
                .tsum{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.ttile{background:#111;border-radius:11px;padding:8px;text-align:center}
                .tk{font-size:8px;color:#777}.tv{font-size:15px;font-weight:900}.tu{font-size:8px;color:#aaa}
                .tsw{background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:55px}
                .tsh{display:flex;justify-content:space-between;font-size:13px;color:#ccc;margin-bottom:7px}.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
                .tbox{background:#050505;border-radius:8px;padding:8px;text-align:center}.tgraph{background:#080808;border:1px solid #222;border-radius:14px;padding:10px}
                .tgp{position:relative;width:100%;height:260px}.taxis{display:flex;justify-content:space-between;color:#aaa;font-size:14px;font-weight:800;margin-top:4px}
                .tstamp{font-size:15px;color:#ddd}.trows{margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px}
                .trh{font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:4px}.trow{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:7px 5px;border-top:1px solid #181818;font-size:11px}
                .tlast{display:block;margin-top:10px;text-align:center;font-size:11px;color:#888}
                {% for c in graph.coords %}
                  #{{ field }}-p{{ c['index'] }}:checked~.tsw .tblank{display:none}
                  #{{ field }}-p{{ c['index'] }}:checked~.tsw .s{{ c['index'] }}{display:block}
                  #{{ field }}-p{{ c['index'] }}:checked~.tgraph .d{{ c['index'] }}{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 4px {{ color }})}
                  #{{ field }}-p{{ c['index'] }}:checked~.trows .r{{ c['index'] }}{background:#171717;color:#fff}
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="tr" type="radio" name="{{ field }}-p" id="{{ field }}-p{{ c['index'] }}">
              {% endfor %}

              <div class="tbar"></div>
              <div class="ttitle">{{ label }}</div>
              <div class="tsub">{{ duration }} SECOND SCAN</div>

              <div class="tsum">
                <label class="ttile tc" for="{{ field }}-p{{ picks.mini }}"><div class="tk">MIN</div><div class="tv">{{ minval | round(decimals) }} <span class="tu">{{ unit }}</span></div></label>
                <div class="ttile"><div class="tk">AVG</div><div class="tv">{{ avgval | round(decimals) }} <span class="tu">{{ unit }}</span></div></div>
                <label class="ttile tc" for="{{ field }}-p{{ picks.maxi }}"><div class="tk">MAX</div><div class="tv">{{ maxval | round(decimals) }} <span class="tu">{{ unit }}</span></div></label>
                <div class="ttile"><div class="tk">SAMPLES</div><div class="tv">{{ count }}</div></div>
              </div>

              <div class="tsw">
                <div class="tblank">TAP A POINT OR SAMPLE TO INSPECT</div>
                {% for c in graph.coords %}
                  <div class="tsel s{{ c['index'] }}">
                    <div class="tsh"><b style="color:{{ color }}">SAMPLE {{ c['index'] }}</b><span>{{ c['p']['time'] }} · +{{ c['offset'] }} s</span></div>

                    {% if series_name == 'thermal' %}
                      <div class="tgrid">
                        <div class="tbox"><div class="tk">CENTER</div><div class="tv">{{ c['p']['center'] | round(3) if c['p']['center'] is not none else '--' }} <span class="tu">°F</span></div></div>
                        <div class="tbox"><div class="tk">MIN</div><div class="tv">{{ c['p']['min'] | round(3) if c['p']['min'] is not none else '--' }} <span class="tu">°F</span></div></div>
                        <div class="tbox"><div class="tk">MAX</div><div class="tv">{{ c['p']['max'] | round(3) if c['p']['max'] is not none else '--' }} <span class="tu">°F</span></div></div>
                      </div>
                    {% else %}
                      <div class="tbox"><div class="tk">DISTANCE</div><div class="tv">{{ c['p']['distance'] | round(3) if c['p']['distance'] is not none else '--' }} <span class="tu">m</span></div></div>
                    {% endif %}

                    <div class="tk" style="text-align:center;margin-top:6px">MISSION {% if c['p']['mission'] is not none %}{{ c['p']['mission'] | round(1) }} s{% else %}--{% endif %}</div>
                  </div>
                {% endfor %}
              </div>

              <div class="tgraph">
                <div class="tgp">
                  <svg viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:260px;display:block;position:absolute;inset:0">
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>
                    {% if count > 1 %}
                      <polyline points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}" fill="none" stroke="{{ color }}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                    {% endif %}
                    {% for c in graph.coords %}
                      <circle class="d{{ c['index'] }}" cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}"/>
                    {% endfor %}
                  </svg>
                  {% for c in graph.coords %}
                    <label class="tc" for="{{ field }}-p{{ c['index'] }}" style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3"></label>
                  {% endfor %}
                </div>
                <div class="taxis"><span>0 s</span><span class="tstamp">{{ recorded }}</span><span>{{ duration }} s</span></div>
              </div>

              <div class="trows">
                <div class="trh">SAMPLE DETAIL</div>
                {% for c in graph.coords %}
                  <label class="trow tc r{{ c['index'] }}" for="{{ field }}-p{{ c['index'] }}">
                    <span style="color:#aaa">{{ c['p']['time'] }}</span>
                    <span>{{ label }} {{ c['p']['value'] | round(3) }} {{ unit }}</span>
                  </label>
                {% endfor %}
              </div>

              <label class="tlast tc" for="{{ field }}-p{{ count }}">LAST {{ ns.values[-1] | round(3) }} {{ unit }}</label>
              <div class="tbar" style="margin-top:13px;margin-bottom:0"></div>
            </div>

          {% else %}
            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center">
              <div style="font-size:20px;font-weight:900">{{ label }}</div>
              <div style="color:#888;margin-top:12px">No time-series samples found for this scan.</div>
            </div>
          {% endif %}
        {% endmacro %}
        {% set center_popup = popup('thermal',thermal.columns,thermal_rows,'center_f','THERMAL CENTER','°F','#f59e0b',1) %} {% set min_popup = popup('thermal',thermal.columns,thermal_rows,'min_f','THERMAL MIN','°F','#3b82f6',1) %} {% set max_popup = popup('thermal',thermal.columns,thermal_rows,'max_f','THERMAL MAX','°F','#ef4444',1) %} {% set distance_popup = popup('distance',distance.columns,distance_rows,'distance_m','LIDAR DISTANCE','m','#22c55e',2) %}
        <style>
          .td-card{background:#000;border:0;border-radius:38px;padding:10px 18px;overflow:hidden;font-family:"Antonio","Arial Narrow",sans-serif;box-sizing:border-box}
          .td-topline{height:7px;background:#f59e0b;margin:-5px -18px 10px}.td-bottomline{height:7px;background:#22c55e;margin:10px -18px -5px}
          .td-title{color:#fff;text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;margin:0 0 7px}
          .td-row{display:grid;height:30px;margin:4px 0;cursor:pointer;user-select:none}.td-row:hover{filter:brightness(1.08)}
          .td-row.left{grid-template-columns:52px 1fr 1.75fr}.td-row.right{grid-template-columns:1.75fr 1fr 52px}
          .td-cap{color:#000;display:flex;align-items:center;justify-content:center}.leftcap{border-radius:15px 0 0 15px}.rightcap{border-radius:0 15px 15px 0}
          .td-value{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;white-space:nowrap}.unit{font-size:9px;font-weight:600;margin-left:3px}
          .td-label{color:#000;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:800;padding:0 6px}
          .round-right{border-radius:0 15px 15px 0}.round-left{border-radius:15px 0 0 15px}ha-icon{--mdc-icon-size:16px}
        </style>
        <div class="td-card">
          <div class="td-topline"></div>
          <div class="td-title">THERMAL / DISTANCE</div>

          <div class="td-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"THERMAL CENTER SCAN",content:{{ center_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="td-cap leftcap" style="background:#f59e0b"><ha-icon icon="mdi:crosshairs-gps"></ha-icon></div>
            <div class="td-value">{{ main.center | round(1) }}<span class="unit">°F</span></div>
            <div class="td-label round-right" style="background:#f59e0b">THERMAL CENTER</div>
          </div>

          <div class="td-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"THERMAL MIN SCAN",content:{{ min_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="td-label round-left" style="background:#3b82f6">THERMAL MIN</div>
            <div class="td-value">{{ main.min | round(1) }}<span class="unit">°F</span></div>
            <div class="td-cap rightcap" style="background:#3b82f6"><ha-icon icon="mdi:thermometer-low"></ha-icon></div>
          </div>

          <div class="td-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"THERMAL MAX SCAN",content:{{ max_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="td-cap leftcap" style="background:#ef4444"><ha-icon icon="mdi:thermometer-high"></ha-icon></div>
            <div class="td-value">{{ main.max | round(1) }}<span class="unit">°F</span></div>
            <div class="td-label round-right" style="background:#ef4444">THERMAL MAX</div>
          </div>

          <div class="td-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"LIDAR DISTANCE SCAN",content:{{ distance_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="td-label round-left" style="background:#22c55e">LIDAR DISTANCE</div>
            <div class="td-value">
              {% if main.distance_available %}
                {{ main.distance | round(2) }}<span class="unit">m</span>
              {% else %}
                OUT
              {% endif %}
            </div>
            <div class="td-cap rightcap" style="background:#22c55e"><ha-icon icon="mdi:arrow-expand-horizontal"></ha-icon></div>
          </div>

          <div class="td-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - sensor.tricorder_location
      - sensor.tricorder_location_time
      - sensor.tricorder_latitude
      - sensor.tricorder_longitude
      content: |
        {% set lat = states('sensor.tricorder_latitude') %}
        {% set lon = states('sensor.tricorder_longitude') %}
        {% set loc_time = states('sensor.tricorder_location_time') %}

        <style>

          .loc-card {
            background: #000;
            border-radius: 38px;
            padding: 10px 18px;
            overflow: hidden;
            font-family: "Antonio", "Arial Narrow", sans-serif;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
          }

          .loc-topline {
            height: 7px;
            background: #8296ff;
            margin: -5px -18px 9px -18px;
          }

          .loc-bottomline {
            height: 7px;
            background: #8e87b6;
            margin: 9px -18px -5px -18px;
          }

          .loc-title {
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 7px;
          }

          .locator {
            display: grid;
            grid-template-columns: 58px 1fr;
            min-height: 68px;
            background:
              linear-gradient(rgba(130,150,255,.10) 1px, transparent 1px),
              linear-gradient(90deg, rgba(130,150,255,.10) 1px, transparent 1px),
              #070b11;
            background-size: 18px 18px;
            border: 1px solid #29364c;
            border-radius: 18px;
            overflow: hidden;
          }

          .loc-icon {
            background: #8296ff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px 0 0 17px;
          }

          .loc-icon ha-icon {
            --mdc-icon-size: 28px;
          }

          .coordinates {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            min-width: 0;
          }

          .coordinate-main {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: .4px;
            white-space: nowrap;
          }

          .coordinate-sub {
            margin-top: 4px;
            color: #aeb9cc;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
          }

          .loc-data {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-top: 6px;
          }

          .data-box {
            height: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #121923;
            border-radius: 12px;
            min-width: 0;
          }

          .data-label {
            color: #8296ff;
            font-size: 7px;
            font-weight: 900;
            letter-spacing: .8px;
            line-height: 1;
          }

          .data-value {
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 95%;
          }

          .map-box {
            background: #f59e0b;
          }

          .map-box .data-label,
          .map-box .data-value {
            color: #000;
          }

        </style>


        <div
          class="loc-card"
          title="Open Tricorder location map"

          onclick='this.dispatchEvent(
            new CustomEvent(
              "ll-custom",
              {
                bubbles:true,
                composed:true,
                detail:{
                  browser_mod:{
                    service:"browser_mod.popup",
                    data:{
                      title:"TRICORDER LOCATION",
                      size:"normal",
                      content:{
                        type:"vertical-stack",
                        cards:[
                          {
                            type:"map",
                            aspect_ratio:"4:3",
                            dark_mode:true,
                            default_zoom:14,
                            entities:[
                              "sensor.tricorder_location"
                            ]
                          },
                          {
                            type:"entities",
                            show_header_toggle:false,
                            entities:[
                              {
                                entity:"sensor.tricorder_location_time",
                                name:"Location Time",
                                icon:"mdi:clock-outline"
                              },
                              {
                                entity:"sensor.tricorder_latitude",
                                name:"Latitude",
                                icon:"mdi:latitude"
                              },
                              {
                                entity:"sensor.tricorder_longitude",
                                name:"Longitude",
                                icon:"mdi:longitude"
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }
              }
            )
          )'
        >

          <div class="loc-topline"></div>

          <div class="loc-title">
            TRICORDER LOCATION
          </div>


          <div class="locator">

            <div class="loc-icon">
              <ha-icon icon="mdi:crosshairs-gps"></ha-icon>
            </div>

            <div class="coordinates">

              <div class="coordinate-main">
                {{ lat }}° &nbsp; {{ lon }}°
              </div>

              <div class="coordinate-sub">
                POSITION FIX
              </div>

            </div>

          </div>


          <div class="loc-data">

            <div class="data-box">
              <div class="data-label">LATITUDE</div>
              <div class="data-value">{{ lat }}°</div>
            </div>

            <div class="data-box">
              <div class="data-label">LONGITUDE</div>
              <div class="data-value">{{ lon }}°</div>
            </div>

            <div class="data-box map-box">
              <div class="data-label">LOCATION TIME</div>
              <div class="data-value">{{ loc_time }}</div>
            </div>

          </div>


          <div class="loc-bottomline"></div>

        </div>
      card_mod:
        style: |
          ha-card {
            background: #29364c !important;
            padding: 2px !important;
            border: none !important;
            border-radius: 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_text.tric_archive_mission_id
      - sensor.tricorder_mission_scans
      content: |
        {# The mission selector is the ONLY source of the chosen mission ID. #} {% set selected_mid = states('input_text.tric_archive_mission_id') %} {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {# Summary scans and one-second samples are separate HA series. #} {% set summary = namespace(columns=[], rows=[]) %} {% set rad_series = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_radiation' %}
            {% set summary.columns = series.get('columns', []) %}
            {% set summary.rows = series.get('values', []) %}
          {% elif series.get('name', '') == 'tricorder_radiation_series' %}
            {% set rad_series.columns = series.get('columns', []) %}
            {% set rad_series.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {# Ignore stale query results when the user switches missions. #} {# For multiple scans in one mission, take the latest completed scan. #} {% set chosen = namespace(row=none, time='') %} {% if selected_mid not in ['', 'unknown', 'unavailable']
              and 'mission_id' in summary.columns
              and 'time' in summary.columns %}
          {% set mid_i = summary.columns.index('mission_id') %}
          {% set time_i = summary.columns.index('time') %}
          {% for row in summary.rows %}
            {% if row[mid_i] == selected_mid
                  and row[time_i] is not none
                  and (chosen.row is none or row[time_i] >= chosen.time) %}
              {% set chosen.row = row %}
              {% set chosen.time = row[time_i] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set has_scan = chosen.row is not none %} {% set cpm = 0 %} {% set dose = 0 %} {% set pulses = 0 %} {% set duration = 0 %} {% set record_id = none %} {% set rad_status = 'NO SCAN' %} {% set scan_raw = none %}
        {% if has_scan %}
          {% set cpm = chosen.row[summary.columns.index('cpm')] | float(0)
             if 'cpm' in summary.columns else 0 %}
          {% set dose = chosen.row[summary.columns.index('dose_usvh')] | float(0)
             if 'dose_usvh' in summary.columns else 0 %}
          {% set pulses = chosen.row[summary.columns.index('pulses')] | float(0)
             if 'pulses' in summary.columns else 0 %}
          {% set duration = chosen.row[summary.columns.index('duration_seconds')] | float(0)
             if 'duration_seconds' in summary.columns else 0 %}
          {% set record_id = chosen.row[summary.columns.index('record_id')]
             if 'record_id' in summary.columns else none %}
          {% set raw_status = chosen.row[summary.columns.index('status')]
             if 'status' in summary.columns else none %}
          {% set rad_status = raw_status if raw_status not in
             [none, '', 'none', 'unknown', 'unavailable'] else 'UNREPORTED' %}
          {% set scan_raw = chosen.time %}
        {% endif %}
        {% set cpm_unit = 'CPM' %} {% set dose_unit = 'µSv/h' %} {% set pulse_unit = '' %} {% set duration_unit = 's' %}
        {% set s = rad_status | lower %} {% if 'danger' in s
              or 'critical' in s
              or 'hazard' in s
              or 'alarm' in s %}
          {% set rad_color = '#ef4444' %}
        {% elif 'warning' in s
                or 'high' in s %}
          {% set rad_color = '#f59e0b' %}
        {% elif 'caution' in s
                or 'elevated' in s %}
          {% set rad_color = '#facc15' %}
        {% elif 'normal' in s
                or 'safe' in s
                or 'ok' in s
                or 'nominal' in s %}
          {% set rad_color = '#22c55e' %}
        {% else %}
          {% set rad_color = '#8e87b6' %}
        {% endif %}
        {% set scan_dt = as_datetime(scan_raw, none) if scan_raw else none %} {% if scan_dt is not none %}
          {% set recorded = as_timestamp(scan_dt)
             | timestamp_custom('%m/%d/%Y %H:%M:%S', true) %}
        {% else %}
          {% set recorded = scan_raw or 'NO SCAN' %}
        {% endif %}
        {# Match BOTH the selected mission and its selected summary record. #} {% set latest_rows = namespace(rows=[]) %} {% if has_scan
              and record_id is not none
              and 'mission_id' in rad_series.columns
              and ('record_id' in rad_series.columns or 'scan_id' in rad_series.columns) %}
          {% set ri = rad_series.columns.index('record_id')
             if 'record_id' in rad_series.columns
             else rad_series.columns.index('scan_id') %}
          {% set mi = rad_series.columns.index('mission_id') %}
          {% for row in rad_series.rows %}
            {% if row[mi] == selected_mid
                  and row[ri] | int(-1) == record_id | int(-2) %}
              {% set latest_rows.rows = latest_rows.rows + [row] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% macro graph_popup(field, label, unit, color, decimals=2,
                             footer_label='LAST', footer_value=none) %}
          {% set ns = namespace(points=[], values=[]) %}

          {% if field in rad_series.columns and
                'elapsed_seconds' in rad_series.columns %}
            {% set fi = rad_series.columns.index(field) %}
            {% set ei = rad_series.columns.index('elapsed_seconds') %}

            {% for row in latest_rows.rows %}
              {% if row[fi] is not none and row[ei] is not none %}
                {% set cpm_v = row[rad_series.columns.index('cpm')]
                   if 'cpm' in rad_series.columns else none %}
                {% set dose_v = row[rad_series.columns.index('dose_usvh')]
                   if 'dose_usvh' in rad_series.columns else none %}
                {% set pulse_v = row[rad_series.columns.index('pulse_1s')]
                   if 'pulse_1s' in rad_series.columns else none %}
                {% set time_v = none %}
                {% if 'time' in rad_series.columns %}
                  {% set raw_dt = as_datetime(row[rad_series.columns.index('time')]) %}
                  {% if raw_dt %}
                    {% set time_v = raw_dt.strftime('%H:%M:%S') %}
                  {% endif %}
                {% endif %}

                {% set ns.values = ns.values + [row[fi] | float(0)] %}
                {% set ns.points = ns.points + [{
                  'elapsed': row[ei] | float(0),
                  'value': row[fi] | float(0),
                  'cpm': cpm_v,
                  'dose': dose_v,
                  'pulse': pulse_v,
                  'time': time_v
                }] %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set values = ns.values %}
            {% set minval = values | min %}
            {% set maxval = values | max %}
            {% set avgval = (values | sum) / count %}
            {% set latest = values[-1] %}
            {% set maxe = ns.points | map(attribute='elapsed') | max %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}
            {% endfor %}

            {% set graph = namespace(coords=[]) %}
            {% for p in ns.points %}
              {% if maxe <= 0 %}
                {% set x = 150 %}
              {% else %}
                {% set x = 14 + ((p.elapsed / maxe) * 272) %}
              {% endif %}

              {% if maxval == minval %}
                {% set y = 70 %}
              {% else %}
                {% set y = 126 - (((p.value - minval) /
                                  (maxval - minval)) * 106) %}
              {% endif %}

              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="rad-popup" style="
              background:#000;
              color:#fff;
              padding:16px;
              font-family:Antonio,Arial Narrow,sans-serif;
              box-sizing:border-box;
            ">
              <style>
                .rad-radio { position:absolute; opacity:0; pointer-events:none; }
                .rad-choice { cursor:pointer; }
                .rad-choice:hover { filter:brightness(1.12); }
                .rad-selected { display:none; }
                .rad-selected-empty { display:block; }
                {% for c in graph.coords %}
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .rad-selected-wrap .rad-selected-empty { display:none; }
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .rad-selected-wrap .rad-selected-{{ c['index'] }} { display:block; }
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="rad-radio"
                       type="radio"
                       name="{{ field }}-pick"
                       id="{{ field }}-pick-{{ c['index'] }}">
              {% endfor %}

              <div style="
                height:7px;
                background:{{ color }};
                border-radius:8px;
                margin-bottom:13px;
              "></div>

              <div style="
                text-align:center;
                font-size:22px;
                font-weight:900;
                letter-spacing:1px;
              ">
                {{ label }}
              </div>

              <div style="
                text-align:center;
                color:{{ color }};
                font-size:11px;
                font-weight:800;
                letter-spacing:1px;
                margin:3px 0 14px 0;
              ">
                {{ duration | round(0) | int }} SECOND SCAN
              </div>

              <div style="
                display:grid;
                grid-template-columns:repeat(4,1fr);
                gap:7px;
                margin-bottom:12px;
              ">
                <label class="rad-choice"
                       for="{{ field }}-pick-{{ picks.mini }}"
                       style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MIN</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ minval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">AVG</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ avgval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </div>

                <label class="rad-choice"
                       for="{{ field }}-pick-{{ picks.maxi }}"
                       style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MAX</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ maxval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">SAMPLES</div>
                  <div style="font-size:15px;font-weight:900;">{{ count }}</div>
                </div>
              </div>

              <div class="rad-selected-wrap"
                   style="background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:55px;">
                <div class="rad-selected-empty"
                     style="text-align:center;color:#777;font-size:10px;font-weight:800;letter-spacing:.7px;padding:17px 0;">
                  TAP A POINT OR SAMPLE TO INSPECT
                </div>

                {% for c in graph.coords %}
                  <div class="rad-selected rad-selected-{{ c['index'] }}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                      <div style="font-size:11px;font-weight:900;color:{{ color }};letter-spacing:.8px;">
                        SAMPLE {{ c['index'] }}
                      </div>
                      <div style="font-size:10px;color:#aaa;">
                        {% if c['p']['time'] %}{{ c['p']['time'] }} · {% endif %}
                        +{{ c['p']['elapsed'] | round(1) }} s
                      </div>
                    </div>

                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;">
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">CPM</div>
                        <div style="font-size:11px;font-weight:900;">
                          {{ c['p']['cpm'] | round(2) if c['p']['cpm'] is not none else '--' }}
                        </div>
                      </div>

                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">DOSE</div>
                        <div style="font-size:11px;font-weight:900;">
                          {{ c['p']['dose'] | round(4) if c['p']['dose'] is not none else '--' }}
                          {% if c['p']['dose'] is not none %} µSv/h{% endif %}
                        </div>
                      </div>

                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">PULSE</div>
                        <div style="font-size:11px;font-weight:900;">
                          {{ c['p']['pulse'] | round(0) | int if c['p']['pulse'] is not none else '--' }}
                        </div>
                      </div>
                    </div>
                  </div>
                {% endfor %}
              </div>

              <div style="
                background:#080808;
                border:1px solid #222;
                border-radius:14px;
                padding:10px;
              ">
                <div style="position:relative;width:100%;height:260px;">
                  <svg
                    viewBox="0 0 300 150"
                    preserveAspectRatio="none"
                    style="width:100%;height:260px;display:block;position:absolute;inset:0;"
                  >
                    <line x1="14" y1="126" x2="286" y2="126"
                          stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126"
                          stroke="#333" stroke-width="1"/>

                    {% if count > 1 %}
                      <polyline
                        points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}"
                        fill="none"
                        stroke="{{ color }}"
                        stroke-width="3"
                        vector-effect="non-scaling-stroke"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                      />
                    {% endif %}

                    {% for c in graph.coords %}
                      <circle cx="{{ c['x'] }}"
                              cy="{{ c['y'] }}"
                              r="5"
                              fill="{{ color }}">
                        <title>
                          {{ c['p']['elapsed'] | round(1) }} s — {{ c['p']['value'] | round(decimals) }} {{ unit }}
                        </title>
                      </circle>
                    {% endfor %}
                  </svg>

                  {% for c in graph.coords %}
                    <label
                      class="rad-choice"
                      for="{{ field }}-pick-{{ c['index'] }}"
                      title="Sample {{ c['index'] }} — {{ c['p']['elapsed'] | round(1) }} s — {{ c['p']['value'] | round(decimals) }} {{ unit }}"
                      style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3;">
                    </label>
                  {% endfor %}
                </div>

                <div style="
                  display:flex;
                  justify-content:space-between;
                  color:#888;
                  font-size:10px;
                  font-weight:800;
                  margin-top:-3px;
                ">
                  <span>0 s</span>
                  <span>{{ recorded }}</span>
                  <span>{{ maxe | round(0) | int }} s</span>
                </div>
              </div>

              <div style="
                margin-top:12px;
                background:#0b0b0b;
                border:1px solid #222;
                border-radius:12px;
                padding:8px;
              ">
                <div style="font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:5px;">
                  SAMPLE DETAIL
                </div>

                {% for c in graph.coords %}
                  <label
                    class="rad-choice"
                    for="{{ field }}-pick-{{ c['index'] }}"
                    style="display:grid;grid-template-columns:54px 1fr 1fr 1fr;gap:5px;align-items:center;padding:5px 0;border-top:1px solid #181818;font-size:9px;"
                  >
                    <div style="color:#888;">+{{ c['p']['elapsed'] | round(1) }} s</div>
                    <div>
                      <span style="color:#777;">CPM </span>
                      {{ c['p']['cpm'] | round(2) if c['p']['cpm'] is not none else '--' }}
                    </div>
                    <div>
                      <span style="color:#777;">DOSE </span>
                      {{ c['p']['dose'] | round(4) if c['p']['dose'] is not none else '--' }}
                    </div>
                    <div>
                      <span style="color:#777;">PULSE </span>
                      {{ c['p']['pulse'] | round(0) | int if c['p']['pulse'] is not none else '--' }}
                    </div>
                  </label>
                {% endfor %}
              </div>

              {% if footer_value is none %}
                <label
                  class="rad-choice"
                  for="{{ field }}-pick-{{ count }}"
                  style="display:block;margin-top:10px;text-align:center;font-size:11px;color:#888;"
                >
                  {{ footer_label }} {{ latest | round(decimals) }} {{ unit }}
                </label>
              {% else %}
                <div style="
                  margin-top:10px;
                  text-align:center;
                  font-size:11px;
                  color:#888;
                ">
                  {{ footer_label }} {{ footer_value }}
                </div>
              {% endif %}

              <div style="
                height:7px;
                background:{{ color }};
                border-radius:8px;
                margin-top:13px;
              "></div>
            </div>

          {% else %}

            <div style="
              background:#000;
              color:#fff;
              padding:22px;
              font-family:Antonio,Arial Narrow,sans-serif;
              text-align:center;
            ">
              <div style="font-size:20px;font-weight:900;">{{ label }}</div>
              <div style="color:#888;margin-top:12px;">
                No one-second radiation data for the selected mission/scan.
              </div>
              <div style="color:#666;margin-top:6px;font-size:10px;">
                Select a mission with a radiation scan, or wait for mission data to load.
              </div>
            </div>

          {% endif %}
        {% endmacro %}
        {% set cpm_popup = graph_popup(
          'cpm','CPM','CPM',rad_color,2) %}

        {% set dose_popup = graph_popup(
          'dose_usvh','DOSE RATE','µSv/h','#f59e0b',4) %}

        {% set pulses_popup = graph_popup(
          'pulse_1s','PULSES / SECOND','counts','#8296ff',0,
          'TOTAL PULSES', pulses | round(0) | int) %}

        {% set info_popup %}
          <div style="
            background:#000;
            color:#fff;
            padding:18px;
            font-family:Antonio,Arial Narrow,sans-serif;
          ">
            <div style="height:7px;background:{{ rad_color }};border-radius:8px;"></div>
            <div style="text-align:center;font-size:22px;font-weight:900;margin:14px 0;">
              RADIATION SCAN
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div style="background:#111;border-radius:12px;padding:10px;text-align:center;">
                <div style="font-size:8px;color:#777;">DURATION</div>
                <div style="font-size:18px;font-weight:900;">{{ duration | round(2) }} {{ duration_unit }}</div>
              </div>
              <div style="background:#111;border-radius:12px;padding:10px;text-align:center;">
                <div style="font-size:8px;color:#777;">RECORDED</div>
                <div style="font-size:14px;font-weight:900;">{{ recorded }}</div>
              </div>
              <div style="background:#111;border-radius:12px;padding:10px;text-align:center;">
                <div style="font-size:8px;color:#777;">CPM</div>
                <div style="font-size:18px;font-weight:900;">{{ cpm | round(2) }}</div>
              </div>
              <div style="background:#111;border-radius:12px;padding:10px;text-align:center;">
                <div style="font-size:8px;color:#777;">STATUS</div>
                <div style="font-size:14px;font-weight:900;">{{ rad_status | upper }}</div>
              </div>
            </div>
            <div style="height:7px;background:{{ rad_color }};border-radius:8px;margin-top:14px;"></div>
          </div>
        {% endset %}
        <style>
          .env-card {
            background: #000;
            border: 0;
            border-radius: 38px;
            padding: 10px 18px 10px 18px;
            overflow: hidden;
            font-family: "Antonio", "Arial Narrow", sans-serif;
            box-sizing: border-box;
          }

          .env-topline {
            height: 7px;
            margin: -5px -18px 10px -18px;
          }

          .env-bottomline {
            height: 7px;
            margin: 10px -18px -5px -18px;
          }

          .env-title {
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0 0 7px 0;
          }

          .env-row {
            display: grid;
            height: 30px;
            margin: 4px 0;
            cursor: pointer;
            user-select: none;
          }

          .env-row:hover {
            filter: brightness(1.08);
          }

          .env-row.left {
            grid-template-columns: 52px 1fr 1.75fr;
          }

          .env-row.right {
            grid-template-columns: 1.75fr 1fr 52px;
          }

          .env-cap {
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
          }

          .leftcap {
            border-radius: 15px 0 0 15px;
          }

          .rightcap {
            border-radius: 0 15px 15px 0;
          }

          .env-value {
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 17px;
            font-weight: 800;
            white-space: nowrap;
            padding: 0 4px;
          }

          .env-value.small {
            font-size: 13px;
          }

          .unit {
            font-size: 9px;
            font-weight: 600;
            margin-left: 3px;
          }

          .env-label {
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            padding: 0 6px;
          }

          .round-right {
            border-radius: 0 15px 15px 0;
          }

          .round-left {
            border-radius: 15px 0 0 15px;
          }

          ha-icon {
            --mdc-icon-size: 16px;
          }
        </style>
        <div class="env-card">

          <div class="env-topline" style="background:{{ rad_color }};"></div>

          <div class="env-title">RADIATION</div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"CPM SCAN",content:{{ cpm_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:{{ rad_color }};">
              <ha-icon icon="mdi:radioactive"></ha-icon>
            </div>
            <div class="env-value">
              {{ '%.2f' | format(cpm) if has_scan else '--' }}
              <span class="unit">{{ cpm_unit }}</span>
            </div>
            <div class="env-label round-right" style="background:{{ rad_color }};">CPM</div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"DOSE RATE SCAN",content:{{ dose_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#f59e0b;">DOSE</div>
            <div class="env-value">
              {{ '%.3f' | format(dose) if has_scan else '--' }}
              <span class="unit">{{ dose_unit }}</span>
            </div>
            <div class="env-cap rightcap" style="background:#f59e0b;">
              <ha-icon icon="mdi:radioactive-circle"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"PULSE SCAN",content:{{ pulses_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#8296ff;">
              <ha-icon icon="mdi:pulse"></ha-icon>
            </div>
            <div class="env-value">
              {{ pulses | round(0) | int if has_scan else '--' }}
              {% if pulse_unit %}
                <span class="unit">{{ pulse_unit }}</span>
              {% endif %}
            </div>
            <div class="env-label round-right" style="background:#8296ff;">PULSES</div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"RADIATION SCAN",content:{{ info_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#8296ff;">DURATION</div>
            <div class="env-value">
              {{ '%.2f' | format(duration) if has_scan else '--' }}
              <span class="unit">{{ duration_unit }}</span>
            </div>
            <div class="env-cap rightcap" style="background:#8296ff;">
              <ha-icon icon="mdi:timer-outline"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"RADIATION SCAN",content:{{ info_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#3b82f6;">
              <ha-icon icon="mdi:clock-outline"></ha-icon>
            </div>
            <div class="env-value small">
              {{ recorded }}
            </div>
            <div class="env-label round-right" style="background:#3b82f6;">SCAN TIME</div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"RADIATION SCAN",content:{{ info_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:{{ rad_color }};">STATUS</div>
            <div class="env-value small">{{ rad_status | upper }}</div>
            <div class="env-cap rightcap" style="background:{{ rad_color }};">
              {% if rad_color == '#ef4444' %}
                <ha-icon icon="mdi:alert-octagon"></ha-icon>
              {% elif rad_color == '#f59e0b' or rad_color == '#facc15' %}
                <ha-icon icon="mdi:alert"></ha-icon>
              {% elif rad_color == '#22c55e' %}
                <ha-icon icon="mdi:check-circle-outline"></ha-icon>
              {% else %}
                <ha-icon icon="mdi:help-circle-outline"></ha-icon>
              {% endif %}
            </div>
          </div>

          <div class="env-bottomline" style="background:{{ rad_color }};"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background: #29364c !important;
            padding: 2px !important;
            border: none !important;
            border-radius: 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_number.tric_temperature
      - input_number.tric_humidity
      - input_number.tric_pressure
      - input_number.tric_altitude
      - input_number.tric_lux
      - input_number.tric_proximity
      - input_number.tric_eco2
      - input_number.tric_tvoc
      - input_datetime.tric_atmosphere_time
      - sensor.tricorder_mission_scans
      content: |
        {% set temp = states('input_number.tric_temperature') | float(0) %} {% set humidity = states('input_number.tric_humidity') | float(0) %} {% set pressure = states('input_number.tric_pressure') | float(0) %} {% set altitude = states('input_number.tric_altitude') | float(0) %} {% set lux = states('input_number.tric_lux') | float(0) %} {% set proximity = states('input_number.tric_proximity') | float(0) %} {% set eco2 = states('input_number.tric_eco2') | float(0) %} {% set tvoc = states('input_number.tric_tvoc') | float(0) %}
        {% set raw_time = states('input_datetime.tric_atmosphere_time') %} {% set scan_time = as_datetime(raw_time) %} {% if scan_time %}
          {% set recorded = scan_time.strftime('%m/%d/%Y %H:%M:%S') %}
          {% set scan_end_ts = as_timestamp(scan_time) %}
        {% else %}
          {% set recorded = raw_time %}
          {% set scan_end_ts = none %}
        {% endif %}
        {% if temp <= 55 %}
          {% set temp_color = '#3b82f6' %}
        {% elif temp <= 80 %}
          {% set temp_color = '#22c55e' %}
        {% else %}
          {% set temp_color = '#ef4444' %}
        {% endif %}
        {# Find latest Atmosphere scan points near the recorded scan time. #} {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set atmosphere = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_atmosphere' %}
            {% set atmosphere.columns = series.get('columns', []) %}
            {% set atmosphere.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {% set candidates = namespace(rows=[]) %} {% if scan_end_ts is not none and 'time' in atmosphere.columns %}
          {% set ti = atmosphere.columns.index('time') %}
          {% for row in atmosphere.rows %}
            {% set dt = as_datetime(row[ti]) %}
            {% if dt %}
              {% set ts = as_timestamp(dt) %}
              {% if ts >= scan_end_ts - 40 and ts <= scan_end_ts + 2 %}
                {% set candidates.rows = candidates.rows + [row] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# Keep only the most recent contiguous scan cluster. #} {% set cluster = namespace(rows=[], active=true, last_ts=none) %} {% if candidates.rows and 'time' in atmosphere.columns %}
          {% set ti = atmosphere.columns.index('time') %}
          {% for row in candidates.rows | reverse %}
            {% if cluster.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if cluster.last_ts is none or (cluster.last_ts - ts) <= 2.5 %}
                  {% set cluster.rows = [row] + cluster.rows %}
                  {% set cluster.last_ts = ts %}
                {% else %}
                  {% set cluster.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# If the helper timestamp belongs to a different/newer Mission,
           fall back to the newest contiguous Atmosphere scan in the selected Mission. #}
        {% if not cluster.rows and atmosphere.rows and 'time' in atmosphere.columns %}
          {% set ti = atmosphere.columns.index('time') %}
          {% set fallback = namespace(rows=[], active=true, last_ts=none) %}

          {% for row in atmosphere.rows | reverse %}
            {% if fallback.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if fallback.last_ts is none or (fallback.last_ts - ts) <= 2.5 %}
                  {% set fallback.rows = [row] + fallback.rows %}
                  {% set fallback.last_ts = ts %}
                {% else %}
                  {% set fallback.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {% set cluster.rows = fallback.rows %}
        {% endif %}
        {% set scan_rows = cluster.rows %}
        {# Use the selected Mission scan's own timestamp, not a helper from another Mission. #} {% if scan_rows and 'time' in atmosphere.columns %}
          {% set selected_dt = as_datetime(scan_rows[-1][atmosphere.columns.index('time')]) %}
          {% if selected_dt %}
            {% set recorded = selected_dt.strftime('%m/%d/%Y %H:%M:%S') %}
          {% endif %}
        {% endif %}
        {# Keep the main card tied to the same saved Atmosphere scan used by the popups. #} {% if scan_rows %}
          {% set last_row = scan_rows[-1] %}

          {% if 'temperature_f' in atmosphere.columns %}
            {% set temp = last_row[atmosphere.columns.index('temperature_f')] | float(temp) %}
          {% endif %}
          {% if 'humidity_percent' in atmosphere.columns %}
            {% set humidity = last_row[atmosphere.columns.index('humidity_percent')] | float(humidity) %}
          {% endif %}
          {% if 'pressure_hpa' in atmosphere.columns %}
            {% set pressure = last_row[atmosphere.columns.index('pressure_hpa')] | float(pressure) %}
          {% endif %}
          {% if 'altitude_m' in atmosphere.columns %}
            {% set altitude = last_row[atmosphere.columns.index('altitude_m')] | float(altitude) %}
          {% endif %}
          {% if 'lux' in atmosphere.columns %}
            {% set lux = last_row[atmosphere.columns.index('lux')] | float(lux) %}
          {% endif %}
          {% if 'proximity' in atmosphere.columns %}
            {% set proximity = last_row[atmosphere.columns.index('proximity')] | float(proximity) %}
          {% endif %}
          {% if 'eco2_ppm' in atmosphere.columns and last_row[atmosphere.columns.index('eco2_ppm')] is not none %}
            {% set eco2 = last_row[atmosphere.columns.index('eco2_ppm')] | float(eco2) %}
          {% endif %}
          {% if 'tvoc_ppb' in atmosphere.columns and last_row[atmosphere.columns.index('tvoc_ppb')] is not none %}
            {% set tvoc = last_row[atmosphere.columns.index('tvoc_ppb')] | float(tvoc) %}
          {% endif %}
        {% endif %}
        {% macro sensor_popup(field, label, unit, color, decimals=1) %}
          {% set detail_decimals = 0 if decimals == 0 else 3 %}
          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if field in atmosphere.columns and 'time' in atmosphere.columns %}
            {% set fi = atmosphere.columns.index(field) %}
            {% set ti = atmosphere.columns.index('time') %}
            {% set ei = atmosphere.columns.index('elapsed_seconds') if 'elapsed_seconds' in atmosphere.columns else none %}

            {% for row in scan_rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% if ns.first_ts is none %}{% set ns.first_ts = ts %}{% endif %}
                  {% set ns.last_ts = ts %}
                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'value': row[fi] | float(0),
                    'time': dt.strftime('%H:%M:%S'),
                    'mission': row[ei] if ei is not none else none
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set span = (ns.last_ts - ns.first_ts) if count > 1 else 0 %}
            {% set duration = ((span + 1) | round(0) | int) if count > 1 else 1 %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% set graph = namespace(coords=[]) %}

            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}

              {% set x = 150 if span <= 0 else 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
              {% set y = 70 if maxval == minval else 126 - (((p['value'] - minval) / (maxval - minval)) * 106) %}
              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': (p['ts'] - ns.first_ts) | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="ap">
              <style>
                .ap{background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box}
                .ap *{box-sizing:border-box}.ar{position:absolute;opacity:0;pointer-events:none}.ac{cursor:pointer}.ac:hover{filter:brightness(1.12)}
                .bar{height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px}.ttl{text-align:center;font-size:22px;font-weight:900;letter-spacing:1px}
                .sub{text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px}
                .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.tile{background:#111;border-radius:11px;padding:8px;text-align:center}
                .k{font-size:8px;color:#777}.v{font-size:15px;font-weight:900}.u{font-size:8px;color:#aaa}
                .sel{display:none}.blank{display:block;text-align:center;color:#777;font-size:10px;font-weight:800;padding:16px 0}
                .sw{background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:54px}
                .sh{display:flex;justify-content:space-between;font-size:13px;color:#ccc;margin-bottom:7px}.sv{background:#050505;border-radius:8px;padding:9px;text-align:center;font-size:18px;font-weight:900}
                .graph{background:#080808;border:1px solid #222;border-radius:14px;padding:10px}.gp{position:relative;width:100%;height:260px}
                .axis{display:flex;justify-content:space-between;color:#aaa;font-size:14px;font-weight:800;margin-top:4px}.stamp{font-size:15px;color:#ddd}
                .rows{margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px}.rh{font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:4px}
                .row{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:7px 5px;border-top:1px solid #181818;font-size:11px}.last{display:block;margin-top:10px;text-align:center;font-size:11px;color:#888}
                {% for c in graph.coords %}
                  #{{ field }}-p{{ c['index'] }}:checked~.sw .blank{display:none}
                  #{{ field }}-p{{ c['index'] }}:checked~.sw .s{{ c['index'] }}{display:block}
                  #{{ field }}-p{{ c['index'] }}:checked~.graph .d{{ c['index'] }}{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 4px {{ color }})}
                  #{{ field }}-p{{ c['index'] }}:checked~.rows .r{{ c['index'] }}{background:#171717;color:#fff}
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="ar" type="radio" name="{{ field }}-p" id="{{ field }}-p{{ c['index'] }}">
              {% endfor %}

              <div class="bar"></div>
              <div class="ttl">{{ label }}</div>
              <div class="sub">{{ duration }} SECOND SCAN</div>

              <div class="sum">
                <label class="tile ac" for="{{ field }}-p{{ picks.mini }}"><div class="k">MIN</div><div class="v">{{ minval | round(decimals) }} <span class="u">{{ unit }}</span></div></label>
                <div class="tile"><div class="k">AVG</div><div class="v">{{ avgval | round(decimals) }} <span class="u">{{ unit }}</span></div></div>
                <label class="tile ac" for="{{ field }}-p{{ picks.maxi }}"><div class="k">MAX</div><div class="v">{{ maxval | round(decimals) }} <span class="u">{{ unit }}</span></div></label>
                <div class="tile"><div class="k">SAMPLES</div><div class="v">{{ count }}</div></div>
              </div>

              <div class="sw">
                <div class="blank">TAP A POINT OR SAMPLE TO INSPECT</div>
                {% for c in graph.coords %}
                  <div class="sel s{{ c['index'] }}">
                    <div class="sh"><b style="color:{{ color }}">SAMPLE {{ c['index'] }}</b><span>{{ c['p']['time'] }} · +{{ c['offset'] }} s</span></div>
                    <div class="sv">{{ c['p']['value'] | round(detail_decimals) }} <span class="u">{{ unit }}</span></div>
                    <div class="k" style="text-align:center;margin-top:6px">MISSION {% if c['p']['mission'] is not none %}{{ c['p']['mission'] | round(1) }} s{% else %}--{% endif %}</div>
                  </div>
                {% endfor %}
              </div>

              <div class="graph">
                <div class="gp">
                  <svg viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:260px;display:block;position:absolute;inset:0">
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>
                    {% if count > 1 %}
                      <polyline points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}" fill="none" stroke="{{ color }}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                    {% endif %}
                    {% for c in graph.coords %}
                      <circle class="d{{ c['index'] }}" cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}"/>
                    {% endfor %}
                  </svg>
                  {% for c in graph.coords %}
                    <label class="ac" for="{{ field }}-p{{ c['index'] }}" style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3"></label>
                  {% endfor %}
                </div>
                <div class="axis"><span>0 s</span><span class="stamp">{{ recorded }}</span><span>{{ duration }} s</span></div>
              </div>

              <div class="rows">
                <div class="rh">SAMPLE DETAIL</div>
                {% for c in graph.coords %}
                  <label class="row ac r{{ c['index'] }}" for="{{ field }}-p{{ c['index'] }}"><span style="color:#aaa">{{ c['p']['time'] }}</span><span>{{ label }} {{ c['p']['value'] | round(detail_decimals) }} {{ unit }}</span></label>
                {% endfor %}
              </div>

              <label class="last ac" for="{{ field }}-p{{ count }}">LAST {{ ns.values[-1] | round(detail_decimals) }} {{ unit }}</label>
              <div class="bar" style="margin-top:13px;margin-bottom:0"></div>
            </div>

          {% else %}
            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center">
              <div style="font-size:20px;font-weight:900">{{ label }}</div>
              <div style="color:#888;margin-top:12px">No time-series samples found for this scan.</div>
            </div>
          {% endif %}
        {% endmacro %}
        {% set temp_popup = sensor_popup(
          'temperature_f','TEMPERATURE','°F',temp_color,1) %}
        {% set humidity_popup = sensor_popup(
          'humidity_percent','HUMIDITY','%','#8296ff',1) %}
        {% set pressure_popup = sensor_popup(
          'pressure_hpa','PRESSURE','hPa','#f59e0b',1) %}
        {% set altitude_popup = sensor_popup(
          'altitude_m','ALTITUDE','m','#8e87b6',1) %}
        {% set lux_popup = sensor_popup(
          'lux','LIGHT','lx','#facc15',1) %}
        {% set proximity_popup = sensor_popup(
          'proximity','PROXIMITY','','#3b82f6',0) %}
        {% set eco2_popup = sensor_popup(
          'eco2_ppm','eCO₂','ppm','#22c55e',0) %}
        {% set tvoc_popup = sensor_popup(
          'tvoc_ppb','TVOC','ppb','#f59e0b',0) %}

        <style>
          .env-card {
            background:#000;
            border:0;
            border-radius:38px;
            padding:10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }

          .env-topline {
            height:7px;
            background:{{ temp_color }};
            margin:-5px -18px 10px -18px;
          }

          .env-bottomline {
            height:7px;
            background:{{ temp_color }};
            margin:10px -18px -5px -18px;
          }

          .env-title {
            color:#fff;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1px;
            margin:0 0 7px 0;
          }

          .env-row {
            display:grid;
            height:30px;
            margin:4px 0;
            cursor:pointer;
            user-select:none;
          }

          .env-row:hover {
            filter:brightness(1.08);
          }

          .env-row.left {
            grid-template-columns:52px 1fr 1.75fr;
          }

          .env-row.right {
            grid-template-columns:1.75fr 1fr 52px;
          }

          .env-cap {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
          }

          .leftcap {
            border-radius:15px 0 0 15px;
          }

          .rightcap {
            border-radius:0 15px 15px 0;
          }

          .env-value {
            background:#000;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:17px;
            font-weight:800;
            white-space:nowrap;
            padding:0 4px;
          }

          .env-value.small {
            font-size:14px;
          }

          .unit {
            font-size:9px;
            font-weight:600;
            margin-left:3px;
          }

          .env-label {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:9px;
            font-weight:800;
            padding:0 6px;
          }

          .round-right {
            border-radius:0 15px 15px 0;
          }

          .round-left {
            border-radius:15px 0 0 15px;
          }

          ha-icon {
            --mdc-icon-size:16px;
          }
        </style>
        <div class="env-card">
          <div class="env-topline"></div>

          <div class="env-title">
            ATMOSPHERE
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"TEMPERATURE SCAN",content:{{ temp_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:{{ temp_color }};">
              <ha-icon icon="mdi:thermometer"></ha-icon>
            </div>
            <div class="env-value">
              {{ '%.1f' | format(temp) }}
              <span class="unit">{{ state_attr('input_number.tric_temperature','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-label round-right" style="background:{{ temp_color }};">
              TEMPERATURE
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"HUMIDITY SCAN",content:{{ humidity_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#8296ff;">
              HUMIDITY
            </div>
            <div class="env-value">
              {{ '%.1f' | format(humidity) }}
              <span class="unit">{{ state_attr('input_number.tric_humidity','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-cap rightcap" style="background:#8296ff;">
              <ha-icon icon="mdi:water-percent"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"PRESSURE SCAN",content:{{ pressure_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#f59e0b;">
              <ha-icon icon="mdi:gauge"></ha-icon>
            </div>
            <div class="env-value small">
              {{ '%.1f' | format(pressure) }}
              <span class="unit">{{ state_attr('input_number.tric_pressure','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-label round-right" style="background:#f59e0b;">
              PRESSURE
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"ALTITUDE SCAN",content:{{ altitude_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#8e87b6;">
              ALTITUDE
            </div>
            <div class="env-value small">
              {{ '%.1f' | format(altitude) }}
              <span class="unit">{{ state_attr('input_number.tric_altitude','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-cap rightcap" style="background:#8e87b6;">
              <ha-icon icon="mdi:image-filter-hdr"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"LIGHT SCAN",content:{{ lux_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#facc15;">
              <ha-icon icon="mdi:brightness-5"></ha-icon>
            </div>
            <div class="env-value small">
              {{ '%.1f' | format(lux) }}
              <span class="unit">{{ state_attr('input_number.tric_lux','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-label round-right" style="background:#facc15;">
              LIGHT
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"PROXIMITY SCAN",content:{{ proximity_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#3b82f6;">
              PROXIMITY
            </div>
            <div class="env-value">
              {{ proximity | round(0) | int }}
            </div>
            <div class="env-cap rightcap" style="background:#3b82f6;">
              <ha-icon icon="mdi:radar"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"eCO2 SCAN",content:{{ eco2_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#22c55e;">
              <ha-icon icon="mdi:molecule-co2"></ha-icon>
            </div>
            <div class="env-value small">
              {{ eco2 | round(0) | int }}
              <span class="unit">{{ state_attr('input_number.tric_eco2','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-label round-right" style="background:#22c55e;">
              eCO₂
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"TVOC SCAN",content:{{ tvoc_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#f59e0b;">
              TVOC
            </div>
            <div class="env-value small">
              {{ tvoc | round(0) | int }}
              <span class="unit">{{ state_attr('input_number.tric_tvoc','unit_of_measurement') or '' }}</span>
            </div>
            <div class="env-cap rightcap" style="background:#f59e0b;">
              <ha-icon icon="mdi:molecule"></ha-icon>
            </div>
          </div>

          <div class="env-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
  - type: grid
    cards:
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_number.tric_audio_relative_db
      - input_number.tric_audio_peak_db
      - input_datetime.tric_audio_time
      - sensor.tricorder_mission_scans
      content: |
        {% set audio = states('input_number.tric_audio_relative_db') | float(0) %} {% set peak = states('input_number.tric_audio_peak_db') | float(0) %}
        {% set audio_unit = state_attr('input_number.tric_audio_relative_db',
           'unit_of_measurement') or 'dB' %}
        {% set peak_unit = state_attr('input_number.tric_audio_peak_db',
           'unit_of_measurement') or 'dB' %}

        {% set raw_time = states('input_datetime.tric_audio_time') %} {% set scan_time = as_datetime(raw_time) %} {% if scan_time %}
          {% set recorded = scan_time.strftime('%m/%d/%Y %H:%M:%S') %}
          {% set scan_end_ts = as_timestamp(scan_time) %}
        {% else %}
          {% set recorded = raw_time %}
          {% set scan_end_ts = none %}
        {% endif %}
        {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set audio_series = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_audio' %}
            {% set audio_series.columns = series.get('columns', []) %}
            {% set audio_series.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {# Latest saved Audio scan cluster. #} {% set candidates = namespace(rows=[]) %} {% if scan_end_ts is not none and 'time' in audio_series.columns %}
          {% set ti = audio_series.columns.index('time') %}
          {% for row in audio_series.rows %}
            {% set dt = as_datetime(row[ti]) %}
            {% if dt %}
              {% set ts = as_timestamp(dt) %}
              {% if ts >= scan_end_ts - 40 and ts <= scan_end_ts + 2 %}
                {% set candidates.rows = candidates.rows + [row] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set cluster = namespace(rows=[], active=true, last_ts=none) %} {% if candidates.rows and 'time' in audio_series.columns %}
          {% set ti = audio_series.columns.index('time') %}
          {% for row in candidates.rows | reverse %}
            {% if cluster.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if cluster.last_ts is none or (cluster.last_ts - ts) <= 2.5 %}
                  {% set cluster.rows = [row] + cluster.rows %}
                  {% set cluster.last_ts = ts %}
                {% else %}
                  {% set cluster.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# Fallback: newest contiguous Audio cluster. #} {% if not cluster.rows and audio_series.rows and 'time' in audio_series.columns %}
          {% set ti = audio_series.columns.index('time') %}
          {% set fallback = namespace(rows=[], active=true, last_ts=none) %}
          {% for row in audio_series.rows | reverse %}
            {% if fallback.active %}
              {% set dt = as_datetime(row[ti]) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if fallback.last_ts is none or (fallback.last_ts - ts) <= 2.5 %}
                  {% set fallback.rows = [row] + fallback.rows %}
                  {% set fallback.last_ts = ts %}
                {% else %}
                  {% set fallback.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set cluster.rows = fallback.rows %}
        {% endif %}
        {% macro sensor_popup(primary_field, fallback_field, label, unit, color, decimals=1) %}
          {% set field = primary_field %}
          {% if field not in audio_series.columns and fallback_field in audio_series.columns %}
            {% set field = fallback_field %}
          {% endif %}

          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if field in audio_series.columns and 'time' in audio_series.columns %}
            {% set fi = audio_series.columns.index(field) %}
            {% set ti = audio_series.columns.index('time') %}

            {% for row in cluster.rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}

                  {% set rel_v = row[audio_series.columns.index('relative_db')]
                     if 'relative_db' in audio_series.columns else none %}

                  {% if 'peak_db' in audio_series.columns %}
                    {% set peak_v = row[audio_series.columns.index('peak_db')] %}
                  {% else %}
                    {% set peak_v = rel_v %}
                  {% endif %}

                  {% set mission_v = row[audio_series.columns.index('elapsed_seconds')]
                     if 'elapsed_seconds' in audio_series.columns else none %}

                  {% if ns.first_ts is none %}
                    {% set ns.first_ts = ts %}
                  {% endif %}
                  {% set ns.last_ts = ts %}
                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'value': row[fi] | float(0),
                    'time': dt.strftime('%H:%M:%S'),
                    'mission': mission_v,
                    'audio': rel_v,
                    'peak': peak_v
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set latest_value = ns.values[-1] %}

            {% if count > 1 %}
              {% set span = ns.last_ts - ns.first_ts %}
              {% set duration = (span + 1) | round(0) | int %}
            {% else %}
              {% set span = 0 %}
              {% set duration = 1 %}
            {% endif %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}
            {% endfor %}

            {% set graph = namespace(coords=[]) %}
            {% for p in ns.points %}
              {% if span <= 0 %}
                {% set x = 150 %}
                {% set offset = 0 %}
              {% else %}
                {% set x = 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
                {% set offset = p['ts'] - ns.first_ts %}
              {% endif %}

              {% if maxval == minval %}
                {% set y = 70 %}
              {% else %}
                {% set y = 126 - (((p['value'] - minval) /
                                   (maxval - minval)) * 106) %}
              {% endif %}

              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': offset | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="audio-popup" style="background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box;">
              <style>
                .audio-radio { position:absolute; opacity:0; pointer-events:none; }
                .audio-choice { cursor:pointer; }
                .audio-choice:hover { filter:brightness(1.12); }
                .audio-selected { display:none; }
                .audio-selected-empty { display:block; }
                {% for c in graph.coords %}
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .audio-selected-wrap .audio-selected-empty { display:none; }
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .audio-selected-wrap .audio-selected-{{ c['index'] }} { display:block; }
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="audio-radio" type="radio" name="{{ field }}-pick" id="{{ field }}-pick-{{ c['index'] }}">
              {% endfor %}

              <div style="height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px;"></div>

              <div style="text-align:center;font-size:22px;font-weight:900;letter-spacing:1px;">{{ label }}</div>

              <div style="text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px 0;">
                {{ duration }} SECOND SCAN
              </div>

              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;">
                <label class="audio-choice" for="{{ field }}-pick-{{ picks.mini }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MIN</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ minval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">AVG</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ avgval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </div>

                <label class="audio-choice" for="{{ field }}-pick-{{ picks.maxi }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MAX</div>
                  <div style="font-size:15px;font-weight:900;">
                    {{ maxval | round(decimals) }}
                    <span style="font-size:8px;color:#aaa;">{{ unit }}</span>
                  </div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">SAMPLES</div>
                  <div style="font-size:15px;font-weight:900;">{{ count }}</div>
                </div>
              </div>

              <div class="audio-selected-wrap" style="background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:55px;">
                <div class="audio-selected-empty" style="text-align:center;color:#777;font-size:10px;font-weight:800;letter-spacing:.7px;padding:17px 0;">
                  TAP A POINT OR SAMPLE TO INSPECT
                </div>

                {% for c in graph.coords %}
                  <div class="audio-selected audio-selected-{{ c['index'] }}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                      <div style="font-size:11px;font-weight:900;color:{{ color }};letter-spacing:.8px;">
                        SAMPLE {{ c['index'] }}
                      </div>
                      <div style="font-size:10px;color:#aaa;">
                        {{ c['p']['time'] }} · +{{ c['offset'] }} s
                      </div>
                    </div>

                    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px;">
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">AUDIO</div>
                        <div style="font-size:11px;font-weight:900;">
                          {{ c['p']['audio'] | round(1) if c['p']['audio'] is not none else '--' }}
                          {% if c['p']['audio'] is not none %} dB{% endif %}
                        </div>
                      </div>

                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">PEAK</div>
                        <div style="font-size:11px;font-weight:900;">
                          {{ c['p']['peak'] | round(1) if c['p']['peak'] is not none else '--' }}
                          {% if c['p']['peak'] is not none %} dB{% endif %}
                        </div>
                      </div>
                    </div>

                    <div style="text-align:center;color:#777;font-size:8px;margin-top:6px;">
                      MISSION
                      {% if c['p']['mission'] is not none %}
                        {{ c['p']['mission'] | round(1) }} s
                      {% else %}
                        --
                      {% endif %}
                    </div>
                  </div>
                {% endfor %}
              </div>

              <div style="background:#080808;border:1px solid #222;border-radius:14px;padding:10px;">
                <div style="position:relative;width:100%;height:260px;">
                  <svg
                    viewBox="0 0 300 150"
                    preserveAspectRatio="none"
                    style="width:100%;height:260px;display:block;position:absolute;inset:0;"
                  >
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>

                    {% if count > 1 %}
                      <polyline
                        points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}"
                        fill="none"
                        stroke="{{ color }}"
                        stroke-width="3"
                        vector-effect="non-scaling-stroke"
                        stroke-linejoin="round"
                        stroke-linecap="round"/>
                    {% endif %}

                    {% for c in graph.coords %}
                      <circle cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}">
                        <title>{{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }} {{ unit }}</title>
                      </circle>
                    {% endfor %}
                  </svg>

                  {% for c in graph.coords %}
                    <label
                      class="audio-choice"
                      for="{{ field }}-pick-{{ c['index'] }}"
                      title="Sample {{ c['index'] }} — {{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }} {{ unit }}"
                      style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3;">
                    </label>
                  {% endfor %}
                </div>

                <div style="display:flex;justify-content:space-between;color:#888;font-size:10px;font-weight:800;margin-top:-3px;">
                  <span>0 s</span>
                  <span>{{ recorded }}</span>
                  <span>{{ duration }} s</span>
                </div>
              </div>

              <div style="margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px;">
                <div style="font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:5px;">
                  SAMPLE DETAIL
                </div>

                {% for c in graph.coords %}
                  <label
                    class="audio-choice"
                    for="{{ field }}-pick-{{ c['index'] }}"
                    style="display:grid;grid-template-columns:60px 1fr 1fr;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #181818;font-size:9px;"
                  >
                    <div style="color:#888;">{{ c['p']['time'] }}</div>
                    <div>
                      <span style="color:#777;">AUDIO </span>
                      {{ c['p']['audio'] | round(1) if c['p']['audio'] is not none else '--' }}
                    </div>
                    <div>
                      <span style="color:#777;">PEAK </span>
                      {{ c['p']['peak'] | round(1) if c['p']['peak'] is not none else '--' }}
                    </div>
                  </label>
                {% endfor %}
              </div>

              <label
                class="audio-choice"
                for="{{ field }}-pick-{{ count }}"
                style="display:block;margin-top:10px;text-align:center;font-size:11px;color:#888;"
              >
                LAST {{ latest_value | round(decimals) }} {{ unit }}
              </label>

              <div style="height:7px;background:{{ color }};border-radius:8px;margin-top:13px;"></div>
            </div>

          {% else %}

            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center;">
              <div style="font-size:20px;font-weight:900;">{{ label }}</div>
              <div style="color:#888;margin-top:12px;">
                No time-series samples found for this scan.
              </div>
            </div>

          {% endif %}
        {% endmacro %}
        {% set audio_popup = sensor_popup(
          'relative_db','relative_db','AUDIO LEVEL','dB','#8296ff',1) %}

        {% set peak_popup = sensor_popup(
          'peak_db','relative_db','PEAK LEVEL','dB','#f59e0b',1) %}

        <style>
          .env-card {
            background:#000;
            border:0;
            border-radius:38px;
            padding:10px 18px 10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }

          .env-topline {
            height:7px;
            background:#8296ff;
            margin:-5px -18px 10px -18px;
          }

          .env-bottomline {
            height:7px;
            background:#8e87b6;
            margin:10px -18px -5px -18px;
          }

          .env-title {
            color:#fff;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1px;
            margin:0 0 7px 0;
          }

          .env-row {
            display:grid;
            height:30px;
            margin:4px 0;
            cursor:pointer;
            user-select:none;
          }

          .env-row:hover {
            filter:brightness(1.08);
          }

          .env-row.left {
            grid-template-columns:52px 1fr 1.75fr;
          }

          .env-row.right {
            grid-template-columns:1.75fr 1fr 52px;
          }

          .env-cap {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
          }

          .leftcap {
            border-radius:15px 0 0 15px;
          }

          .rightcap {
            border-radius:0 15px 15px 0;
          }

          .env-value {
            background:#000;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:17px;
            font-weight:800;
            white-space:nowrap;
          }

          .unit {
            font-size:9px;
            font-weight:600;
            margin-left:3px;
          }

          .env-label {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:9px;
            font-weight:800;
            padding:0 6px;
          }

          .round-right {
            border-radius:0 15px 15px 0;
          }

          .round-left {
            border-radius:15px 0 0 15px;
          }

          ha-icon {
            --mdc-icon-size:16px;
          }
        </style>
        <div class="env-card">
          <div class="env-topline"></div>

          <div class="env-title">
            AUDIO
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"AUDIO LEVEL SCAN",content:{{ audio_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#8296ff;">
              <ha-icon icon="mdi:waveform"></ha-icon>
            </div>

            <div class="env-value">
              {{ '%.1f' | format(audio) }}
              {% if audio_unit %}
                <span class="unit">{{ audio_unit }}</span>
              {% endif %}
            </div>

            <div class="env-label round-right" style="background:#8296ff;">
              AUDIO LEVEL
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"PEAK LEVEL SCAN",content:{{ peak_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#f59e0b;">
              PEAK LEVEL
            </div>

            <div class="env-value">
              {{ '%.1f' | format(peak) }}
              {% if peak_unit %}
                <span class="unit">{{ peak_unit }}</span>
              {% endif %}
            </div>

            <div class="env-cap rightcap" style="background:#f59e0b;">
              <ha-icon icon="mdi:volume-high"></ha-icon>
            </div>
          </div>

          <div class="env-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_text.tric_archive_mission_id
      - sensor.tricorder_mission_scans
      content: |
        {# All values and graphs must come from the SELECTED mission, not live helpers. #} {% set selected_mid = states('input_text.tric_archive_mission_id') %} {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set color_series = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_color' %}
            {% set color_series.columns = series.get('columns', []) %}
            {% set color_series.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {# Discard rows from any old mission while the HA query is updating.
           Ignore terminal rows with null readings. Zero IS a valid reading. #}
        {% set color_data = namespace(rows=[], latest=none, latest_ts=none) %} {% if selected_mid not in ['', 'unknown', 'unavailable']
              and 'mission_id' in color_series.columns
              and 'time' in color_series.columns %}
          {% set mi = color_series.columns.index('mission_id') %}
          {% set ti = color_series.columns.index('time') %}
          {% for row in color_series.rows %}
            {% if row[mi] == selected_mid %}
              {% set has_color = namespace(value=false) %}
              {% for channel in ['red', 'green', 'blue', 'clear'] %}
                {% if channel in color_series.columns
                      and row[color_series.columns.index(channel)] is not none %}
                  {% set has_color.value = true %}
                {% endif %}
              {% endfor %}
              {% if has_color.value %}
                {% set dt = as_datetime(row[ti], none) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% set color_data.rows = color_data.rows + [row] %}
                  {% if color_data.latest_ts is none or ts > color_data.latest_ts %}
                    {% set color_data.latest_ts = ts %}
                    {% set color_data.latest = row %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set red = none %} {% set green = none %} {% set blue = none %} {% set clear = none %} {% set recorded = '--' %} {% if color_data.latest is not none %}
          {% set last = color_data.latest %}
          {% set red = last[color_series.columns.index('red')]
             if 'red' in color_series.columns else none %}
          {% set green = last[color_series.columns.index('green')]
             if 'green' in color_series.columns else none %}
          {% set blue = last[color_series.columns.index('blue')]
             if 'blue' in color_series.columns else none %}
          {% set clear = last[color_series.columns.index('clear')]
             if 'clear' in color_series.columns else none %}
          {% set scan_time = as_datetime(last[color_series.columns.index('time')], none) %}
          {% if scan_time %}
            {% set recorded = scan_time.strftime('%m/%d/%Y %H:%M:%S') %}
          {% endif %}
        {% endif %}
        {# Popup data: the latest contiguous Color scan in this mission only. #} {% set cluster = namespace(rows=[], active=true, last_ts=none) %} {% if color_data.rows and 'time' in color_series.columns %}
          {% set ti = color_series.columns.index('time') %}
          {% for row in color_data.rows | reverse %}
            {% if cluster.active %}
              {% set dt = as_datetime(row[ti], none) %}
              {% if dt %}
                {% set ts = as_timestamp(dt) %}
                {% if cluster.last_ts is none
                      or (cluster.last_ts >= ts and cluster.last_ts - ts <= 2.5) %}
                  {% set cluster.rows = [row] + cluster.rows %}
                  {% set cluster.last_ts = ts %}
                {% else %}
                  {% set cluster.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% macro sensor_popup(field, label, color, decimals=0) %}
          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if field in color_series.columns and 'time' in color_series.columns %}
            {% set fi = color_series.columns.index(field) %}
            {% set ti = color_series.columns.index('time') %}

            {% for row in cluster.rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% set red_v = row[color_series.columns.index('red')] if 'red' in color_series.columns else none %}
                  {% set green_v = row[color_series.columns.index('green')] if 'green' in color_series.columns else none %}
                  {% set blue_v = row[color_series.columns.index('blue')] if 'blue' in color_series.columns else none %}
                  {% set clear_v = row[color_series.columns.index('clear')] if 'clear' in color_series.columns else none %}
                  {% set mission_v = row[color_series.columns.index('elapsed_seconds')] if 'elapsed_seconds' in color_series.columns else none %}

                  {% if ns.first_ts is none %}
                    {% set ns.first_ts = ts %}
                  {% endif %}
                  {% set ns.last_ts = ts %}
                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'value': row[fi] | float(0),
                    'time': dt.strftime('%H:%M:%S'),
                    'mission': mission_v,
                    'red': red_v,
                    'green': green_v,
                    'blue': blue_v,
                    'clear': clear_v
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set latest_value = ns.values[-1] %}

            {% if count > 1 %}
              {% set span = ns.last_ts - ns.first_ts %}
              {% set duration = (span + 1) | round(0) | int %}
            {% else %}
              {% set span = 0 %}
              {% set duration = 1 %}
            {% endif %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}
            {% endfor %}

            {% set graph = namespace(coords=[]) %}
            {% for p in ns.points %}
              {% if span <= 0 %}
                {% set x = 150 %}
                {% set offset = 0 %}
              {% else %}
                {% set x = 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
                {% set offset = p['ts'] - ns.first_ts %}
              {% endif %}

              {% if maxval == minval %}
                {% set y = 70 %}
              {% else %}
                {% set y = 126 - (((p['value'] - minval) /
                                   (maxval - minval)) * 106) %}
              {% endif %}

              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': offset | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="color-popup" style="background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box;">
              <style>
                .color-radio { position:absolute; opacity:0; pointer-events:none; }
                .color-choice { cursor:pointer; }
                .color-choice:hover { filter:brightness(1.12); }
                .color-selected { display:none; }
                .color-selected-empty { display:block; }
                {% for c in graph.coords %}
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .color-selected-wrap .color-selected-empty { display:none; }
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .color-selected-wrap .color-selected-{{ c['index'] }} { display:block; }
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="color-radio" type="radio" name="{{ field }}-pick" id="{{ field }}-pick-{{ c['index'] }}">
              {% endfor %}

              <div style="height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px;"></div>

              <div style="text-align:center;font-size:22px;font-weight:900;letter-spacing:1px;">{{ label }}</div>
              <div style="text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px 0;">{{ duration }} SECOND SCAN</div>

              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;">
                <label class="color-choice" for="{{ field }}-pick-{{ picks.mini }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MIN</div>
                  <div style="font-size:15px;font-weight:900;">{{ minval | round(decimals) }}</div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">AVG</div>
                  <div style="font-size:15px;font-weight:900;">{{ avgval | round(decimals) }}</div>
                </div>

                <label class="color-choice" for="{{ field }}-pick-{{ picks.maxi }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MAX</div>
                  <div style="font-size:15px;font-weight:900;">{{ maxval | round(decimals) }}</div>
                </label>

                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">SAMPLES</div>
                  <div style="font-size:15px;font-weight:900;">{{ count }}</div>
                </div>
              </div>

              <div class="color-selected-wrap" style="margin-bottom:12px;">
                <div class="color-selected-empty" style="background:#090909;border:1px solid #222;border-radius:12px;padding:9px;text-align:center;color:#777;font-size:9px;">
                  TAP A POINT, MIN, MAX, LAST, OR SAMPLE ROW
                </div>

                {% for c in graph.coords %}
                  <div class="color-selected color-selected-{{ c['index'] }}" style="background:#090909;border:1px solid #222;border-radius:12px;padding:9px;">
                    <div style="text-align:center;font-size:10px;font-weight:900;color:{{ color }};margin-bottom:7px;">
                      SAMPLE {{ c['index'] }} · {{ c['p']['time'] }} · +{{ c['offset'] | round(1) }} s
                    </div>

                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;">
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">RED</div>
                        <div style="font-size:11px;font-weight:900;">{{ c['p']['red'] | round(0) | int if c['p']['red'] is not none else '--' }}</div>
                      </div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">GREEN</div>
                        <div style="font-size:11px;font-weight:900;">{{ c['p']['green'] | round(0) | int if c['p']['green'] is not none else '--' }}</div>
                      </div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">BLUE</div>
                        <div style="font-size:11px;font-weight:900;">{{ c['p']['blue'] | round(0) | int if c['p']['blue'] is not none else '--' }}</div>
                      </div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;">
                        <div style="font-size:7px;color:#666;">CLEAR</div>
                        <div style="font-size:11px;font-weight:900;">{{ c['p']['clear'] | round(0) | int if c['p']['clear'] is not none else '--' }}</div>
                      </div>
                    </div>

                    <div style="text-align:center;color:#777;font-size:8px;margin-top:6px;">
                      MISSION {% if c['p']['mission'] is not none %}{{ c['p']['mission'] | round(1) }} s{% else %}--{% endif %}
                    </div>
                  </div>
                {% endfor %}
              </div>

              <div style="background:#080808;border:1px solid #222;border-radius:14px;padding:10px;">
                <div style="position:relative;width:100%;height:260px;">
                  <svg viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:260px;display:block;position:absolute;inset:0;">
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>

                    {% if count > 1 %}
                      <polyline
                        points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}"
                        fill="none"
                        stroke="{{ color }}"
                        stroke-width="3"
                        vector-effect="non-scaling-stroke"
                        stroke-linejoin="round"
                        stroke-linecap="round"/>
                    {% endif %}

                    {% for c in graph.coords %}
                      <circle cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}">
                        <title>{{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }}</title>
                      </circle>
                    {% endfor %}
                  </svg>

                  {% for c in graph.coords %}
                    <label
                      class="color-choice"
                      for="{{ field }}-pick-{{ c['index'] }}"
                      title="Sample {{ c['index'] }} — {{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }}"
                      style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3;">
                    </label>
                  {% endfor %}
                </div>

                <div style="display:flex;justify-content:space-between;color:#888;font-size:10px;font-weight:800;margin-top:-3px;">
                  <span>0 s</span>
                  <span>{{ recorded }}</span>
                  <span>{{ duration }} s</span>
                </div>
              </div>

              <div style="margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px;">
                <div style="font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:5px;">SAMPLE DETAIL</div>

                {% for c in graph.coords %}
                  <label class="color-choice" for="{{ field }}-pick-{{ c['index'] }}" style="display:grid;grid-template-columns:54px 1fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:5px 0;border-top:1px solid #181818;font-size:9px;">
                    <div style="color:#888;">{{ c['p']['time'] }}</div>
                    <div><span style="color:#777;">R </span>{{ c['p']['red'] | round(0) | int if c['p']['red'] is not none else '--' }}</div>
                    <div><span style="color:#777;">G </span>{{ c['p']['green'] | round(0) | int if c['p']['green'] is not none else '--' }}</div>
                    <div><span style="color:#777;">B </span>{{ c['p']['blue'] | round(0) | int if c['p']['blue'] is not none else '--' }}</div>
                    <div><span style="color:#777;">C </span>{{ c['p']['clear'] | round(0) | int if c['p']['clear'] is not none else '--' }}</div>
                  </label>
                {% endfor %}
              </div>

              <label class="color-choice" for="{{ field }}-pick-{{ count }}" style="display:block;margin-top:10px;text-align:center;font-size:11px;color:#888;">
                LAST {{ latest_value | round(decimals) }}
              </label>

              <div style="height:7px;background:{{ color }};border-radius:8px;margin-top:13px;"></div>
            </div>

          {% else %}

            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center;">
              <div style="font-size:20px;font-weight:900;">{{ label }}</div>
              <div style="color:#888;margin-top:12px;">No time-series samples found for this scan.</div>
            </div>

          {% endif %}
        {% endmacro %}
        {% set red_popup = sensor_popup('red','RED','#ef4444',0) %} {% set green_popup = sensor_popup('green','GREEN','#22c55e',0) %} {% set blue_popup = sensor_popup('blue','BLUE','#3b82f6',0) %} {% set clear_popup = sensor_popup('clear','CLEAR','#cbd5e1',0) %}
        <style>
          .env-card {
            background:#000;
            border:0;
            border-radius:38px;
            padding:10px 18px 10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }

          .env-topline {
            height:7px;
            background:#8296ff;
            margin:-5px -18px 10px -18px;
          }

          .env-bottomline {
            height:7px;
            background:#8e87b6;
            margin:10px -18px -5px -18px;
          }

          .env-title {
            color:#fff;
            text-align:center;
            font-size:18px;
            font-weight:800;
            letter-spacing:1px;
            margin:0 0 7px 0;
          }

          .env-row {
            display:grid;
            height:30px;
            margin:4px 0;
            cursor:pointer;
            user-select:none;
          }

          .env-row:hover {
            filter:brightness(1.08);
          }

          .env-row.left {
            grid-template-columns:52px 1fr 1.75fr;
          }

          .env-row.right {
            grid-template-columns:1.75fr 1fr 52px;
          }

          .env-cap {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
          }

          .leftcap {
            border-radius:15px 0 0 15px;
          }

          .rightcap {
            border-radius:0 15px 15px 0;
          }

          .env-value {
            background:#000;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:17px;
            font-weight:800;
            white-space:nowrap;
          }

          .env-label {
            color:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-size:9px;
            font-weight:800;
            padding:0 6px;
          }

          .round-right {
            border-radius:0 15px 15px 0;
          }

          .round-left {
            border-radius:15px 0 0 15px;
          }

          ha-icon {
            --mdc-icon-size:16px;
          }
        </style>
        <div class="env-card">
          <div class="env-topline"></div>

          <div class="env-title">
            COLOR
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"RED SCAN",content:{{ red_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#ef4444;">
              <ha-icon icon="mdi:palette"></ha-icon>
            </div>

            <div class="env-value">
              {{ (red | round(0) | int) if red is not none else '--' }}
            </div>

            <div class="env-label round-right" style="background:#ef4444;">
              RED
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"GREEN SCAN",content:{{ green_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#22c55e;">
              GREEN
            </div>

            <div class="env-value">
              {{ (green | round(0) | int) if green is not none else '--' }}
            </div>

            <div class="env-cap rightcap" style="background:#22c55e;">
              <ha-icon icon="mdi:palette"></ha-icon>
            </div>
          </div>

          <div
            class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"BLUE SCAN",content:{{ blue_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-cap leftcap" style="background:#3b82f6;">
              <ha-icon icon="mdi:palette"></ha-icon>
            </div>

            <div class="env-value">
              {{ (blue | round(0) | int) if blue is not none else '--' }}
            </div>

            <div class="env-label round-right" style="background:#3b82f6;">
              BLUE
            </div>
          </div>

          <div
            class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"CLEAR SCAN",content:{{ clear_popup | to_json }},initial_style:"normal"}}}}))'
          >
            <div class="env-label round-left" style="background:#cbd5e1;">
              CLEAR
            </div>

            <div class="env-value">
              {{ (clear | round(0) | int) if clear is not none else '--' }}
            </div>

            <div class="env-cap rightcap" style="background:#cbd5e1;">
              <ha-icon icon="mdi:palette-outline"></ha-icon>
            </div>
          </div>

          <div class="env-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
            padding:2px !important;
            border:none !important;
            border-radius:40px !important;
            box-shadow:none !important;
            overflow:hidden !important;
          }
    - type: custom:html-template-card
      ignore_line_breaks: true
      entities:
      - input_number.tric_heading
      - input_number.tric_accel_x
      - input_number.tric_accel_y
      - input_number.tric_accel_z
      - input_datetime.tric_orientation_time
      - sensor.tricorder_mission_scans
      - input_text.tric_archive_mission_id
      content: |
        {# Use ONLY the selected mission. Do not use the latest live helpers. #} {% set selected_mid = states('input_text.tric_archive_mission_id') | trim %} {% set heading_unit = '°' %} {% set accel_x_unit = 'm/s²' %} {% set accel_y_unit = 'm/s²' %} {% set accel_z_unit = 'm/s²' %}
        {% set scan_results =
             state_attr('sensor.tricorder_mission_scans', 'results') or [] %}
        {% set scan_series = [] %} {% if scan_results and scan_results[0].get('series') %}
          {% set scan_series = scan_results[0]['series'] %}
        {% endif %}
        {% set orient = namespace(columns=[], rows=[]) %} {% for series in scan_series %}
          {% if series.get('name', '') == 'tricorder_orientation' %}
            {% set orient.columns = series.get('columns', []) %}
            {% set orient.rows = series.get('values', []) %}
          {% endif %}
        {% endfor %}
        {# Ignore previous mission data while the HA sensor refreshes. #} {% set mission_rows = namespace(rows=[]) %} {% if selected_mid and 'mission_id' in orient.columns %}
          {% set mi = orient.columns.index('mission_id') %}
          {% for row in orient.rows %}
            {% if row[mi] | string == selected_mid %}
              {% set mission_rows.rows = mission_rows.rows + [row] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# Keep only the most recent contiguous scan in that mission. #} {% set orient_cluster = namespace(rows=[], active=true, last_ts=none) %} {% if mission_rows.rows and 'time' in orient.columns %}
          {% set ti = orient.columns.index('time') %}
          {% for row in mission_rows.rows | reverse %}
            {% if orient_cluster.active %}
              {% set dt = as_datetime(row[ti], none) %}
              {% if dt is not none %}
                {% set ts = as_timestamp(dt) %}
                {% if orient_cluster.last_ts is none or
                      (orient_cluster.last_ts - ts) <= 2.5 %}
                  {% set orient_cluster.rows = [row] + orient_cluster.rows %}
                  {% set orient_cluster.last_ts = ts %}
                {% else %}
                  {% set orient_cluster.active = false %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {# A final null telemetry row must not erase valid scan readings. #} {% set vals = namespace(heading=none, x=none, y=none, z=none,
                                recorded='--') %}
        {% if orient_cluster.rows and 'time' in orient.columns %}
          {% set ti = orient.columns.index('time') %}
          {% for row in orient_cluster.rows %}
            {% if 'heading_deg' in orient.columns and
                  row[orient.columns.index('heading_deg')] is not none %}
              {% set vals.heading = row[orient.columns.index('heading_deg')] %}
            {% endif %}
            {% if 'accel_x' in orient.columns and
                  row[orient.columns.index('accel_x')] is not none %}
              {% set vals.x = row[orient.columns.index('accel_x')] %}
            {% endif %}
            {% if 'accel_y' in orient.columns and
                  row[orient.columns.index('accel_y')] is not none %}
              {% set vals.y = row[orient.columns.index('accel_y')] %}
            {% endif %}
            {% if 'accel_z' in orient.columns and
                  row[orient.columns.index('accel_z')] is not none %}
              {% set vals.z = row[orient.columns.index('accel_z')] %}
            {% endif %}
            {% set dt = as_datetime(row[ti], none) %}
            {% if dt is not none %}
              {% set vals.recorded = dt.strftime('%m/%d/%Y %H:%M:%S') %}
            {% endif %}
          {% endfor %}
        {% endif %} {% set orientation_recorded = vals.recorded %} {% set heading = vals.heading %} {% set accel_x = vals.x %} {% set accel_y = vals.y %} {% set accel_z = vals.z %}
        {% macro sensor_popup(columns, rows, field, label, unit, color,
                               recorded, decimals=1) %}
          {% set ns = namespace(points=[], values=[], first_ts=none, last_ts=none) %}

          {% if field in columns and 'time' in columns %}
            {% set fi = columns.index(field) %}
            {% set ti = columns.index('time') %}

            {% for row in rows %}
              {% if row[fi] is not none %}
                {% set dt = as_datetime(row[ti]) %}
                {% if dt %}
                  {% set ts = as_timestamp(dt) %}
                  {% set heading_v = row[columns.index('heading_deg')] if 'heading_deg' in columns else none %}
                  {% set ax_v = row[columns.index('accel_x')] if 'accel_x' in columns else none %}
                  {% set ay_v = row[columns.index('accel_y')] if 'accel_y' in columns else none %}
                  {% set az_v = row[columns.index('accel_z')] if 'accel_z' in columns else none %}
                  {% set mission_v = row[columns.index('elapsed_seconds')] if 'elapsed_seconds' in columns else none %}
                  {% if ns.first_ts is none %}
                    {% set ns.first_ts = ts %}
                  {% endif %}
                  {% set ns.last_ts = ts %}
                  {% set ns.values = ns.values + [row[fi] | float(0)] %}
                  {% set ns.points = ns.points + [{
                    'ts': ts,
                    'value': row[fi] | float(0),
                    'time': dt.strftime('%H:%M:%S'),
                    'mission': mission_v,
                    'heading': heading_v,
                    'ax': ax_v,
                    'ay': ay_v,
                    'az': az_v
                  }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% set count = ns.points | count %}

          {% if count %}
            {% set minval = ns.values | min %}
            {% set maxval = ns.values | max %}
            {% set avgval = (ns.values | sum) / count %}
            {% set latest_value = ns.values[-1] %}

            {% if count > 1 %}
              {% set span = ns.last_ts - ns.first_ts %}
              {% set duration = (span + 1) | round(0) | int %}
            {% else %}
              {% set span = 0 %}
              {% set duration = 1 %}
            {% endif %}

            {% set picks = namespace(mini=1, maxi=1, min_found=false, max_found=false) %}
            {% for p in ns.points %}
              {% if not picks.min_found and p['value'] == minval %}
                {% set picks.mini = loop.index %}
                {% set picks.min_found = true %}
              {% endif %}
              {% if not picks.max_found and p['value'] == maxval %}
                {% set picks.maxi = loop.index %}
                {% set picks.max_found = true %}
              {% endif %}
            {% endfor %}

            {% set graph = namespace(coords=[]) %}
            {% for p in ns.points %}
              {% if span <= 0 %}
                {% set x = 150 %}
                {% set offset = 0 %}
              {% else %}
                {% set x = 14 + (((p['ts'] - ns.first_ts) / span) * 272) %}
                {% set offset = p['ts'] - ns.first_ts %}
              {% endif %}

              {% if maxval == minval %}
                {% set y = 70 %}
              {% else %}
                {% set y = 126 - (((p['value'] - minval) /
                                   (maxval - minval)) * 106) %}
              {% endif %}

              {% set graph.coords = graph.coords + [{
                'x': x | round(1),
                'y': y | round(1),
                'left': ((x / 300) * 100) | round(3),
                'top': ((y / 150) * 100) | round(3),
                'offset': offset | round(1),
                'index': loop.index,
                'p': p
              }] %}
            {% endfor %}

            <div class="ori-popup" style="background:#000;color:#fff;padding:16px;font-family:Antonio,Arial Narrow,sans-serif;box-sizing:border-box;">
              <style>
                .ori-radio { position:absolute; opacity:0; pointer-events:none; }
                .ori-choice { cursor:pointer; }
                .ori-choice:hover { filter:brightness(1.12); }
                .ori-selected { display:none; }
                .ori-selected-empty { display:block; }
                {% for c in graph.coords %}
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .ori-selected-wrap .ori-selected-empty { display:none; }
                  #{{ field }}-pick-{{ c['index'] }}:checked ~ .ori-selected-wrap .ori-selected-{{ c['index'] }} { display:block; }
                {% endfor %}
              </style>

              {% for c in graph.coords %}
                <input class="ori-radio" type="radio" name="{{ field }}-pick" id="{{ field }}-pick-{{ c['index'] }}">
              {% endfor %}

              <div style="height:7px;background:{{ color }};border-radius:8px;margin-bottom:13px;"></div>
              <div style="text-align:center;font-size:22px;font-weight:900;letter-spacing:1px;">{{ label }}</div>
              <div style="text-align:center;color:{{ color }};font-size:11px;font-weight:800;letter-spacing:1px;margin:3px 0 14px 0;">{{ duration }} SECOND SCAN</div>

              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;">
                <label class="ori-choice" for="{{ field }}-pick-{{ picks.mini }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MIN</div>
                  <div style="font-size:15px;font-weight:900;">{{ minval | round(decimals) }} <span style="font-size:8px;color:#aaa;">{{ unit }}</span></div>
                </label>
                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">AVG</div>
                  <div style="font-size:15px;font-weight:900;">{{ avgval | round(decimals) }} <span style="font-size:8px;color:#aaa;">{{ unit }}</span></div>
                </div>
                <label class="ori-choice" for="{{ field }}-pick-{{ picks.maxi }}" style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">MAX</div>
                  <div style="font-size:15px;font-weight:900;">{{ maxval | round(decimals) }} <span style="font-size:8px;color:#aaa;">{{ unit }}</span></div>
                </label>
                <div style="background:#111;border-radius:11px;padding:8px;text-align:center;">
                  <div style="font-size:8px;color:#777;">SAMPLES</div>
                  <div style="font-size:15px;font-weight:900;">{{ count }}</div>
                </div>
              </div>

              <div class="ori-selected-wrap" style="background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:9px;margin-bottom:12px;min-height:55px;">
                <div class="ori-selected-empty" style="text-align:center;color:#777;font-size:10px;font-weight:800;letter-spacing:.7px;padding:17px 0;">TAP A POINT OR SAMPLE TO INSPECT</div>
                {% for c in graph.coords %}
                  <div class="ori-selected ori-selected-{{ c['index'] }}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                      <div style="font-size:11px;font-weight:900;color:{{ color }};letter-spacing:.8px;">SAMPLE {{ c['index'] }}</div>
                      <div style="font-size:10px;color:#aaa;">{{ c['p']['time'] }} · +{{ c['offset'] }} s</div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;">
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;"><div style="font-size:7px;color:#666;">HEAD</div><div style="font-size:11px;font-weight:900;">{{ c['p']['heading'] | round(1) if c['p']['heading'] is not none else '--' }}{% if c['p']['heading'] is not none %}°{% endif %}</div></div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;"><div style="font-size:7px;color:#666;">Ax</div><div style="font-size:11px;font-weight:900;">{{ c['p']['ax'] | round(3) if c['p']['ax'] is not none else '--' }}{% if c['p']['ax'] is not none %} m/s²{% endif %}</div></div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;"><div style="font-size:7px;color:#666;">Ay</div><div style="font-size:11px;font-weight:900;">{{ c['p']['ay'] | round(3) if c['p']['ay'] is not none else '--' }}{% if c['p']['ay'] is not none %} m/s²{% endif %}</div></div>
                      <div style="background:#050505;border-radius:8px;padding:6px;text-align:center;"><div style="font-size:7px;color:#666;">Az</div><div style="font-size:11px;font-weight:900;">{{ c['p']['az'] | round(3) if c['p']['az'] is not none else '--' }}{% if c['p']['az'] is not none %} m/s²{% endif %}</div></div>
                    </div>
                    <div style="text-align:center;color:#777;font-size:8px;margin-top:6px;">MISSION {% if c['p']['mission'] is not none %}{{ c['p']['mission'] | round(1) }} s{% else %}--{% endif %}</div>
                  </div>
                {% endfor %}
              </div>

              <div style="background:#080808;border:1px solid #222;border-radius:14px;padding:10px;">
                <div style="position:relative;width:100%;height:260px;">
                  <svg viewBox="0 0 300 150" preserveAspectRatio="none" style="width:100%;height:260px;display:block;position:absolute;inset:0;">
                    <line x1="14" y1="126" x2="286" y2="126" stroke="#333" stroke-width="1"/>
                    <line x1="14" y1="20" x2="14" y2="126" stroke="#333" stroke-width="1"/>
                    {% if count > 1 %}
                      <polyline points="{% for c in graph.coords %}{{ c['x'] }},{{ c['y'] }} {% endfor %}" fill="none" stroke="{{ color }}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                    {% endif %}
                    {% for c in graph.coords %}
                      <circle cx="{{ c['x'] }}" cy="{{ c['y'] }}" r="5" fill="{{ color }}"><title>{{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }} {{ unit }}</title></circle>
                    {% endfor %}
                  </svg>
                  {% for c in graph.coords %}
                    <label class="ori-choice" for="{{ field }}-pick-{{ c['index'] }}" title="Sample {{ c['index'] }} — {{ c['p']['time'] }} — {{ c['p']['value'] | round(decimals) }} {{ unit }}" style="position:absolute;left:{{ c['left'] }}%;top:{{ c['top'] }}%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;z-index:3;"></label>
                  {% endfor %}
                </div>
                <div style="display:flex;justify-content:space-between;color:#888;font-size:10px;font-weight:800;margin-top:-3px;">
                  <span>0 s</span><span>{{ recorded }}</span><span>{{ duration }} s</span>
                </div>
              </div>

              <div style="margin-top:12px;background:#0b0b0b;border:1px solid #222;border-radius:12px;padding:8px;">
                <div style="font-size:9px;color:#888;font-weight:800;letter-spacing:1px;margin-bottom:5px;">SAMPLE DETAIL</div>
                {% for c in graph.coords %}
                  <label class="ori-choice" for="{{ field }}-pick-{{ c['index'] }}" style="display:grid;grid-template-columns:44px 1fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:5px 0;border-top:1px solid #181818;font-size:9px;">
                    <div style="color:#888;">{{ c['p']['time'] }}</div>
                    <div><span style="color:#777;">H </span>{{ c['p']['heading'] | round(1) if c['p']['heading'] is not none else '--' }}</div>
                    <div><span style="color:#777;">X </span>{{ c['p']['ax'] | round(3) if c['p']['ax'] is not none else '--' }}</div>
                    <div><span style="color:#777;">Y </span>{{ c['p']['ay'] | round(3) if c['p']['ay'] is not none else '--' }}</div>
                    <div><span style="color:#777;">Z </span>{{ c['p']['az'] | round(3) if c['p']['az'] is not none else '--' }}</div>
                  </label>
                {% endfor %}
              </div>

              <label class="ori-choice" for="{{ field }}-pick-{{ count }}" style="display:block;margin-top:10px;text-align:center;font-size:11px;color:#888;">LAST {{ latest_value | round(decimals) }} {{ unit }}</label>
              <div style="height:7px;background:{{ color }};border-radius:8px;margin-top:13px;"></div>
            </div>
          {% else %}
            <div style="background:#000;color:#fff;padding:22px;font-family:Antonio,Arial Narrow,sans-serif;text-align:center;">
              <div style="font-size:20px;font-weight:900;">{{ label }}</div>
              <div style="color:#888;margin-top:12px;">No time-series samples found for this scan.</div>
            </div>
          {% endif %}
        {% endmacro %}
        {% set heading_popup = sensor_popup(
          orient.columns, orient_cluster.rows,
          'heading_deg','HEADING','°','#8296ff',
          orientation_recorded,1) %}

        {% set accel_x_popup = sensor_popup(
          orient.columns, orient_cluster.rows,
          'accel_x','ACCELERATION X','m/s²','#ef4444',
          orientation_recorded,3) %}

        {% set accel_y_popup = sensor_popup(
          orient.columns, orient_cluster.rows,
          'accel_y','ACCELERATION Y','m/s²','#22c55e',
          orientation_recorded,3) %}

        {% set accel_z_popup = sensor_popup(
          orient.columns, orient_cluster.rows,
          'accel_z','ACCELERATION Z','m/s²','#3b82f6',
          orientation_recorded,3) %}

        <style>
          .env-card {
            background:#000;
            border:0;
            border-radius:38px;
            padding:10px 18px;
            overflow:hidden;
            font-family:"Antonio","Arial Narrow",sans-serif;
            box-sizing:border-box;
          }
          .env-topline {height:7px;background:#8296ff;margin:-5px -18px 10px -18px;}
          .env-bottomline {height:7px;background:#8e87b6;margin:10px -18px -5px -18px;}
          .env-title {color:#fff;text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;margin:0 0 7px 0;}
          .env-row {display:grid;height:30px;margin:4px 0;cursor:pointer;user-select:none;}
          .env-row:hover {filter:brightness(1.08);}
          .env-row.left {grid-template-columns:52px 1fr 1.75fr;}
          .env-row.right {grid-template-columns:1.75fr 1fr 52px;}
          .env-cap {color:#000;display:flex;align-items:center;justify-content:center;}
          .leftcap {border-radius:15px 0 0 15px;}
          .rightcap {border-radius:0 15px 15px 0;}
          .env-value {background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:800;white-space:nowrap;padding:0 4px;}
          .unit {font-size:9px;font-weight:600;margin-left:3px;}
          .env-label {color:#000;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:800;padding:0 6px;}
          .round-right {border-radius:0 15px 15px 0;}
          .round-left {border-radius:15px 0 0 15px;}
          ha-icon {--mdc-icon-size:16px;}
        </style>
        <div class="env-card">
          <div class="env-topline"></div>
          <div class="env-title">ORIENTATION</div>

          <div class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"HEADING SCAN",content:{{ heading_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="env-cap leftcap" style="background:#8296ff;"><ha-icon icon="mdi:compass-outline"></ha-icon></div>
            <div class="env-value">{% if heading is not none %}{{ '%.1f' | format(heading | float) }}<span class="unit">{{ heading_unit }}</span>{% else %}--{% endif %}</div>
            <div class="env-label round-right" style="background:#8296ff;">HEADING</div>
          </div>

          <div class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"ACCELERATION X SCAN",content:{{ accel_x_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="env-cap leftcap" style="background:#ef4444;"><ha-icon icon="mdi:axis-x-arrow"></ha-icon></div>
            <div class="env-value">{% if accel_x is not none %}{{ '%.3f' | format(accel_x | float) }}<span class="unit">{{ accel_x_unit }}</span>{% else %}--{% endif %}</div>
            <div class="env-label round-right" style="background:#ef4444;">ACCELERATION X</div>
          </div>

          <div class="env-row right"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"ACCELERATION Y SCAN",content:{{ accel_y_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="env-label round-left" style="background:#22c55e;">ACCELERATION Y</div>
            <div class="env-value">{% if accel_y is not none %}{{ '%.3f' | format(accel_y | float) }}<span class="unit">{{ accel_y_unit }}</span>{% else %}--{% endif %}</div>
            <div class="env-cap rightcap" style="background:#22c55e;"><ha-icon icon="mdi:axis-y-arrow"></ha-icon></div>
          </div>

          <div class="env-row left"
            onclick='this.dispatchEvent(new CustomEvent("ll-custom",{bubbles:true,composed:true,detail:{browser_mod:{service:"browser_mod.popup",data:{title:"ACCELERATION Z SCAN",content:{{ accel_z_popup | to_json }},initial_style:"normal"}}}}))'>
            <div class="env-cap leftcap" style="background:#3b82f6;"><ha-icon icon="mdi:axis-z-arrow"></ha-icon></div>
            <div class="env-value">{% if accel_z is not none %}{{ '%.3f' | format(accel_z | float) }}<span class="unit">{{ accel_z_unit }}</span>{% else %}--{% endif %}</div>
            <div class="env-label round-right" style="background:#3b82f6;">ACCELERATION Z</div>
          </div>

          <div class="env-bottomline"></div>
        </div>
      card_mod:
        style: |
          ha-card {
            background:#29364c !important;
