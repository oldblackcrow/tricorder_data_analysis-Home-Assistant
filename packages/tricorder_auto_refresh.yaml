# Automatic post-uplink refresh for the TR-460 mission archive.
#
# The existing Tricorder Upload Receiver automation must fire
#   - event: tricorder_archive_received
# at the END of its actions, after the archive has been written
# and any thermal/audio reconstruction shell commands have run.
#
# Each incoming record restarts an 8-second quiet-period timer.
# The four archive sensors refresh ONCE after the last record,
# rather than expensively re-reading the archive for each WAV chunk.

automation:
  - id: tricorder_archive_refresh_after_uplink
    alias: Tricorder Archive - Refresh After Uplink
    description: Refresh selected mission, comparison and catalog after uploads settle.
    triggers:
      - trigger: event
        event_type: tricorder_archive_received
    actions:
      - delay: "00:00:08"
      - action: homeassistant.update_entity
        data:
          entity_id:
            - sensor.tricorder_mission_catalog
            - sensor.tricorder_mission_events
            - sensor.tricorder_mission_scans
            - sensor.tricorder_comparison_mission_scans
            - sensor.tricorder_captain_s_logs
      - action: persistent_notification.create
        data:
          title: "TR-460 Subspace Uplink"
          message: "New tricorder data has arrived in Home Assistant. Mission archive sensors have been refreshed."
          notification_id: tricorder_uplink_received
    mode: restart

# Private Captain's Logs: only the short metadata list goes into HA state.
# The .adp originals stay under /config/tricorder/captains.
# Browser-playable .wav copies stay in authenticated /media/tricorder_captains.
command_line:
  - sensor:
      name: Tricorder Captain's Logs
      unique_id: tricorder_captains_logs
      command: >-
        python3 /config/tricorder/tricorder_archive_reader.py captains
      command_timeout: 15
      scan_interval: 86400
      value_template: >-
        {{ value_json.get('count', 0) | int(0) }}
      json_attributes:
        - results
