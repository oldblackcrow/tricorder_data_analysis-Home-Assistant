# Complete replacement YAML for the EXISTING "TR-460 Tricorder Router"
# automation (edit that automation in YAML mode; do not create a second router).
# The only behavior change is a thermal-first route to the existing analysis script.
alias: TR-460 Tricorder Router
description: Route any Assist request containing tricorder to Computer Science
triggers:
  - trigger: conversation
    command:
      - tricorder
      - tricorder {after}
      - '{before} tricorder'
      - '{before} tricorder {after}'
conditions: []
actions:
  - choose:
      # Thermal-analysis requests must take priority over the generic report.
      - conditions:
          - condition: template
            value_template: |
              {% set s = trigger.sentence | lower %}
              {{ 'thermal' in s }}
        sequence:
          - action: script.analyze_tricorder_thermal_image
            data: {}
            response_variable: thermal_reply
          - action: persistent_notification.create
            data:
              title: TR-460 Thermal Analysis
              message: |
                {{ thermal_reply.report | default('No thermal analysis was returned.', true) }}
          - set_conversation_response: |
              {{ thermal_reply.report | default('No thermal analysis was returned.', true) }}
      # General diagnostic now also includes thermal image interpretation.
      # Audio analysis is not yet implemented: never infer sound identities.
      - conditions:
          - condition: template
            value_template: |
              {% set s = trigger.sentence | lower %} {{
                'run a tricorder diagnostic' in s
                or 'tricorder diagnostic' in s
                or 'analyze the tricorder data' in s
                or 'tricorder analysis' in s
              }}
        sequence:
          - action: script.tr_460_science_diagnostic
            data: {}
            response_variable: science_reply
          # Thermal is optional; an absent archive must not break diagnostics.
          - action: script.analyze_tricorder_thermal_image
            data: {}
            response_variable: thermal_reply
            continue_on_error: true
          - variables:
              science_summary: "{{ science_reply.response.speech.plain.speech }}"
              thermal_summary: >-
                {% if thermal_reply is defined and thermal_reply is mapping
                      and (thermal_reply.status | default('error')) in ['ok', 'partial'] %}
                  {{ thermal_reply.report | default('No thermal findings were returned.', true) }}
                {% else %}
                  Detailed thermal image interpretation is unavailable.
                {% endif %}
          # Summarize text returned by both existing scripts; do not reprocess
          # raw audio, claim sound recognition, or speculate about identity.
          - action: ai_task.generate_data
            data:
              task_name: TR-460 Concise Combined Diagnostic
              instructions: >-
                Turn the following general TR-460 measurements and separate
                thermal image interpretation into ONE natural spoken report
                of at most 100 words. Give the most useful overall findings
                rather than reciting all numeric values; include at most two
                important figures. Mention the thermal pattern and any shape
                resemblance already supported by its image interpretation.
                Phrase shape suggestions cautiously, e.g. "may resemble a
                hand"; do not assert an object or organism was identified.
                If images were unavailable, do not pretend they were seen.
                Audio recognition/analysis has NOT been implemented: if
                acoustic measurements are mentioned, describe only measured
                activity, never a sound type or source. Preserve significant
                anomalies and uncertainty; do not invent missing results.
                Use plain spoken English, no markdown. General diagnostic:
                {{ science_summary | to_json }}. Thermal image result:
                {{ thermal_summary | to_json }}.
            response_variable: combined_reply
            continue_on_error: true
          - variables:
              spoken_report: >-
                {% if combined_reply is defined and combined_reply is mapping
                      and combined_reply.data is defined and combined_reply.data %}
                  {{ combined_reply.data }}
                {% else %}
                  {{ science_summary }} {{ thermal_summary }}
                {% endif %}
          - action: persistent_notification.create
            data:
              title: TR-460 Diagnostic
              message: |
                {{ spoken_report }}
          - set_conversation_response: |
              {{ spoken_report }}
    default:
      - action: script.tr_460_science_diagnostic
        data:
          followup_question: '{{ trigger.sentence }}'
        response_variable: science_reply
      - action: persistent_notification.create
        data:
          title: TR-460 Science Follow-up
          message: |
            {{ science_reply.response.speech.plain.speech }}
      - set_conversation_response: |
          {{ science_reply.response.speech.plain.speech }}
mode: single
