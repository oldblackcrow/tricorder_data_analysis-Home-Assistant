# COPY into automations.yaml after replacing the webhook_id. Do not commit your live webhook.
# The obsolete InfluxDB writes were removed; the JSONL File notifier is retained.
- id: tricorder_upload_receiver_example
  alias: Tricorder Upload Receiver
  description: Receives local JSON uploads from Tricorder.
  triggers:
  - trigger: webhook
    webhook_id: REPLACE_WITH_PRIVATE_RANDOM_WEBHOOK_ID
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.file
    data:
      message: '{{ trigger.json | to_json }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.get('record_type', '') in\n   ['scan_summary', 'radiation_scan']\
          \ }}\n"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.radiation_cpm
        data:
          value: '{{ trigger.json.get(''cpm'', 0) | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.radiation_dose
        data:
          value: '{{ trigger.json.get(''dose_usvh'', 0) | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.radiation_pulses
        data:
          value: '{{ trigger.json.get(''pulses'', 0) | int(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.radiation_duration
        data:
          value: '{{ trigger.json.get(''duration_seconds'', 0) | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.radiation_record_id
        data:
          value: "{{ trigger.json.get(\n     'id',\n     trigger.json.get('radiation_record_id', 0)\n\
            \   ) | int(0) }}\n"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.radiation_scan_time
        data:
          datetime: "{{ trigger.json.get('time', '2000-01-01T00:00:00')\n   | replace('T', ' ') }}\n"
      - action: input_text.set_value
        target:
          entity_id: input_text.radiation_scan_status
        data:
          value: "{{ trigger.json.get(\n     'scan_status',\n     trigger.json.get('status', 'unknown')\n\
            \   ) }}\n"
      - if:
        - condition: template
          value_template: '{{ trigger.json.get(''elapsed_seconds'') is not none }}

            '
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.tric_radiation_elapsed
          data:
            value: '{{ trigger.json.get(''elapsed_seconds'') | float(0) }}'
        else:
        - action: input_number.set_value
          target:
            entity_id: input_number.tric_radiation_elapsed
          data:
            value: -1
    - conditions:
      - condition: template
        value_template: '{{ trigger.json.get(''record_type'', '''') == ''atmosphere_scan'' }}

          '
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.tric_temperature
        data:
          value: '{{ ((trigger.json.get(''temperature_c'', 0) | float(0)) * 1.8) + 32 }}

            '
      - action: input_number.set_value
        target:
          entity_id: input_number.tric_humidity
        data:
          value: '{{ trigger.json.get(''humidity_percent'', 0) | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.tric_pressure
        data:
