          data:
            value: '{{ trigger.json.get(''elapsed_seconds'') | float(0) }}'
        else:
        - action: input_number.set_value
          target:
            entity_id: input_number.tric_atmosphere_elapsed
          data:
            value: -1
      - action: input_text.set_value
        target:
          entity_id: input_text.tric_scan_type
        data:
          value: Atmosphere
    - conditions:
      - condition: template
        value_template: '{{ trigger.json.get(''record_type'', '''') == ''orientation_scan'' }}

