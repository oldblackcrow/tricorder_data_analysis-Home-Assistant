        - condition: template
          value_template: "{% set avail = trigger.json.get(\n     'available',\n     trigger.json.get('thermal_available',\
            \ none)\n   ) %}\n{{ (avail | bool) if avail is not none else\n   (trigger.json.get(\n   \
            \   'center_c',\n      trigger.json.get('thermal_center_c', none)\n    ) is not none) }}\n"
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.tric_thermal_available
        else:
