      - action: input_number.set_value
        target:
          entity_id: input_number.tric_tvoc
        data:
          value: '{{ trigger.json.get(''tvoc_ppb'', 0) | int(0) }}'
      - if:
        - condition: template
          value_template: '{{ trigger.json.get(''handheld_linked'', false) | bool }}

            '
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.tric_handheld_linked
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.tric_handheld_linked
      - action: input_datetime.set_datetime
        target:
